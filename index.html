<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Whirlpop</title>
<meta name="description" content="Whirlpop — juego arcade de piezas que caen sobre un tablero que gira.">
<meta name="theme-color" content="#06060c">
<!-- nombre con el que se guarda en la pantalla de inicio en iOS -->
<meta name="apple-mobile-web-app-title" content="Whirlpop">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- previsualización al compartir la URL -->
<meta property="og:title" content="Whirlpop">
<meta property="og:description" content="Juego arcade de piezas que caen sobre un tablero que gira.">
<meta property="og:type" content="website">
<style>
  /* La columna vertical de la que cuelga todo el layout. El JS la reescribe en
     cada resize; este valor es el fallback hasta que arranca. --u = 1% de la
     columna: toda medida de UI se expresa en múltiplos suyos, con suelo en px. */
  :root { --stage: min(100vw, 64.5vh);
          --u: calc(var(--stage) / 100); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#06060c;
              user-select:none; -webkit-user-select:none;
              font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  #c { display:block; width:100%; height:100%; touch-action:none; }
  /* HUD: pertenece a la columna, se reparte sobre --stage y escala con --u.
     Los dos marcadores viven abajo, en fila y con la misma composición —etiqueta
     encima, número debajo—, dejando toda la mitad superior libre.
     pointer-events:none es crítico: el HUD cae justo donde el pulgar empieza el
     arrastre y si captura el gesto, el giro se pierde. */
  #hud { position:fixed; left:50%; transform:translateX(-50%); width:var(--stage);
         bottom:max(calc(var(--u)*3), env(safe-area-inset-bottom));
         display:flex; justify-content:space-around; align-items:flex-start;
         pointer-events:none; }
  .hblock { display:flex; flex-direction:column; align-items:center; }
  /* .lvl-n comparte la regla de las etiquetas del HUD, no la copia: "NIVEL 3" es
     rótulo, del mismo rango que SCORE, no un dato que se consulte. En una sola
     regla no pueden separarse al retocar cualquiera de las dos. */
  .hlabel, .lvl-n { font-size:max(12px, calc(var(--u)*2.9)); letter-spacing:2px;
            line-height:1.3; color:#5c6090; }
  .hval   { font-size:max(22px, calc(var(--u)*6.2)); letter-spacing:1px;
            line-height:1.3; color:#cfd2e6; }
  /* Nivel y micro-tutorial: mismo esqueleto que el HUD, en la franja de arriba.
     La línea "NIVEL X" es permanente y su altura se descuenta del lift en
     resize(). El tip es absolute respecto al bloque, así que NO aporta altura:
     la esfera no salta al aparecer ni al irse el texto, que simplemente se
     superpone sobre la franja alta del área de juego. */
  #lvl { position:fixed; left:50%; transform:translateX(-50%); width:var(--stage);
         top:max(calc(var(--u)*2.4), env(safe-area-inset-top));
         text-align:center; pointer-events:none; }
  /* El tip es la única prosa del juego: se lee una vez, corriendo y a contrarreloj.
     Rompe el monoespaciado del resto de la interfaz a propósito —una frase larga
     en mono se lee peor— y se separa de la línea de nivel para que no se lean
     como un mismo bloque. El fade es asimétrico: entra rápido para no hacerse
     esperar, sale despacio para no cortar al que todavía está leyendo; la clase
     .on conmuta las dos duraciones. */
  .lvl-tip { position:absolute; top:calc(100% + var(--u)*3.2); left:50%;
             transform:translateX(-50%);
             width:84%; font-size:max(15px, calc(var(--u)*3.6)); line-height:1.5;
             font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
             color:#cfd2e6; text-shadow:0 1px 6px rgba(4,4,12,.95);
             opacity:0; transition:opacity .6s ease; }
  .lvl-tip.on { opacity:1; transition:opacity .3s ease; }
  .btn { min-width:132px; padding:0 16px; height:52px; border:1.5px solid #4a4f7a;
         border-radius:8px; background:rgba(30,34,60,.55); color:#cfd2e6; font-size:15px;
         letter-spacing:2px; font-family:inherit; display:flex; align-items:center;
         justify-content:center; user-select:none; cursor:pointer; }
  /* chrome, no HUD: se ancla a la esquina física de la pantalla, no a la
     columna. Anclado a la columna, en landscape --stage se estrecha y el botón
     acaba flotando en mitad del viewport. */
  #fs { position:fixed; top:max(calc(var(--u)*1.6), env(safe-area-inset-top));
        right:max(calc(var(--u)*2), env(safe-area-inset-right));
        width:max(34px, calc(var(--u)*7.7)); height:max(34px, calc(var(--u)*7.7));
        display:flex; align-items:center; justify-content:center; border:1.5px solid #3a3f68;
        border-radius:7px; background:rgba(30,34,60,.5); color:#9aa0cc;
        font-size:max(15px, calc(var(--u)*3.4));
        cursor:pointer; user-select:none; z-index:5; }
  #fs:active { background:rgba(70,80,140,.75); }
  .btn:active { background:rgba(70,80,140,.75); }
  .btn.arm { border-color:#f26b3a; color:#f26b3a; }
  #over { position:fixed; inset:0; display:none; flex-direction:column; gap:calc(var(--u)*2);
          align-items:center; justify-content:center; background:rgba(4,4,10,.82);
          color:#e8e8f4; font-size:max(16px, calc(var(--u)*4)); letter-spacing:2px;
          cursor:pointer; }
  #over b { font-size:max(26px, calc(var(--u)*6.9)); color:#f26b3a; letter-spacing:4px; }
  #over small { font-size:max(11px, calc(var(--u)*2.65)); color:#8a8fb8; letter-spacing:1px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="hblock"><span class="hlabel">SCORE</span><span class="hval" id="score">0</span></div>
  <div class="hblock"><span class="hlabel">PERSONAL BEST</span><span class="hval" id="bestv">0</span></div>
</div>
<div id="lvl">
  <div class="lvl-n">NIVEL 1</div>
  <div class="lvl-tip"></div>
</div>
<div id="fs">⛶</div>
<div id="over"><b>GAME OVER</b><span id="fin">0</span><small>toca para reiniciar</small></div>

<script>
"use strict";

// ─── config ────────────────────────────────────────────────────────────────
const N = 15, C = (N-1)/2;
const R_FACTOR = 0.46;
// mobile first: el layout es siempre una columna vertical. STAGE es su ancho, y
// de él sale todo el tamaño del juego. Único número para abrir o cerrar la
// columna en todas las pantallas a la vez.
const STAGE_ASPECT = 0.645;
const ROT_STEP = 7.5 * Math.PI/180;
const ROT_TWEEN = 26;      // seguimiento de angle hacia angleT; a 340°/s un valor bajo va elástico
const CHAIN_MIN = 3;
const SPAWN_START = 1.8, SPAWN_MIN = 0.95, SPAWN_RAMP = 380;
const BUBBLE_SPEED = 0.185;                 // velocidad inicial
const FALL_ACCEL   = 0.065;                 // aceleración durante la caída
const HARD_SPEED   = 0.95;                  // velocidad mínima tras hard drop
const HARD_ACCEL   = 0.55;                  // y sigue acelerando más fuerte
const SPIRAL_TANGENT = 2.1, SPIRAL_INWARD = 0.085;
// las blancas son una entidad independiente: su propio reloj, su propia velocidad
const WHITE_INT_START = 14, WHITE_INT_MIN = 7.0, WHITE_INT_RAMP = 340;
const WHITE_SPEED = 0.115, WHITE_ACCEL = 0.035;
const WHITE_SPREAD = 50 * Math.PI/180;   // dispersión alrededor del punto opuesto
const STONE_WARN = 14, STONE_TIME = 34;   // 20 s de margen para reaccionar
const TELEGRAPH = 1.25;                     // aviso previo a la salida de cada ficha
const TELEGRAPH_ARC = 35 * Math.PI/180;     // amplitud del aviso
// Sinusoide: no es un tipo de ficha, es otra forma de llegar. Entra por el
// lateral (3 o 9 en punto) y cruza el círculo serpenteando hasta el centro.
// SINE_AMP > R_FACTOR a propósito: mantiene TODOS los giros de la onda fuera del
// campo jugable, donde su curvatura cerradísima no puede colarse entre los dos
// extremos del segmento que traza rayCast() en un frame. Tope duro en ~0.60: por encima, el punto más lejano de
// la trayectoria pasa del descarte de stepFlying() (PS*0.75) y la bola se
// borraría sola en pleno vuelo. SINE_SPEED es velocidad sobre la trayectoria,
// no sobre el eje: mismo ritmo aparente en los tramos verticales.
const SINE_AMP = 0.55, SINE_SPEED = 0.67;
const SINE_MAX_STEP = 0.02;   // avance máximo por subpaso de integración, múltiplo de PS
// Cómo se reparte la velocidad a lo largo de la onda:
//   1 = constante sobre la TRAYECTORIA. Ritmo plano; no frena en las crestas.
//   0 = constante sobre el EJE. La bola frena en las crestas y se lanza en los
//       cruces, como un péndulo.
// Elegido a 0 probándolo: con el ritmo plano la bola pasaba las crestas de
// carrerilla y el giro se leía como un latigazo. Frenando en la curva la onda se
// entiende de un vistazo. Es ortogonal a SINE_SPEED —spawnSine() recalibra cada
// bola contra su propio arco—, así que mover esto NO cambia la duración: reparte
// la misma travesía, y el ritmo se toca solo con SINE_SPEED.
const SINE_EASE = 0;
const SINE_P_START = 0.12, SINE_P_MAX = 0.30, SINE_RAMP = 220;

// elevación de la esfera: sale de la holgura vertical, sin media queries
const LIFT_K   = 0.5;      // fracción de la altura sobrante que se consume
const LIFT_MAX = 0.14;     // tope duro en fracción de STAGE — calibrar en dispositivo
const TOP_KEEP = 0.09;     // aire mínimo sobre la zona de juego, múltiplo de PS
// franja que ocupa la línea "NIVEL X", múltiplo de PS: el margen superior (2.4u)
// más su caja de texto (2.9u de cuerpo por 1.3 de interlínea) y un poco de aire.
// Si se retoca el cuerpo de .hlabel hay que rehacer esta cuenta.
const LVL_BAND = 0.08;

// Los tres anillos concéntricos —gauge, frontera y aviso de salida— forman una
// sola familia: cada uno hacia fuera es 1.5x el anterior, y el aire entre trazos
// contiguos es el mismo en los dos saltos. Los radios del gauge y del aviso se
// derivan de ese aire en resize(), no se escriben a mano, para que la relación
// aguante al calibrar cualquiera de los tres grosores.
const RING_GAP    = 0.0085;      // aire entre trazos contiguos, múltiplo de PS
const GAUGE_W     = 0.008;       // trazo del gauge
const BORDER_W    = 0.012;       // frontera = GAUGE_W * 1.5
const TELE_W      = 0.018;       // aviso    = BORDER_W * 1.5
const TELE_HALO_W = 0.085;       // resplandor del aviso: fuera de la progresión
const GAUGE_A0    = Math.PI;     // ancla: 9 en punto
const GAUGE_TWEEN = 11;          // seguimiento del valor visual hacia el lógico
const GAUGE_FLASH = 0.22;        // destello del anillo cerrado, en segundos
// carga de salida al abrir el nivel 4, sobre 4: el anillo nace casi cerrado para
// que el premio quede a un match de distancia y se vea para qué sirve. Un cuarteto
// (0.55) lo cierra de una; a base de tríos (0.17) hacen falta tres.
const GAUGE_INTRO = 3.6;
const GAUGE_TRACK = "#2a2e4a";
const GAUGE_FILL  = "#ffa06b";
// alerta de muerte. No comparte familia ni con el gauge — que sería concéntrico
// y naranja a la vez — ni con el rojo COL[0] que late detrás en el montón.
const DANGER      = "#ff2d4a";

// 4 colores base + morado, que entra con el nivel 5
const COL = ["#e0392b","#f2c53d","#2f6fd0","#3aa655","#a259e0"];
const WHITE = 8, STONE = 9;                // fuera del rango de índices de color
const PAINT = { 8:"#eef0f6", 9:"#484c5c" };
function numColors(){ return level >= 5 ? 5 : 4; }
// El sistema de carga es la única mecánica que puede adelantarse al calendario:
// con su tutorial ya leído tres veces está disponible desde el frame cero. El
// resto de elementos conserva su reloj y solo pierde el tip. `gaugeEarly` se
// congela en reset(), así que el desbloqueo nunca entra a mitad de partida.
function gaugeOn(){ return level >= 4 || gaugeEarly; }

// ─── niveles ───────────────────────────────────────────────────────────────
// Un único array declarativo manda sobre tiempos, textos y gates: `t` es la
// fuente de verdad y `level` es derivado. Ninguna mecánica conserva ya su propia
// constante de tiempo —todas preguntan por el nivel—, así que mover un `at`
// reordena la partida entera desde aquí. El último nivel es terminal.
// `id` es la identidad estable de cada mecánica y no depende de la posición: el
// almacén guarda los contadores de tutorial por `id`, así que reordenar niveles
// moviendo un `at` no reasigna progresos a la mecánica equivocada.
const LEVELS = [
  { n:1, id:"ctrl",   at:0,   tip:null },   // dinámico: depende del dispositivo, ver tipFor()
  // INVARIANTE: at < STONE_TIME. La edad de una bola nunca supera `t`, así que
  // mientras se cumpla es imposible que aparezca una piedra antes de explicarla
  // y ageBubbles() no necesita preguntar por el nivel. Al subir este `at` por
  // encima de 34 hay que devolverle allí la guarda.
  { n:2, id:"stone",  at:19,  tip:"Si tardas, la bola se vuelve piedra y ya no estalla. El anillo gris avisa." },
  // el tutorial de las blancas llega con una blanca ya en camino: se lee el texto
  // mirando la cosa de la que habla, no esperando 14 s a que aparezca sola.
  { n:3, id:"white",  at:50,  on(){ spawnWhite(); whiteT = whiteInterval(); },
                      tip:"Las bolas blancas estallan con cualquier match que las toque." },
  // Puesta en escena, no mecánica: el anillo aparece de golpe y barriendo hasta
  // GAUGE_INTRO, y el tip habla de cerrarlo mientras se ve cerrarse casi entero.
  // Va en `intro` y no en `on` porque quien ya se sabe el anillo lo tiene desde
  // el frame cero (ver gaugeOn()): ese salto sería un bonus regalado a mitad de
  // partida y sin texto que lo justifique.
  { n:4, id:"gauge",  at:90,  intro(){ gauge = GAUGE_INTRO; },
                      tip:"Cierra el anillo naranja: saldrá una bola que arrasa todo lo que encuentre a su paso." },
  // El púrpura no puede esperar al azar: con 5 colores en la bolsa podría tardar
  // varias fichas en salir y el tip se leería sin nada que mirar. `forceK` reserva
  // el color de la próxima ficha, y si el aviso de la pendiente todavía no ha
  // empezado a pintarse se la vuelve a tirar a ella —recolorear un arco a medio
  // aparecer sería un parpadeo— para que el púrpura salga ya.
  { n:5, id:"purple", at:130, on(){ forceK = 4; if (spawnT >= TELEGRAPH) nextSpawn = pickNext(); },
                      tip:"Nuevo color: púrpura." },
  // Misma reserva que el morado, y por la misma razón: la primera sinusoide no
  // puede depender de un 0.12. `forceSine` se salta el filtro de `prevSine`
  // —el tutorial manda— y el re-pick solo entra si el aviso todavía no se pinta.
  { n:6, id:"sine",   at:175, on(){ forceSine = true; if (spawnT >= TELEGRAPH) nextSpawn = pickNext(); },
                      tip:"Hay bolas que no caen. Cruzan el tablero de lado a lado." },
  { n:7, id:"pink",   at:220, tip:"Nueva bola: rosa." },
];
// Intervalo entre blancas: se acorta con la partida, pero la rampa cuenta desde
// que abrió el nivel 3, no desde t=0. En el propio instante de abrir vale
// WHITE_INT_START, así que la blanca del tutorial deja el ciclo recién arrancado.
function whiteInterval(){
  return WHITE_INT_MIN + (WHITE_INT_START-WHITE_INT_MIN)*
         Math.exp(-(t-LEVELS[2].at)/WHITE_INT_RAMP*1.6);
}
// Proporción de fichas que llegan serpenteando en vez de cayendo. Misma forma y
// misma razón que whiteInterval(): la rampa cuenta desde que abrió el nivel 6,
// así que en el instante de abrir vale exactamente SINE_P_START. El tope de 0.30
// es el punto del diseño —la bajada radial es el core y sigue siendo mayoría
// clara—, y como el veto de dos seguidas obliga a que cada sinusoide vaya
// precedida de una radial, el efectivo a largo plazo es p/(1+p) = ~0.23.
function sineChance(){
  return SINE_P_MAX + (SINE_P_START-SINE_P_MAX)*
         Math.exp(-(t-LEVELS[5].at)/SINE_RAMP*1.6);
}

// el tip se lee, no se parpadea: la ventana sale del número de palabras.
const READ_MIN = 3.5, READ_MAX = 9.0, READ_PER_WORD = 0.38, READ_BASE = 1.4;
function readTime(tip){
  const words = tip.replace(/<br>/g," ").trim().split(/\s+/).length;
  return Math.max(READ_MIN, Math.min(READ_MAX, READ_BASE + READ_PER_WORD*words));
}

// El tip del nivel 1 es el único de dos líneas —objetivo y control— y el único
// que se compone al vuelo: los primeros segundos son justo cuando el jugador
// revela qué dispositivo usa, así que el modo arranca por matchMedia y lo fija
// el primer gesto real. Si cambia con el tip a la vista se reescribe en vivo,
// sin reiniciar ni el temporizador ni el fade.
let inputMode = matchMedia("(pointer: fine)").matches ? "desktop" : "touch";
let inputModeFixed = false;
function tipFor(lv){
  if (lv === 1)
    return "Junta 3 o más del mismo color.<br>" + (inputMode === "desktop"
      ? "Arrastra o ← → para girar. Clic o ↓ para soltar rápido."
      : "Arrastra para girar. Toca para soltar rápido.");
  return LEVELS[lv-1].tip;
}
function setInputMode(m){
  if (inputModeFixed) return;
  inputModeFixed = true;
  if (m === inputMode) return;
  inputMode = m;
  if (level === 1 && tipT > 0) tipEl.innerHTML = tipFor(1);
}
const lvlNEl = document.querySelector(".lvl-n");
const tipEl  = document.querySelector(".lvl-tip");
// Único punto donde se decide si hay tip: tras tres lecturas completas el nivel
// abre con el número a secas. Con tipT a 0 el bloque de fade de frame() no tiene
// nada que hacer y setInputMode() tampoco reescribe nada —cae solo.
function showLevel(){
  lvlNEl.textContent = "NIVEL " + level;
  if (tutSeen(LEVELS[level-1].id)){ tipT = 0; tipEl.classList.remove("on"); return; }
  const tip = tipFor(level);
  tipT = readTime(tip);
  tipEl.innerHTML = tip;
  tipEl.classList.add("on");
}

// ─── estado ────────────────────────────────────────────────────────────────
const cv = document.getElementById("c"), cx = cv.getContext("2d");
let W,H,STAGE,PS,R,CELL,ox,oy,gaugeRad,teleRadIn;
let grid, angle, angleT, anglePrev, flying, score, gauge, gaugeV, gaugeFlashT, t, spawnT, dead, deadBall, nextSpawn, whiteT, lastColorAngle;
let level, tipT, gaugeEarly, forceK, prevSine, forceSine;
let dir, rotT, dragAcc, ptrDown, ptrId, ptrX, energy, lastMoveT, ptrT, ptrMoved;
let heldKeys, keyDir, keyMode, keyHoldT, keyRamp, keyIdleT;
let bestSaved;

// ─── almacén local ─────────────────────────────────────────────────────────
// Una sola clave versionada con el récord y los contadores de tutorial. El objeto
// en memoria es la fuente de verdad durante la sesión y localStorage solo el
// respaldo: lanza en Safari privado y puede estar bloqueado dentro del iframe de
// un portal, así que las dos caras van envueltas y el fallo se traga en silencio.
// Sin aviso al jugador: no puede hacer nada al respecto y la partida se juega
// igual, sin persistencia, hasta que se recarga.
// El almacén es por origen, navegador y dispositivo, y no se sincroniza: móvil y
// escritorio son dos progresos independientes que nunca se ven. Aceptado, no
// defecto —quien prueba la demo en los dos ve los tutoriales en los dos.
const SAVE_KEY = "whirlpop.save";
const BEST_KEY = "whirlpop.best";      // clave heredada: solo guardaba el récord
const SAVE_V = 1, TUT_MAX = 3;
const TUT_IDS = LEVELS.map(l => l.id);

function lsGet(k){ try { return localStorage.getItem(k); } catch(_){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(_){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(_){} }

// nada de lo que salga del almacén puede romper el arranque: un valor editado a
// mano en devtools se satura o cae a 0, y un id desconocido no llega a entrar.
function clampInt(x, max){ return Math.max(0, Math.min(max, Math.floor(Number(x) || 0))); }
function blankSave(){
  const s = { v:SAVE_V, best:0, tut:{} };
  for (const id of TUT_IDS) s.tut[id] = 0;
  return s;
}
let save = blankSave(), saveDirty = false;

function loadSave(){
  save = blankSave();
  let raw = null;
  try { raw = JSON.parse(lsGet(SAVE_KEY)); } catch(_){}
  if (raw && raw.v === SAVE_V){
    save.best = clampInt(raw.best, Infinity);
    const tut = raw.tut || {};
    for (const id of TUT_IDS) save.tut[id] = clampInt(tut[id], TUT_MAX);
    return;
  }
  // sin clave, con otra versión o con el JSON roto: partida limpia. Se rescata el
  // récord de la clave heredada y se borra, para no dejar dos fuentes de verdad.
  save.best = clampInt(lsGet(BEST_KEY), Infinity);
  flushSave();
  lsDel(BEST_KEY);
}
// se escribe siempre la clave entera: el blob son decenas de bytes y no compensa
// nada más fino. Nunca dentro del bucle de frame.
function flushSave(){ saveDirty = false; lsSet(SAVE_KEY, JSON.stringify(save)); }
function flushIfDirty(){ if (saveDirty) flushSave(); }

function tutCount(id){ return save.tut[id] || 0; }
function tutSeen(id){ return tutCount(id) >= TUT_MAX; }
function tutConsume(id){
  if (!(id in save.tut) || save.tut[id] >= TUT_MAX) return;
  save.tut[id]++;
  flushSave();          // el instante importa: no depende de llegar al game over
}

// El récord se perdía al cerrar la pestaña en pleno récord, que en móvil —que es
// donde se juega— pasa constantemente. Los dos eventos porque ninguno dispara de
// forma fiable en todos los navegadores; entre los dos cubren cerrar la pestaña,
// cambiar de app en iOS y el bfcache. loseInput() no escribe: ya corre en blur y
// mezclar responsabilidades ahí complica el rastreo.
addEventListener("pagehide", flushIfDirty);
document.addEventListener("visibilitychange", ()=>{ if (document.hidden) flushIfDirty(); });

// Arranque del almacén con los dos atajos de prueba encima: ?reset=1 borra y
// empieza limpio, ?tut=3 pone todos los contadores a 3 —sin tutoriales y con la
// carga desbloqueada—. Se quitan de la URL para que un F5 no los repita: jugar
// seis minutos, o borrar la clave a mano en el móvil —donde eso exige depuración
// remota—, no es forma de probar esto. ?nivel=N adelanta el reloj de partida al
// `at` de ese nivel: ninguna lógica de juego se entera, porque toda la dificultad
// se deriva de `t`. ?nivel=6&tut=3 da nivel 6 limpio y con el anillo desbloqueado.
let startLevel = 1;
(function bootSave(){
  const q = new URLSearchParams(location.search);
  const wipe = q.has("reset"), tut = q.get("tut"), lvl = q.get("nivel");
  if (wipe){ lsDel(SAVE_KEY); lsDel(BEST_KEY); }
  loadSave();
  if (tut !== null){
    for (const id of TUT_IDS) save.tut[id] = clampInt(tut, TUT_MAX);
    flushSave();
  }
  if (lvl !== null) startLevel = Math.max(1, clampInt(lvl, LEVELS.length));
  if (!wipe && tut === null && lvl === null) return;
  q.delete("reset"); q.delete("tut"); q.delete("nivel");
  const qs = q.toString();
  try { history.replaceState(null, "", location.pathname + (qs ? "?"+qs : "") + location.hash); } catch(_){}
})();

let bestScore = save.best;
const bestEl = document.getElementById("bestv");

function idx(c,r){ return r*N+c; }
function inb(c,r){ return c>=0&&c<N&&r>=0&&r<N; }
function cheb(c,r){ return Math.max(Math.abs(c-C),Math.abs(r-C)); }
const NB = [[0,-1],[0,1],[-1,0],[1,0]];   // adyacencia 4, sin diagonales

// ─── la forma del campo ────────────────────────────────────────────────────
// El jugador lee el campo en radial, así que la silueta se declara, no se
// calcula: ningún umbral aproximado decide qué es borde ni qué cabe. `V` es
// celda jugable, `X` es muro, indistinguible del exterior en todo el algoritmo.
// Se lee de un vistazo y se retoca a mano —los picos, celdas que sobresalen con
// un solo 4-vecino jugable, se tachan aquí— sin recalibrar ningún decimal.
// 177 celdas jugables, entre 6.71 y 7.28 celdas de radio: es un disco
// digitalizado, y esa variación es lo que se ve al girar. La máscara fija N:
// cambiar N obliga a redibujarla, que es lo que se querría hacer de todos modos.
//
// Por qué ESTAS 177 y no otras. La frontera se dibuja a MASK_R+0.5, o sea la
// pone la celda MÁS lejana; pero en las direcciones donde la silueta se queda
// corta la última bola posible deja un hueco visible contra ese trazo, y ahí un
// game over se lee como injusto: "si aún cabía". Lo que hay que minimizar es la
// DISPERSIÓN radial de la silueta, no su tamaño. Barridas las 86 máscaras que
// caben en N=15 sin picos, conexas y sin huecos, esta es la de menor hueco
// máximo: 0.62 celdas, contra 0.80 de la anterior —y el hueco medio pasa de
// 0.38 a 0.24—. No baja de ahí: rejilla cuadrada contra círculo, a esta
// resolución no da más.
const MASK = [
  "XXXXXVVVVVXXXXX",
  "XXXVVVVVVVVVXXX",
  "XXVVVVVVVVVVVXX",
  "XVVVVVVVVVVVVVX",
  "XVVVVVVVVVVVVVX",
  "VVVVVVVVVVVVVVV",
  "VVVVVVVVVVVVVVV",
  "VVVVVVVVVVVVVVV",
  "VVVVVVVVVVVVVVV",
  "VVVVVVVVVVVVVVV",
  "XVVVVVVVVVVVVVX",
  "XVVVVVVVVVVVVVX",
  "XXVVVVVVVVVVVXX",
  "XXXVVVVVVVVVXXX",
  "XXXXXVVVVVXXXXX",
];
const PLAY = new Uint8Array(N*N);          // 1 = jugable
let MASK_R = 0;                            // radio, en celdas, de la más lejana
for (let r=0;r<N;r++) for (let c=0;c<N;c++){
  if (MASK[r][c] !== "V") continue;
  PLAY[idx(c,r)] = 1;
  MASK_R = Math.max(MASK_R, Math.hypot(c-C, r-C));
}
// sustituye a inb() en todo lo que decida ocupación de celdas —aterrizaje y
// gravedad—; inb() se conserva donde solo se recorre el array.
function playable(c,r){ return inb(c,r) && PLAY[idx(c,r)]===1; }

// profundidad: 0 = muro; 1 = borde, celda jugable con algún 4-vecino que no lo
// es; 2, 3... hacia dentro. Ni radios ni redondeos: es la medida con la que se
// anuncia el peligro, y la que hace innecesario cualquier umbral.
const DEPTH = new Int8Array(N*N);
(function buildDepth(){
  const q = [];
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    if (!playable(c,r)) continue;
    for (const [dc,dr] of NB) if (!playable(c+dc,r+dr)){ DEPTH[idx(c,r)]=1; q.push([c,r]); break; }
  }
  for (let h=0; h<q.length; h++){          // BFS en 4-adyacencia, de fuera hacia dentro
    const [c,r] = q[h];
    for (const [dc,dr] of NB){
      const p=c+dc, s=r+dr;
      if (!playable(p,s) || DEPTH[idx(p,s)]) continue;
      DEPTH[idx(p,s)] = DEPTH[idx(c,r)]+1; q.push([p,s]);
    }
  }
})();

function reset(){
  grid = new Array(N*N).fill(null);
  floaters = [];
  flashT = 0; flashSet = new Set(); flashBonus = false;
  pendingBonus = null;
  grid[idx(C,C)] = { k:-1, age:0 };          // piedra central fija
  angle = angleT = anglePrev = 0; flying = []; score = 0; gauge = gaugeV = gaugeFlashT = 0;
  spawnT = 0.9; whiteT = WHITE_INT_START; dead = false; deadBall = null; lastColorAngle = null;
  forceK = null; prevSine = false; forceSine = false;
  // arranque en un nivel concreto (?nivel=N): toda la dificultad se deriva de
  // `t`, así que basta con adelantar el reloj. La progresión se encadena sola en
  // el primer frame, ejecutando cada on() intermedio en orden.
  t = LEVELS[startLevel-1].at;
  // el desbloqueo del anillo se congela aquí: si el tutorial de la carga se
  // consume por tercera vez en esta partida, el adelanto entra en la siguiente.
  // Cambiar las reglas en caliente, a mitad de partida, sería peor.
  gaugeEarly = tutSeen("gauge");
  // el nivel 1 y su tip se pintan desde el frame cero
  level = 1; showLevel();
  { const aArc = Math.random()*Math.PI*2;
    nextSpawn = { aArc, a: aArc + (Math.random()-0.5)*TELEGRAPH_ARC*0.82,
                  k: Math.floor(Math.random()*4) }; }  // arranque: sin morado
  dir = 0; rotT = 0; dragAcc = 0;
  ptrDown = false; ptrId = null; ptrX = 0; energy = 0; lastMoveT = 0; ptrT = 0; ptrMoved = false;
  heldKeys = []; keyDir = 0; keyMode = "idle"; keyHoldT = 0; keyRamp = 0; keyIdleT = 0;
  bestSaved = false;
  document.getElementById("over").style.display = "none";
}

function resize(){
  W = innerWidth; H = innerHeight;
  STAGE = Math.min(W, H*STAGE_ASPECT);
  document.documentElement.style.setProperty("--stage", STAGE+"px");

  // buffer a resolución de dispositivo, dibujo en px CSS. Redimensionar el
  // canvas resetea la matriz, así que la transformación se reaplica aquí.
  const DPR = Math.min(3, devicePixelRatio || 1);
  cv.width  = Math.round(W*DPR);
  cv.height = Math.round(H*DPR);
  cv.style.width = W+"px"; cv.style.height = H+"px";
  cx.setTransform(DPR,0,0,DPR,0,0);

  // el canvas ocupa la ventana entera — solo el fondo se expande a lo ancho —,
  // pero el juego mide la columna, no el viewport.
  // manda la celda jugable más lejana, no el tamaño del array: el círculo
  // dibujado queda a media celda por fuera de la bola más exterior posible, en
  // todas las direcciones. Con 2R/N la rejilla se quedaba corta en los ejes y se
  // pasaba en las diagonales, y el mismo montón moría o no según el giro.
  PS = STAGE; R = PS*R_FACTOR; CELL = R/(MASK_R + 0.5);
  // la frontera manda: los otros dos anillos se sitúan a RING_GAP de su trazo.
  // Del aviso se guarda el borde INTERIOR, porque su grosor late con la cuenta
  // atrás y el aire debe ser el mismo en todo el latido, no solo en el pico.
  gaugeRad  = R - PS*(BORDER_W/2 + RING_GAP + GAUGE_W/2);
  teleRadIn = R + PS*(BORDER_W/2 + RING_GAP);

  // En móvil vertical los dedos tapan justo la zona por la que entran las fichas.
  // La corrección no mira al dispositivo, mira a la holgura: donde la columna
  // está limitada por la altura no sobra nada y la esfera se queda centrada;
  // donde lo está por el ancho, sobra altura y la esfera sube hasta el tope.
  const NEED  = STAGE / STAGE_ASPECT;
  const slack = Math.max(0, H - NEED);
  let lift = Math.min(slack*LIFT_K, STAGE*LIFT_MAX);
  // guarda: la zona de spawn y el aviso suben con la esfera y no deben salirse
  // por arriba. La franja superior ya no está libre —la ocupa la línea
  // "NIVEL X"—, así que se descuenta también. Solo la línea permanente: el tip
  // flota por encima y no reserva altura.
  lift = Math.min(lift, Math.max(0, H/2 - PS*0.60 - PS*TOP_KEEP - PS*LVL_BAND));

  ox = W/2; oy = H/2 - lift;
}
addEventListener("resize", resize);
// en móvil el alto real llega tarde al girar el dispositivo
addEventListener("orientationchange", ()=>setTimeout(resize,120));

// ─── conversiones ──────────────────────────────────────────────────────────
function cellToWorldF(fc,fr){
  const lx=(fc-C)*CELL, ly=(fr-C)*CELL, s=Math.sin(angle), co=Math.cos(angle);
  return [ox + lx*co - ly*s, oy + lx*s + ly*co];
}
function cellToWorld(c,r){ return cellToWorldF(c,r); }
// El tablero GIRA, así que una posición del mundo no significa lo mismo en dos
// frames distintos: para llevarla a celdas hay que usar el ángulo que estaba en
// vigor cuando se tomó. `worldToCellF` usa el de ahora, que es lo correcto para
// todo lo que se dibuja; rayCast() necesita la variante explícita.
function worldToCellA(x,y,ang){
  const dx=x-ox, dy=y-oy, s=Math.sin(-ang), co=Math.cos(-ang);
  return [(dx*co - dy*s)/CELL + C, (dx*s + dy*co)/CELL + C];
}
function worldToCellF(x,y){ return worldToCellA(x, y, angle); }
// ─── spawn y vuelo ─────────────────────────────────────────────────────────
// se decide con antelación para poder telegrafiarlo.
// El arco marca la ZONA; el ángulo real cae en algún punto dentro de ella.
// Las blancas NO pasan por aquí: tienen su propio ciclo y no se avisan.
function pickNext(){
  // un nivel puede reservar el color de la siguiente ficha (ver LEVELS): es un
  // disparo único y el azar recupera el mando en la ficha de después.
  const k = forceK !== null ? forceK : Math.floor(Math.random()*numColors());
  forceK = null;
  // La sinusoide SUSTITUYE a la radial, no se suma: mismo ritmo de fichas, otra
  // trayectoria para algunas. Nunca dos seguidas —el veto quita las rachas y deja
  // el 0.30 nominal en ~0.23 efectivo—, salvo que la pida el tutorial.
  const sine = forceSine || (!prevSine && level >= 6 && Math.random() < sineChance());
  forceSine = false;
  prevSine = sine;
  if (sine){
    // Entrada exactamente a las 3 o a las 9, sin dispersión dentro del arco: la
    // onda se define respecto al centro y hacen falta ciclos enteros entre
    // entrada y centro para que la bola nazca sobre el eje. Cualquier desvío
    // rompe una de las dos cosas. El eje horizontal tampoco es estético:
    // inclinarlo sacaría la cresta más lejana de la pantalla por el lado.
    const a = Math.random()<0.5 ? 0 : Math.PI;
    return { aArc:a, a, k, sine:true,
             cyc: 2 + Math.floor(Math.random()*2),
             sig: Math.random()<0.5 ? 1 : -1 };
  }
  const aArc = Math.random()*Math.PI*2;
  const a = aArc + (Math.random()-0.5)*TELEGRAPH_ARC*0.82;   // dentro del arco
  return { aArc, a, k };
}
// Las fichas nacen justo fuera del círculo, en la zona que acaba de marcar el
// arco de aviso, y ya con su velocidad normal.
function spawnNormal(n){
  const a = n.a, d = PS*0.52;
  const x = ox+Math.cos(a)*d, y = oy+Math.sin(a)*d;
  lastColorAngle = a;
  flying.push({ bonus:false, k:n.k, hard:false, trail:[],
                x, y, px:x, py:y,
                ux:-Math.cos(a), uy:-Math.sin(a), sp:PS*BUBBLE_SPEED,
                acc:FALL_ACCEL });
}
// Misma bolsa, mismo sitio de salida, otro camino: entra por el lateral y cruza
// serpenteando hasta el centro. `s` es la distancia sobre el eje al centro,
// positiva hacia la entrada, y λ sale de los ciclos —no se escribe a mano—, así
// que entrada y centro son nodos de la onda por construcción, para cualquier
// `cyc`. Que s=0 sea nodo es la propiedad de la que cuelga todo lo demás: la
// bola pasa por el centro exacto, donde la roca la espera desde reset(), así que
// no puede perderse ni rebasar el otro lado y no hace falta ninguna guarda.
// Factor que deja la duración de la travesía intacta al mover SINE_EASE: es el
// cociente entre las dos integrales del elemento de arco, la de la parametrización
// elegida y la de arco puro. El `ds` se cancela en el cociente, así que basta con
// los pesos. Con SINE_EASE=1 vale 1 y no hace nada. Se paga una vez por bola.
function sineCal(A, w, d){
  if (SINE_EASE === 1) return 1;
  let ie = 0, i1 = 0, M = 128;
  for (let i=0; i<=M; i++){
    const wt = (i===0 || i===M) ? 0.5 : 1;
    const h = Math.hypot(1, A*w*Math.cos(w*d*i/M));
    ie += wt*Math.pow(h, SINE_EASE); i1 += wt*h;
  }
  return ie/i1;
}
function spawnSine(n){
  const a = n.a, d = PS*0.52;
  const x = ox+Math.cos(a)*d, y = oy;
  const A = PS*SINE_AMP, w = Math.PI*n.cyc/d;
  lastColorAngle = a;                      // las blancas siguen saliendo enfrente
  flying.push({ bonus:false, k:n.k, hard:false, trail:[],
                x, y, px:x, py:y,
                sp:PS*SINE_SPEED, acc:0,   // la sinusoide no cae: cruza
                sine:{ s:d, sx:Math.cos(a)<0 ? -1 : 1, sig:n.sig,
                       A, w, cal:sineCal(A, w, d) } });
}
// blanca: sin aviso, más lenta, inmune al hard drop.
// Sale en el lado opuesto a la última ficha de color, para partir la atención.
function spawnWhite(){
  const base = (lastColorAngle===null ? Math.random()*Math.PI*2 : lastColorAngle) + Math.PI;
  const a = base + (Math.random()-0.5)*WHITE_SPREAD;
  const d = PS*0.52;
  const x = ox+Math.cos(a)*d, y = oy+Math.sin(a)*d;
  flying.push({ bonus:false, k:WHITE, hard:false, trail:[],
                x, y, px:x, py:y,
                ux:-Math.cos(a), uy:-Math.sin(a), sp:PS*WHITE_SPEED,
                acc:WHITE_ACCEL });
}
// sale por el punto de anclaje del anillo, donde el arco acaba de cerrarse:
// el medidor y su premio comparten sitio, no solo momento.
function spawnBonus(lvl){
  const a = GAUGE_A0;
  const x = ox+Math.cos(a)*PS*0.50, y = oy+Math.sin(a)*PS*0.50;
  flying.push({ bonus:true, lvl, th:a, r:PS*0.50,
                dir: Math.random()<0.5?1:-1, trail:[],
                x, y, px:x, py:y });
}

function stepFlying(dt){
  for (let i=flying.length-1; i>=0; i--){
    const b = flying[i];
    b.px = b.x; b.py = b.y;                           // origen del rayo del frame
    if (b.bonus){                                     // espiral hacia dentro
      b.th += SPIRAL_TANGENT*b.dir*dt*(PS*0.16/Math.max(b.r,PS*0.05));
      b.r  -= PS*SPIRAL_INWARD*dt;
      b.x = ox + Math.cos(b.th)*b.r; b.y = oy + Math.sin(b.th)*b.r;
      b.trail.push([b.x,b.y]); if (b.trail.length>22) b.trail.shift();
    } else {
      b.sp += PS*(b.hard?HARD_ACCEL:b.acc)*dt;       // acelera al caer
      if (b.sine){
        // `sp` es velocidad sobre la trayectoria, no sobre el eje: mismo ritmo
        // aparente, y lo que se frena en las subidas es el avance en x. Ocupa el
        // mismo campo que la velocidad de una radial a propósito, y por eso el
        // hard drop funciona aquí sin tocarlo: acelera conservando la onda,
        // porque la longitud de onda es espacial y la forma no depende del ritmo.
        // La integración es de punto medio y subdividida, y ninguna de las dos
        // cosas sobra. En la cresta el radio de giro es de 0.19 celdas: un paso
        // de Euler ahí se salta el giro por fuera y la bola CORRE justo en la
        // curva —+54% a 60 fps, +400% con hard drop a 20—, que es lo único que
        // rompía la velocidad uniforme que se pide arriba. El punto medio quita
        // ese error a paso normal; subdividir cubre los pasos largos del hard
        // drop y del framerate bajo. Con las dos, 0% de desviación y 6 subpasos
        // en el peor caso; a 60 fps y velocidad normal el bucle da una vuelta.
        // `cal` mantiene la duración; el exponente reparte la velocidad. Los
        // subpasos se cuentan sobre el DESPLAZAMIENTO real, no sobre el avance
        // en el eje: con SINE_EASE bajo la bola vuela en los cruces y ahí es
        // donde hay que muestrear fino.
        const q = b.sine, rate = b.sp*q.cal;
        const h0 = Math.hypot(1, q.A*q.w*Math.cos(q.w*q.s));
        const disp = rate*dt*Math.pow(h0, 1-SINE_EASE);
        const n = Math.max(1, Math.ceil(disp/(PS*SINE_MAX_STEP)));
        for (let j=0; j<n; j++){
          const h = rate*dt/n;
          let sl = q.A*q.w*Math.cos(q.w*q.s);         // dy/ds al principio
          const sm = q.s - 0.5*h/Math.pow(Math.hypot(1, sl), SINE_EASE);
          sl = q.A*q.w*Math.cos(q.w*sm);              // y reevaluada en el medio
          q.s -= h/Math.pow(Math.hypot(1, sl), SINE_EASE);
        }
        // Aquí NO va ninguna guarda para el centro, y la tentación existe: con
        // SINE_EASE bajo la bola va más rápida justo en el nodo central, que es
        // donde vive la garantía de que una sinusoide no se pierde nunca. Pero
        // la curvatura cerrada está en las CRESTAS, no en los nodos: junto al
        // centro el trazado es localmente recto, así que la cuerda de rayCast()
        // pasa por el núcleo aunque el frame lo cruce. El peor avance ahí es de
        // 0.39 celdas (hard drop a 20 fps), y un barrido de 60 combinaciones de
        // variante, framerate, hard drop y desfase no rebasa el centro ni una vez.
        b.x = ox + q.sx*q.s;
        b.y = oy + q.sig*q.A*Math.sin(q.w*q.s);
      } else {
        b.x += b.ux*b.sp*dt; b.y += b.uy*b.sp*dt;
      }
      if (b.hard){
        b.trail.push([b.x,b.y]); if (b.trail.length>10) b.trail.shift();
      }
    }
    const shot = rayCast(b);
    if (shot){ flying.splice(i,1); land(b, shot); }
    else if (Math.hypot(b.x-ox,b.y-oy) > PS*0.75) flying.splice(i,1);
  }
}

// ─── aterrizaje por trazado de rayo ────────────────────────────────────────
// Una sola regla, y es la que hay que poder decir en voz alta: la bola se
// detiene en la última celda libre que atravesó. La colocación es función de la
// trayectoria y de nada más — no hay conjunto de candidatos, ni desempate por
// distancia, ni fallback: si el algoritmo necesitara uno es que la regla está
// mal formulada. Se traza el segmento recorrido en el frame, no la posición
// final, y eso es además lo que impide que un hard drop a 20 fps atraviese el
// montón entre dos frames.
//
// El recorrido es exacto, no muestreado, y la diferencia no es cosmética. Con
// muestras cada 0.25 celdas, un segmento que pasa rozando la esquina entre dos
// celdas puede no caer NUNCA dentro de una de ellas: pertenece a esa celda
// durante menos de lo que mide un paso. En el 4% de las direcciones ese tramo
// dura menos de 0.10 celdas. Cuando la celda saltada era la libre del borde,
// `free` se quedaba a null y la bola moría contra la de detrás —una celda
// entera hacia dentro, con hueco libre delante—: era la muerte que no se
// entendía. Medido sobre un tablero con TODO el anillo de borde libre, donde
// nadie debería morir jamás, el muestreo mataba en 32 de 3600 direcciones a 60
// fps y en 56 con hard drop a 20; el recorrido exacto, en 0 de 3600 en las
// cuatro combinaciones. Y de paso se va la dependencia del framerate.
//
// Los bordes de celda están en los semienteros, así que recorrerlas en orden es
// ir saltando al siguiente cruce —en c o en r, el que caiga antes—: `tc` y `tr`
// son la fracción del segmento a la que toca cada uno.

// Cuánto se prolonga el segmento hacia atrás, en celdas. 1.5 ya garantiza cruzar
// un borde de celda venga la bola por donde venga; 2 deja margen para que la
// celda de detrás también esté pillada sin que eso mate a nadie.
const RAY_BACK = 2;

// Recorre [px,py] → [x,y] en coordenadas de grid. Devuelve el impacto —la
// primera celda jugable y ocupada— junto con la última libre atravesada, o null
// si el vuelo sigue. La ausencia de celda libre en el impacto es la condición de
// muerte. El recorrido se rehace entero cada frame: lo único que sobrevive de un
// frame al siguiente es `b.free`, y solo como red de seguridad revalidada —ver
// stale()—, nunca como respuesta directa.
function rayCast(b){
  // El origen se convierte con el ángulo del frame ANTERIOR, que es el que el
  // tablero tenía cuando la bola estaba ahí. Con los dos extremos convertidos con
  // el mismo ángulo el barrido tangencial del giro se cancelaba solo y el rayo no
  // lo veía: a 340°/s en el borde son 0.72 celdas por frame contra las 0.052 que
  // avanza la bola por sí misma —14 veces más—, así que el montón le pasaba por
  // delante sin tocarla y encallaba a media celda de donde se la veía chocar.
  // La cuerda basta y no hay que subdividirla: la flecha del arco que sustituye
  // es de 0.011 celdas a 60 fps y de 0.10 en el peor caso, 20 fps a tope de giro.
  const [ac0,ar0] = worldToCellA(b.px, b.py, anglePrev);
  const [bc,br]   = worldToCellF(b.x,  b.y);
  // ...y se prolonga hacia atrás sobre la misma recta. La bola viene de ahí en
  // línea recta, o sea que son celdas que recorrió de verdad, y volver a trazarlas
  // cada frame es lo que permite calcular `free` ENTERO contra el grid vivo. Antes
  // se arrastraba de un frame al siguiente, y dos bolas que compartieran celda en
  // vuelo —una blanca lenta alcanzada por una de color, cosa fácil con el tablero
  // vacío— anotaban las dos la misma celda libre: la segunda en aterrizar escribía
  // encima de la primera y una de las dos desaparecía. Ahora la segunda ve la
  // celda ocupada y se queda en la de detrás, que es justo donde está.
  // Prolongar NO mueve la recta: `fc,fr`, `rayDist()` y la dirección de la muerte
  // salen idénticos. Lo único que cambia es cuántas celdas se recorren —y que el
  // tramo de atrás NO puede frenar a la bola: ahí ya no está. `t0` es la fracción
  // en la que empieza el segmento de verdad, y una celda ocupada antes de `t0`
  // solo corta el rastro de libres (lo de más atrás es inalcanzable), nunca mata.
  const vc = bc-ac0, vr = br-ar0, L = Math.hypot(vc,vr);
  const back = L ? RAY_BACK/L : 0;
  const t0 = back/(1+back);
  const ac = ac0 - vc*back, ar = ar0 - vr*back;
  const dc = bc-ac, dr = br-ar;
  const ec = Math.round(bc), er = Math.round(br);
  const sc = dc>0?1:-1, sr = dr>0?1:-1;
  const ddc = dc ? Math.abs(1/dc) : Infinity, ddr = dr ? Math.abs(1/dr) : Infinity;
  let c = Math.round(ac), r = Math.round(ar);
  let tc = dc ? ((c+0.5*sc)-ac)/dc : Infinity;
  let tr = dr ? ((r+0.5*sr)-ar)/dr : Infinity;
  let tin = 0;                                 // fracción a la que se entró en (c,r)
  let free = null;                             // última libre atravesada, este frame
  // La misma celda, sin el filtro del campo: la última VACÍA que atravesó, sea del
  // campo o no. Es donde la bola se detendría si el tablero siguiera más allá, y es
  // lo que se dibuja cuando la partida acaba. Ver land().
  let slot = null;
  // tope de seguridad: ni el segmento de un frame ni la prolongación llegan a 3
  // celdas ni con hard drop a 20 fps, así que 64 celdas es holgura contra un NaN.
  for (let n=0; n<64; n++){
    if (playable(c,r)){
      if (grid[idx(c,r)]){
        // se sale de la celda después de `t0`: la bola está aquí o llega aquí
        if (Math.min(tc,tr) > t0){
          // punto de ENTRADA en la celda: es donde la bola la toca, y de ahí sale
          // la posición visual desde la que la ficha se asienta hacia el centro.
          return { hit:[c,r], free:free||stale(b), slot, fc:ac+dc*tin, fr:ar+dr*tin,
                   ac, ar, bc, br };
        }
        free = slot = null;                    // tramo de atrás cortado
      } else free = slot = [c,r];
    } else slot = [c,r];                       // muro o exterior: no frena, pero sí cuenta
    if (c===ec && r===er) break;
    if (tc<tr){ tin = tc; c += sc; tc += ddc; }
    else      { tin = tr; r += sr; tr += ddr; }
    if (tin > 1) break;                        // pasado el final del segmento
  }
  if (free) b.free = free;                     // última libre conocida del vuelo
  return null;
}

// Red de seguridad, y solo eso: la última libre que la bola vio en frames
// anteriores, devuelta ÚNICAMENTE si sigue libre ahora. El recorrido de este
// frame ya cubre el caso normal; esto cubre el raro en que ni él ni la
// prolongación encuentran hueco, y evita que eso se lea como "no cabe". Sin la
// comprobación contra el grid vivo esta memoria es justo lo que hacía que una
// bola escribiera encima de otra.
function stale(b){
  const f = b.free;
  return f && playable(f[0],f[1]) && !grid[idx(f[0],f[1])] ? f : null;
}

// distancia de un centro de celda a la recta del rayo, en celdas
function rayDist(c, r, s){
  const vx = s.bc-s.ac, vy = s.br-s.ar, L = Math.hypot(vx,vy);
  if (!L) return Math.hypot(c-s.ac, r-s.ar);
  return Math.abs((c-s.ac)*vy - (r-s.ar)*vx)/L;
}

// La celda de reposo es la última libre, salvo que esta y la del impacto sean
// diagonales entre sí: entonces manda una de las dos ortogonales intermedias, la
// más cercana al rayo. Si ninguna está libre la última libre es correcta y la
// bola queda encajada en la esquina, tocando dos bolas.
function restCell(s){
  if (!s.free) return null;
  const [c,r] = s.free, [hc,hr] = s.hit;
  if (Math.abs(c-hc)!==1 || Math.abs(r-hr)!==1) return s.free;
  const opts = [[c,hr],[hc,r]].filter(([p,q]) => playable(p,q) && !grid[idx(p,q)]);
  if (opts.length < 2) return opts[0] || s.free;
  return rayDist(opts[0][0],opts[0][1],s) <= rayDist(opts[1][0],opts[1][1],s)
       ? opts[0] : opts[1];
}

function land(b, s){
  // el bonus no ocupa celda: actúa sobre la celda del montón contra la que choca
  if (b.bonus){ applyBonus(s.hit); return; }

  const cell = restCell(s);
  // impactó sin haber tenido nunca una celda libre dentro del campo: no cabe.
  // Es la única muerte del juego, y es la misma en todas las direcciones.
  if (!cell){
    dead = true;
    // La bola que mata NO desaparece: sale de `flying` como cualquier otra —el
    // vuelo ha terminado— pero se queda dibujada. Sin esto el último fotograma
    // enseña un game over sin causa a la vista.
    //
    // Y se dibuja HACIENDO SNAP, con la regla de siempre aplicada a `slot`: la
    // última celda vacía que atravesó, contando las de fuera del campo. No es un
    // apaño para colocarla "por fuera": es que morir ES eso. La bola se detiene
    // donde se detendría cualquier otra, solo que esa celda no pertenece al campo,
    // y esa es exactamente la definición de "no cabe". Por eso no hace falta
    // comprobar nada: si `slot` fuese del campo y estuviese libre, `free` no sería
    // null y no habría muerte. Cae fuera por construcción, en todas las
    // direcciones y gire el tablero lo que gire.
    //
    // El cálculo anterior —una celda hacia atrás sobre el vector del rayo— dejaba
    // la bola fuera de la rejilla y dependía de una dirección que, desde que el
    // rayo ve el giro, es la relativa y no la suya: girando la ponía AL LADO del
    // montón en vez de por fuera, y en un 11% de las muertes encima de una casilla
    // libre, que se lee "pero si cabía".
    deadBall = s.slot ? { k:b.k, vc:s.slot[0], vr:s.slot[1] }
                      : { k:b.k, vc:s.fc, vr:s.fr };
    return;
  }

  // `fresh`: aterrizó con un destello ya en curso, así que su match —si lo hace—
  // no lo ha provocado esa resolución. La marca viaja con la ficha, gravedad
  // incluida, y commitFlash() la lee para no cobrarlo como combo. Ver ahí.
  grid[idx(cell[0],cell[1])] = { k:b.k, age:0, vc:s.fc, vr:s.fr, fresh: flashT > 0 };
  refreshGroup(cell[0], cell[1]);
  resolve();
}

// ─── cadenas, colateral, gravedad ──────────────────────────────────────────
// Un match de 2 no estalla, pero reinicia el reloj de petrificación de las dos
// fichas: da una vía para gestionar una piedra incipiente sin necesidad de
// cerrar un match de 3. Se evalúa sobre el grupo de la ficha recién aterrizada;
// un grupo de 3 o más no lo necesita, porque va a estallar.
function refreshGroup(c,r){
  const g = grid[idx(c,r)];
  if (!g || g.k<0 || g.k===WHITE || g.k===STONE) return;
  const seen = new Uint8Array(N*N), st=[[c,r]], grp=[];
  seen[idx(c,r)]=1;
  while (st.length){
    const [a,b] = st.pop(); grp.push(idx(a,b));
    for (const [dc,dr] of NB){
      const p=a+dc, q=b+dr;
      if (!inb(p,q) || seen[idx(p,q)]) continue;
      const h = grid[idx(p,q)];
      if (h && h.k===g.k){ seen[idx(p,q)]=1; st.push([p,q]); }
    }
  }
  if (grp.length < 2 || grp.length >= CHAIN_MIN) return;
  grp.forEach(i=>{ grid[i].age = 0; });
}

function findPops(){
  const seen = new Uint8Array(N*N), out = new Set();
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    const g = grid[idx(c,r)];
    if (!g || seen[idx(c,r)] || g.k<0 || g.k===WHITE || g.k===STONE) continue;
    const st=[[c,r]], grp=[]; seen[idx(c,r)]=1;
    while (st.length){
      const [a,b] = st.pop(); grp.push([a,b]);
      for (const [dc,dr] of NB){
        const p=a+dc, q=b+dr;
        if (!inb(p,q) || seen[idx(p,q)]) continue;
        const h = grid[idx(p,q)];
        if (h && h.k===g.k){ seen[idx(p,q)]=1; st.push([p,q]); }
      }
    }
    if (grp.length >= CHAIN_MIN) grp.forEach(([a,b])=>out.add(idx(a,b)));
  }
  if (!out.size) return out;

  // colateral: blancas adyacentes, propagando entre blancas
  const q = [...out], wseen = new Set();
  while (q.length){
    const i = q.pop(), c = i%N, r = (i/N)|0;
    for (const [dc,dr] of NB){
      const p=c+dc, s=r+dr;
      if (!inb(p,s)) continue;
      const h = grid[idx(p,s)];
      if (h && h.k===WHITE && !wseen.has(idx(p,s))){
        wseen.add(idx(p,s)); out.add(idx(p,s)); q.push(idx(p,s));
      }
    }
  }
  return out;
}

// gravedad: UNA resolución por estallido, pero completa —
// cada ficha desliza hasta quedar bloqueada, sin dejar fichas flotando a medias.
// No es recursiva: no vuelve a lanzarse sola, la llama quien provoca el estallido.
function gravityPass(){
  let anyMoved = false;
  for (let sweep=0; sweep<N*2; sweep++){
    const cells = [];
    for (let r=0;r<N;r++) for (let c=0;c<N;c++){
      const g = grid[idx(c,r)];
      if (g && g.k>=0) cells.push([c,r,Math.hypot(c-C,r-C)]);
    }
    // el orden decide qué bola reclama un hueco cuando dos podrían caer en él,
    // así que se ordena con la misma métrica con la que se mueve: euclídea.
    cells.sort((a,b)=>a[2]-b[2]);                     // de dentro hacia fuera
    let any = false;
    for (const [c0,r0] of cells){
      let c=c0, r=r0;
      if (!grid[idx(c,r)]) continue;
      for (let step=0; step<N*2; step++){             // agota el recorrido
        const dx = C-c, dy = C-r;
        if (!dx && !dy) break;
        // solo el vecino que más reduce el radio —el eje mayor, empate a X—. Si
        // está ocupado o no es jugable la bola NO se mueve, aunque tenga hueco
        // al lado: el rodeo lateral es lo que permitía a un match tirar de bolas
        // que no estaban radialmente por fuera de él. Contrapartida aceptada:
        // quedan bolas paradas junto a un hueco lateral, que es legible —no cayó
        // porque no estaba encima— y preferible a un rodeo que nadie anticipa.
        const mx = Math.abs(dx) >= Math.abs(dy);
        const p = mx ? c+Math.sign(dx) : c;
        const q = mx ? r : r+Math.sign(dy);
        if (!playable(p,q) || grid[idx(p,q)]) break;
        grid[idx(p,q)] = grid[idx(c,r)]; grid[idx(c,r)] = null;
        c=p; r=q; any = anyMoved = true;
      }
    }
    if (!any) break;                                  // ya está estable
  }
  return anyMoved;
}

// separa el conjunto estallado en grupos conexos, para un texto por match
function splitComponents(set){
  const rest = new Set(set), out = [];
  while (rest.size){
    const start = rest.values().next().value;
    const st=[start], comp=[]; rest.delete(start);
    while (st.length){
      const i = st.pop(); comp.push(i);
      const c=i%N, r=(i/N)|0;
      for (const [dc,dr] of NB){
        const p=c+dc, s=r+dr;
        if (!inb(p,s)) continue;
        const j = idx(p,s);
        if (rest.has(j)){ rest.delete(j); st.push(j); }
      }
    }
    out.push(comp);
  }
  return out;
}

// SINGLE_PASS: una sola pasada de gravedad por estallido.
// El match tiene prioridad: se comprueba antes de la gravedad y otra vez después de ella.
// ─── resolución en dos fases ───────────────────────────────────────────────
// 1. se detecta el match y las fichas destellan a blanco (sin desaparecer aún)
// 2. al acabar el destello se vacían, cae el montón y se busca el siguiente match
const FLASH_TIME = 0.19;
let flashT = 0, flashSet = new Set(), flashBonus = false, comboDepth = 0;
// un bonus que impacta con un destello en curso espera su turno en vez de pisarlo
let pendingBonus = null;


function tryMatch(){
  const pops = findPops();
  if (!pops.size) return false;
  flashSet = pops;
  flashBonus = false;
  flashT = FLASH_TIME;
  return true;
}

// llamada tras un aterrizaje: arranca una resolución nueva, combo a cero
function resolve(){ if (flashT > 0) return; comboDepth = 0; tryMatch(); }

// Carga del medidor por grupo. Muy superlineal: a base de tríos cuesta muchísimo,
// con cuartetos y quintetos el bonus llega en un momento.
function gaugeForSize(n){
  if (n <= 3) return 0.17;      // ~24 tríos para llenar el medidor
  if (n === 4) return 0.55;     // ~8
  if (n === 5) return 1.15;     // ~4
  if (n === 6) return 1.80;
  return 1.80 + 0.55*(n-6);
}
// Multiplicador de puntuación por tamaño del grupo
function scoreMultForSize(n){
  if (n <= 3) return 1;
  if (n === 4) return 1.6;
  if (n === 5) return 2.4;
  return 3.2 + 0.8*(n-6);
}
// Multiplicador de combo: 1ª, 2ª, 3ª... cadena de la misma resolución
const COMBO_MULT = [1, 1.9, 3.2, 4.8, 6.5, 8.5];
function comboMult(){ return COMBO_MULT[Math.min(comboDepth, COMBO_MULT.length-1)]; }

function commitFlash(){
  const cm = comboMult();

  if (flashBonus){
    const pts = flashSet.size*5;
    addFloater([...flashSet], pts, "#f26b3a");
    flashSet.forEach(i=>{ if (grid[i]) grid[i]=null; });
    score += pts;
  } else {
    // puntuación y carga se calculan POR GRUPO, no sobre el total
    for (const comp of splitComponents(flashSet)){
      let tone = "#ffffff";
      for (const i of comp){
        const g = grid[i];
        if (g && g.k>=0 && g.k!==WHITE && g.k!==STONE){ tone = COL[g.k]; break; }
      }
      const n = comp.length;
      const pts = Math.round(n * 5 * scoreMultForSize(n) * cm);
      addFloater(comp, pts, tone, comboDepth>0 ? "x"+cm.toFixed(1).replace(/\.0$/,"")+" COMBO" : null);
      score += pts;
      // sin carga disponible los matches puntúan igual pero no cargan nada: el
      // anillo aparece a cero cuando abre, sin arrastre de lo anterior.
      if (gaugeOn()) gauge = Math.min(4, gauge + gaugeForSize(n)*cm);
    }
    flashSet.forEach(i=>{ if (grid[i]) grid[i]=null; });
  }

  const wasBonus = flashBonus;
  flashSet = new Set(); flashBonus = false; flashT = 0;
  gravityPass();

  // encadena: si la caída formó match, sube el combo y vuelve a destellar.
  // Salvo que lo cierre una ficha aterrizada durante el destello: eso no es un
  // eslabón de esta cadena, es una jugada del jugador, y empieza su propio combo
  // desde cero. Antes se cobraba como combo del match anterior, que era regalo.
  const more = tryMatch();
  let byFresh = false;
  if (more) for (const i of flashSet) if (grid[i] && grid[i].fresh){ byFresh = true; break; }
  if (!more || byFresh) comboDepth = 0;
  else if (!wasBonus) comboDepth++;
  // las marcas se consumen aquí: su destello ya se ha resuelto
  for (const g of grid) if (g && g.fresh) g.fresh = false;

  // el bonus esperó a que la resolución terminara entera, encadenados incluidos
  if (flashT <= 0 && pendingBonus !== null){
    const lv = pendingBonus; pendingBonus = null;
    fireBonus(lv);
  }
}

function stepFlash(dt){
  if (flashT <= 0) return;
  flashT -= dt;
  if (flashT <= 0) commitFlash();
}

// ─── bonus ─────────────────────────────────────────────────────────────────
// Un único bonus: revienta el marco de la celda impactada y todos los exteriores.
// El nivel es el de la celda del MONTÓN contra la que choca, no el de una celda libre.
function applyBonus(cell){
  const lv = Math.max(1, cheb(cell[0], cell[1]));   // nunca arrasa desde el núcleo
  // El nivel se fija en el IMPACTO, que es lo que el jugador vio, pero el barrido
  // puede tener que esperar: asignar flashSet con un destello en curso borraba el
  // match que estaba parpadeando —ni estallaba ni puntuaba—. La espera no le
  // quita nada al premio, porque lo que se guarda es el anillo, no las celdas.
  if (flashT > 0){ pendingBonus = lv; return; }
  fireBonus(lv);
}
function fireBonus(lv){
  const kill = new Set();
  for (let q=0;q<N;q++) for (let s=0;s<N;s++){
    if (cheb(q,s) < lv) continue;
    const g = grid[idx(q,s)];
    if (g && g.k>=0) kill.add(idx(q,s));
  }
  if (kill.size){
    flashSet = kill;
    flashBonus = true;
    flashT = FLASH_TIME;
  }
}

// ─── textos flotantes de puntuación ────────────────────────────────────────
let floaters = [];
const FLOAT_LIFE = 1.15;

// centroide de un conjunto de celdas, en posición visual
function popCentroid(cells){
  let sc=0, sr=0;
  for (const i of cells){ sc += i%N; sr += (i/N)|0; }
  return [sc/cells.length, sr/cells.length];
}
function addFloater(cells, pts, tone, label){
  const [fc,fr] = popCentroid(cells);
  floaters.push({ fc, fr, pts, tone, label:label||null, life:0, rise:0 });
}
function stepFloaters(dt){
  for (let i=floaters.length-1;i>=0;i--){
    const f = floaters[i];
    f.life += dt; f.rise += dt*CELL*1.05;
    if (f.life > FLOAT_LIFE) floaters.splice(i,1);
  }
}
function drawFloaters(){
  for (const f of floaters){
    const p = f.life/FLOAT_LIFE;
    const [x,y] = cellToWorldF(f.fc, f.fr);
    const scale = p<0.16 ? 0.55 + 0.45*(p/0.16)*1.35 : 1.12 - 0.12*p;
    cx.save();
    cx.globalAlpha = p<0.72 ? 1 : 1-(p-0.72)/0.28;
    cx.translate(x, y - f.rise);
    cx.scale(scale, scale);
    cx.font = `700 ${Math.round(CELL*0.95)}px ui-monospace, Menlo, Consolas, monospace`;
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.lineWidth = Math.max(3, CELL*0.16);
    cx.strokeStyle = "rgba(4,4,12,.92)";
    cx.strokeText("+"+f.pts, 0, 0);
    cx.fillStyle = f.tone;
    cx.fillText("+"+f.pts, 0, 0);
    if (f.label){
      cx.font = `700 ${Math.round(CELL*0.52)}px ui-monospace, Menlo, Consolas, monospace`;
      cx.lineWidth = Math.max(2, CELL*0.10);
      cx.strokeText(f.label, 0, CELL*0.82);
      cx.fillStyle = "#f2c53d";
      cx.fillText(f.label, 0, CELL*0.82);
    }
    cx.restore();
  }
}

// ─── animación de posiciones dentro del grid ───────────────────────────────
const FALL_EASE = 15;
function easeVisual(dt){
  const k = Math.min(1, FALL_EASE*dt);
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    const b = grid[idx(c,r)]; if (!b) continue;
    if (b.vc === undefined){ b.vc = c; b.vr = r; }
    b.vc += (c - b.vc)*k;
    b.vr += (r - b.vr)*k;
  }
}

// ─── petrificación ─────────────────────────────────────────────────────────
// El reloj de cada bola corre desde el primer segundo de partida, así el tutorial
// del nivel 2 no llega a un tablero recién puesto a cero: al abrirse, las bolas
// que el jugador no ha sabido limpiar ya están envejecidas, los avisos aparecen
// de golpe sobre ellas y la primera piedra cae poco después. Se explica una
// amenaza en curso, no una que empieza a contar en ese instante.
// Aquí no hay guarda de nivel y no le hace falta: la invariante anotada en LEVELS
// garantiza que ninguna edad alcance STONE_TIME antes de que abra el nivel 2. El
// anillo de aviso sí se esconde, porque ese llega mucho antes que la piedra.
function ageBubbles(dt){
  for (let i=0;i<N*N;i++){
    const g = grid[i];
    // la piedra central, las piedras y las blancas no envejecen
    if (!g || g.k<0 || g.k===STONE || g.k===WHITE) continue;
    g.age += dt;
    if (g.age > STONE_TIME) g.k = STONE;
  }
}
// ─── input ─────────────────────────────────────────────────────────────────
// La velocidad angular sale de la "energía" del gesto: un arrastre corto y lento
// gira despacio; uno amplio y rápido gira deprisa.
//
// Dos perfiles de constantes, no dos modos: NO hay detección de dispositivo.
// Cada pointerdown elige perfil por su propio e.pointerType, así que un portátil
// táctil alterna dedo y ratón en la misma sesión sin recargar. "pen" va con táctil.
const PROFILE = {
  touch: {
    DRAG_PX_SLOW: 18,      // px por paso con gesto suave
    DRAG_PX_FAST: 7,       // px por paso con gesto enérgico
    SPEED_REF:    1400,    // px/s considerados gesto enérgico
    SPEED_EMA:    0.30,    // suavizado de la medida de velocidad
    HOLD_SLOW:    0.125,   // periodo del giro mantenido, gesto suave
    HOLD_FAST:    0.028,   // periodo del giro mantenido, gesto enérgico
    TAP_MS:       200      // toque rápido sin arrastre = hard drop
  },
  mouse: {
    DRAG_PX_SLOW: 26,
    DRAG_PX_FAST: 10,
    SPEED_REF:    2600,    // con 1400 el ratón satura y energy se queda en 1
    SPEED_EMA:    0.30,
    // ── los dos números a tocar para calibrar el mantenido con ratón ──
    HOLD_SLOW:    0.125,   // iguales al táctil a propósito; pendiente de probar en pantalla
    HOLD_FAST:    0.028,
    TAP_MS:       300      // un clic con intención de disparo pasa de 200 ms a menudo
  }
};
let prof = PROFILE.touch;

// teclado: toque corto = un paso discreto; mantenido = velocidad angular creciente
const KEY_DAS         = 0.16;   // s antes de pasar de paso discreto a continuo
const KEY_W_MIN       = 70;     // °/s al arrancar el continuo (un toque cada DAS ≈ 47°/s)
const KEY_W_MAX       = 340;    // °/s al final de la rampa
const KEY_RAMP_TIME   = 0.75;   // s hasta velocidad máxima
const KEY_RAMP_RETAIN = 0.20;   // s que la rampa se conserva tras soltar todo
const KEY_RAMP_DECAY  = 0.35;   // s de decaimiento a cero tras la retención
const DEG = Math.PI/180;

function rotate(d){ angleT += d*ROT_STEP; }
const lerp = (a,b,p)=>a+(b-a)*p;
function dragPx(){ return lerp(prof.DRAG_PX_SLOW, prof.DRAG_PX_FAST, energy); }
function holdRate(){ return lerp(prof.HOLD_SLOW, prof.HOLD_FAST, energy); }

const UI = "#fs, #over";

// Modelo: el dedo manda.
//  - dedo levantado      -> no gira
//  - arrastrando         -> gira en la dirección del arrastre, a su ritmo
//  - pulsado y quieto    -> sigue en la dirección y al ritmo del último arrastre
//  - sin arrastre previo -> no gira
// El ratón entra por este mismo camino, solo con otro perfil de constantes.

// acelera la ficha normal más avanzada hacia el montón
function hardDrop(){
  if (dead) return;
  let best=null, bd=Infinity;
  for (const b of flying){
    if (b.bonus || b.hard || b.k===WHITE) continue;
    const d = Math.hypot(b.x-ox, b.y-oy);
    if (d < bd){ bd = d; best = b; }
  }
  if (!best) return;
  best.hard = true;
  best.sp = Math.max(best.sp, PS*HARD_SPEED);
}

// Los listeners cuelgan del canvas, no de window, para poder capturar el puntero:
// sin captura, sacar el ratón de la ventana con el botón apretado se come el
// pointerup y el tablero se queda girando solo.
cv.addEventListener("pointerdown", e=>{
  if (e.button !== 0) return;                        // solo botón izquierdo
  if (ptrDown) return;                               // un solo puntero por gesto
  if (e.target.closest && e.target.closest(UI)) return;
  e.preventDefault();                                // sin arrastre fantasma del navegador
  prof = e.pointerType === "mouse" ? PROFILE.mouse : PROFILE.touch;
  setInputMode(e.pointerType === "mouse" ? "desktop" : "touch");
  ptrId = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  ptrDown = true; dragAcc = 0; dir = 0; rotT = 0; energy = 0;
  ptrX = e.clientX; lastMoveT = performance.now();
  ptrT = performance.now(); ptrMoved = false;
}, {passive:false});

cv.addEventListener("pointermove", e=>{
  if (!ptrDown || e.pointerId !== ptrId) return;
  const now = performance.now();
  const dt = Math.max(8, now - lastMoveT) / 1000;
  lastMoveT = now;

  const dx = e.clientX - ptrX;
  ptrX = e.clientX;

  // energía del gesto: velocidad instantánea suavizada, normalizada a 0..1
  const inst = Math.min(1, Math.abs(dx)/dt / prof.SPEED_REF);
  energy += (inst - energy) * prof.SPEED_EMA;

  dragAcc += dx;
  const px = dragPx();
  if (Math.abs(dragAcc) >= px){
    const d = Math.sign(dragAcc);
    while (Math.abs(dragAcc) >= px){ rotate(d); dragAcc -= d*px; }
    dir = d;
    ptrMoved = true;
    rotT = holdRate();
  }
}, {passive:true});

// drop=false cierra el gesto sin disparar: cancelación, pérdida de captura o de foco.
function ptrEnd(drop){
  if (!ptrDown) return;
  const quick = (performance.now() - ptrT) < prof.TAP_MS;
  ptrDown = false; ptrId = null; dir = 0; energy = 0;
  if (drop && !ptrMoved && quick) hardDrop();      // toque limpio y rápido
}
cv.addEventListener("pointerup", e=>{ if (e.pointerId === ptrId) ptrEnd(true); });
cv.addEventListener("pointercancel", e=>{ if (e.pointerId === ptrId) ptrEnd(false); });
cv.addEventListener("lostpointercapture", e=>{ if (e.pointerId === ptrId) ptrEnd(false); });
cv.addEventListener("contextmenu", e=> e.preventDefault());

// ── teclado ───────────────────────────────────────────────────────────────
// Toque corto = un paso discreto exacto. Mantenido = velocidad angular creciente.
// Por e.code, no por e.key: con Shift o Bloq Mayús llega "A"/"D" y el keyup no
// matchearía, dejando la rotación enganchada. Y heldKeys es una pila, no un
// escalar: soltar ← teniendo → pulsada tiene que seguir girando a la derecha.
const KEY_DIRS = { ArrowLeft:-1, KeyA:-1, ArrowRight:1, KeyD:1 };
function recalcKeyDir(){
  keyDir = heldKeys.length ? KEY_DIRS[heldKeys[heldKeys.length-1]] : 0;
}

addEventListener("keydown", e=>{
  if (dead && (e.key===" "||e.key==="Enter")){ reset(); return; }
  if (KEY_DIRS[e.code] !== undefined){
    e.preventDefault();
    setInputMode("desktop");
    if (e.repeat) return;                  // la repetición la conduce el juego, no el SO
    if (heldKeys.indexOf(e.code) < 0) heldKeys.push(e.code);
    recalcKeyDir();
    // en pleno barrido, invertir es instantáneo y a la misma velocidad:
    // ni paso discreto, ni DAS de nuevo, ni perder la rampa.
    if (keyMode === "continuous") return;
    rotate(keyDir); keyHoldT = 0; keyMode = "pending";
    return;
  }
  if (e.key==="ArrowDown"||e.key==="s"){ e.preventDefault(); setInputMode("desktop"); hardDrop(); }
});
addEventListener("keyup", e=>{
  if (KEY_DIRS[e.code] === undefined) return;
  const i = heldKeys.indexOf(e.code);
  if (i >= 0) heldKeys.splice(i,1);
  recalcKeyDir();
  // si queda otra pulsada se sigue como se estaba, misma rampa y sin DAS
  if (!keyDir){ keyMode = "idle"; keyIdleT = 0; }
});

// Alt-Tab o salir de la ventana con algo pulsado no puede dejar el tablero girando.
function loseInput(){
  ptrEnd(false);
  heldKeys = []; keyDir = 0; keyMode = "idle"; keyHoldT = 0; keyRamp = 0; keyIdleT = 0;
}
addEventListener("blur", loseInput);
document.addEventListener("visibilitychange", ()=>{ if (document.hidden) loseInput(); });

document.getElementById("over").addEventListener("pointerdown",reset);

// ─── fullscreen ────────────────────────────────────────────────────────────
const fsEl = document.getElementById("fs");
function toggleFS(){
  const d = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement){
    (d.requestFullscreen || d.webkitRequestFullscreen || (()=>{})).call(d);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || (()=>{})).call(document);
  }
}
fsEl.addEventListener("pointerdown", e=>{ e.preventDefault(); e.stopPropagation(); toggleFS(); });
document.addEventListener("fullscreenchange", ()=>{
  fsEl.textContent = document.fullscreenElement ? "⛶" : "⛶";
  setTimeout(resize, 60);
});
addEventListener("keydown", e=>{ if (e.key==="f") toggleFS(); });

// ─── dibujo ────────────────────────────────────────────────────────────────
function bubble(x,y,fill,rad,spec,alpha){
  cx.globalAlpha = alpha===undefined?1:alpha;
  cx.beginPath(); cx.arc(x,y,rad,0,7); cx.fillStyle=fill; cx.fill();
  if (spec){
    cx.beginPath(); cx.arc(x-rad*0.32,y-rad*0.34,rad*0.24,0,7);
    cx.fillStyle="rgba(255,255,255,.82)"; cx.fill();
  }
  cx.globalAlpha = 1;
}

// Anillo de carga. Por fuera no cabía a lo ancho: R*1.25 = PS*0.575 contra un
// medio ancho de PS*0.5 en portrait, con el anclaje de las 9 fuera de pantalla.
// Va por dentro de la frontera, más fino que ella y a unos píxeles, de forma que
// el aro entero es visible en cualquier viewport. Contrapartida asumida: con el
// montón crecido las fichas exteriores lo tapan — se dibuja debajo de ellas.
// No pulsa: es progreso, no alarma.
function drawGauge(){
  if (!gaugeOn()) return;   // sin carga disponible el anillo no existe: ni pista ni relleno
  cx.save();
  cx.lineCap = "butt";                 // corte recto: el arco acaba en radio, no en punta
  cx.lineWidth = PS*GAUGE_W;
  cx.strokeStyle = GAUGE_TRACK;
  cx.beginPath(); cx.arc(ox,oy,gaugeRad,0,7); cx.stroke();

  const p = Math.max(0, Math.min(1, gaugeV/4));
  if (p > 0.002){
    // horario desde las 9: pasa por arriba y cierra en el punto de partida
    cx.strokeStyle = GAUGE_FILL;
    cx.beginPath(); cx.arc(ox,oy,gaugeRad,GAUGE_A0,GAUGE_A0+p*Math.PI*2); cx.stroke();
  }
  if (gaugeFlashT > 0){
    cx.globalAlpha = gaugeFlashT/GAUGE_FLASH;
    cx.lineWidth = PS*GAUGE_W*2.2;
    cx.strokeStyle = "#ffffff";
    cx.beginPath(); cx.arc(ox,oy,gaugeRad,0,7); cx.stroke();
  }
  cx.restore();
}

function draw(){
  // el degradado se estira hasta la esquina más lejana: en horizontal es lo
  // que llena los laterales, en vertical apenas cambia.
  const gR = Math.max(PS*0.85, Math.hypot(W,H)/2);
  const g = cx.createRadialGradient(ox,oy,PS*0.05,ox,oy,gR);
  g.addColorStop(0,"#141a34"); g.addColorStop(1,"#05050c");
  cx.fillStyle=g; cx.fillRect(0,0,W,H);

  // frontera. El aviso no es un umbral calibrado sino un hecho: late si hay
  // alguna celda de profundidad 1 —de borde— ocupada, que es literalmente la
  // condición de muerte con una bola de margen. Es global, no direccional: dice
  // "estás en peligro", no "aquí"; el jugador ya está mirando el montón.
  // Lo único calibrable: si el rojo entra tarde en los niveles altos, el
  // disparador pasa de 1 a 2 —dos bolas de margen— y no se toca nada más.
  let danger = false;
  for (let i=0;i<N*N;i++) if (grid[i] && DEPTH[i]===1){ danger = true; break; }
  cx.beginPath(); cx.arc(ox,oy,R,0,7);
  cx.lineWidth = PS*BORDER_W;
  if (danger){
    cx.save();
    cx.globalAlpha = 0.55+0.45*Math.abs(Math.sin(t*7));
    cx.strokeStyle = DANGER; cx.stroke();
    cx.restore();
  } else {
    cx.strokeStyle = "rgba(120,110,230,.75)"; cx.stroke();
  }

  drawGauge();

  // aviso de la próxima ficha: arco de 35° fuera del círculo, en su color
  if (!dead && nextSpawn && spawnT < TELEGRAPH){
    const p = 1 - Math.max(0,spawnT)/TELEGRAPH;        // 0 → 1 al acercarse
    const col = nextSpawn.k===WHITE ? PAINT[WHITE] : COL[nextSpawn.k];
    const a0 = nextSpawn.aArc - TELEGRAPH_ARC/2, a1 = nextSpawn.aArc + TELEGRAPH_ARC/2;
    const pulse = 0.35 + 0.65*p*(0.75+0.25*Math.sin(t*11));
    // engorda al acercarse, pero creciendo hacia FUERA desde un borde interior
    // fijo: el aire contra la frontera se mantiene en RING_GAP durante todo el
    // latido en vez de abrirse y cerrarse con él.
    const lw = PS*TELE_W*(0.6+0.4*p);

    cx.save();
    cx.lineCap = "butt";                 // corte recto, mismo remate que el gauge
    // halo ancho y difuso: es resplandor, queda deliberadamente fuera de la
    // progresión de grosores, pero arranca del MISMO borde interior que el trazo
    // y crece solo hacia fuera, para no comerse el aire contra la frontera.
    cx.globalAlpha = 0.16*pulse;
    cx.beginPath(); cx.arc(ox,oy,teleRadIn + PS*TELE_HALO_W/2,a0,a1);
    cx.lineWidth = PS*TELE_HALO_W; cx.strokeStyle = col; cx.stroke();
    // trazo nítido
    cx.globalAlpha = 0.85*pulse;
    cx.beginPath(); cx.arc(ox,oy,teleRadIn + lw/2,a0,a1);
    cx.lineWidth = lw; cx.strokeStyle = col; cx.stroke();
    cx.restore();
  }

  const rad = CELL*0.45;
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    const b = grid[idx(c,r)]; if (!b) continue;
    const vc = b.vc===undefined?c:b.vc, vr = b.vr===undefined?r:b.vr;
    const [x,y] = cellToWorldF(vc,vr);
    if (b.k<0){ bubble(x,y,"#0a0a10",rad*1.12,false);
                cx.beginPath(); cx.arc(x,y,rad*1.12,0,7);
                cx.strokeStyle="rgba(150,150,190,.35)"; cx.lineWidth=1.5; cx.stroke(); }
    else {
      const fl = flashT>0 && flashSet.has(idx(c,r));
      let fill = b.k===WHITE ? PAINT[WHITE] : (b.k===STONE ? PAINT[STONE] : COL[b.k]);
      let rr = rad;
      if (fl){
        // fundido rápido a blanco + ligero crecimiento antes de desaparecer
        const p = 1 - flashT/FLASH_TIME;         // 0 → 1
        const e = p*p*(3-2*p);                   // suavizado
        fill = mix(fill, "#ffffff", Math.min(1, e*1.35));
        rr = rad*(1 + 0.30*e);
        cx.save();
        cx.globalAlpha = 0.55*(1-e);
        cx.beginPath(); cx.arc(x,y,rad*(1.2+1.1*e),0,7);
        cx.fillStyle = "#ffffff"; cx.fill();
        cx.restore();
      }
      bubble(x,y,fill,rr, !fl && b.k!==STONE);
      if (b.k===WHITE && !fl){
        cx.beginPath(); cx.arc(x,y,rad,0,7);
        cx.strokeStyle="rgba(120,120,140,.7)"; cx.lineWidth=1.5; cx.stroke();
      }
      if (level >= 2 && !fl && b.k!==WHITE && b.k!==STONE && b.age > STONE_WARN){
        // aviso: anillo gris que engorda. Empieza lento y discreto, y solo
        // acelera al acercarse la petrificación: urgencia, no ansiedad constante.
        // El nivel 1 lo esconde aunque la edad ya corra: nada se muestra antes
        // de su nivel, y el aviso es justo lo que el tip del nivel 2 nombra.
        const p = (b.age-STONE_WARN)/(STONE_TIME-STONE_WARN);
        const freq  = 1.8 + 11*p*p;
        const pulse = (0.30 + 0.55*p) * (0.62 + 0.38*Math.abs(Math.sin(b.age*freq)));
        cx.globalAlpha = pulse;
        cx.beginPath(); cx.arc(x,y,rad*0.99,0,7);
        cx.strokeStyle = PAINT[STONE];
        cx.lineWidth = rad*(0.08+0.46*p*p);
        cx.stroke();
        cx.globalAlpha = 1;
      }
    }
  }

  // la causante del game over, en coordenadas de grid como las del montón:
  // gira con el tablero y no se mueve más, porque con `dead` nada avanza.
  if (deadBall){
    const [x,y] = cellToWorldF(deadBall.vc, deadBall.vr);
    bubble(x,y, deadBall.k===WHITE?PAINT[WHITE]:COL[deadBall.k], rad, true);
  }

  for (const b of flying){
    if (b.bonus){
      cx.beginPath();
      for (let i=0;i<b.trail.length;i++){
        const [tx,ty]=b.trail[i]; i?cx.lineTo(tx,ty):cx.moveTo(tx,ty);
      }
      cx.strokeStyle="rgba(242,107,58,.45)"; cx.lineWidth=rad*0.5; cx.stroke();
      const pu = 1+0.18*Math.sin(t*18);
      bubble(b.x,b.y,"#f26b3a",rad*1.05*pu,true);
    } else {
      if (b.hard){
        cx.beginPath();
        for (let i=0;i<b.trail.length;i++){
          const [tx,ty]=b.trail[i]; i?cx.lineTo(tx,ty):cx.moveTo(tx,ty);
        }
        cx.strokeStyle="rgba(255,255,255,.30)"; cx.lineWidth=rad*0.9; cx.lineCap="round";
        cx.stroke();
      }
      bubble(b.x,b.y, b.k===WHITE?PAINT[WHITE]:COL[b.k], rad, true);
      if (b.hard){
        cx.beginPath(); cx.arc(b.x,b.y,rad*1.45,0,7);
        cx.strokeStyle="rgba(255,255,255,.55)"; cx.lineWidth=rad*0.16; cx.stroke();
      }
    }
  }
  drawFloaters();
}
function mix(a,b,p){
  const h=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));
  const A=h(a),B=h(b);
  return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*p)).join(",")})`;
}

// ─── loop ──────────────────────────────────────────────────────────────────
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;

  if (!dead){
    t += dt;
    // progresión: `t` manda y `level` se deriva. El último nivel es terminal.
    // `while` y no `if`: arrancar en un nivel adelantado (?nivel=N) encadena
    // aquí todos los intermedios en orden, ejecutando cada on() —blancas activas,
    // morado en la bolsa— y dejando a la vista el tip del nivel destino.
    while (level < LEVELS.length && t >= LEVELS[level].at){
      const entering = LEVELS[level];    // 0-indexado: la entrada del nivel que abre
      level++;
      showLevel();                       // fija tipT, o lo deja a 0 si el tip ya está visto
      if (entering.on) entering.on();    // mecánica del nivel: corre siempre
      // la puesta en escena acompaña al texto: sin tip que leer no pinta nada
      if (entering.intro && tipT > 0) entering.intro();
    }
    if (tipT > 0){
      tipT -= dt;
      // el fade-out ocurre DESPUÉS de agotar la ventana de lectura, no dentro
      if (tipT <= 0){
        tipEl.classList.remove("on");
        // Único punto de consumo del tutorial: la ventana se ha agotado entera y
        // dentro de la partida. Morir con el tip a la vista no cuenta —con `dead`
        // esto no corre— y no hay forma de sumar dos veces el mismo nivel.
        tutConsume(LEVELS[level-1].id);
      }
    }
    // teclado: DAS, rampa continua y decaimiento de la rampa al soltar
    if (keyMode === "pending"){
      keyHoldT += dt;
      if (keyHoldT >= KEY_DAS) keyMode = "continuous";
    } else if (keyMode === "idle"){
      keyIdleT += dt;
      // se retiene un instante: soltar y repulsar en mitad de un barrido no frena
      if (keyIdleT > KEY_RAMP_RETAIN)
        keyRamp = Math.max(0, keyRamp - dt/KEY_RAMP_DECAY);
    }
    if (keyMode === "continuous" && keyDir){
      keyRamp = Math.min(1, keyRamp + dt/KEY_RAMP_TIME);
      // cuadrática: arranque contenido para el control, apertura para los barridos
      const w = KEY_W_MIN + (KEY_W_MAX-KEY_W_MIN)*keyRamp*keyRamp;
      angleT += keyDir * w*DEG * dt;
    }
    // gira solo si el dedo está apoyado; con tecla pulsada manda el teclado
    if (!keyDir && ptrDown && dir){
      rotT -= dt;
      if (rotT <= 0){ rotate(dir); rotT = holdRate(); }
    } else rotT = 0;
    // el ángulo con el que se dibujó el frame anterior; rayCast() lo necesita para
    // leer dónde estaba cada bola EN EL TABLERO, no en la pantalla.
    anglePrev = angle;
    angle += (angleT-angle)*Math.min(1,ROT_TWEEN*dt);

    spawnT -= dt;
    if (spawnT<=0){
      if (nextSpawn.sine) spawnSine(nextSpawn); else spawnNormal(nextSpawn);
      nextSpawn = pickNext();
      spawnT = SPAWN_MIN + (SPAWN_START-SPAWN_MIN)*Math.exp(-t/SPAWN_RAMP*1.6);
    }
    // ciclo propio de las blancas, ajeno al de las fichas de color
    if (level >= 3){
      whiteT -= dt;
      if (whiteT <= 0){ spawnWhite(); whiteT = whiteInterval(); }
    }

    // el anillo persigue al valor lógico: commitFlash() suma de golpe, y un salto
    // instantáneo de 60° es un parpadeo, no una recompensa.
    gaugeV += (gauge - gaugeV)*Math.min(1, GAUGE_TWEEN*dt);
    if (gaugeFlashT > 0) gaugeFlashT -= dt;
    // el bonus espera a que el arco haya cerrado el anillo, no a que el contador
    // llegue a 4: disparar con gaugeV a medias rompe la relación que busca el aro.
    if (gaugeOn() && gauge >= 4 && gaugeV >= 3.97){
      gaugeFlashT = GAUGE_FLASH;
      spawnBonus(4);
      gauge = 0;                 // gaugeV baja sola: el anillo se vacía barriendo
    }

    stepFlying(dt);
    ageBubbles(dt);
  }
  stepFlash(dt);
  easeVisual(dt);
  stepFloaters(dt);

  draw();
  document.getElementById("score").textContent = score;
  // el récord se mueve durante la partida, en espejo con el marcador de arriba:
  // superarlo es un momento de juego, no un dato de menú.
  if (score > bestScore){ bestScore = score; save.best = bestScore; saveDirty = true; }
  bestEl.textContent = bestScore;
  if (dead){
    if (!bestSaved){ bestSaved = true; flushIfDirty(); }
    document.getElementById("over").style.display="flex";
    document.getElementById("fin").textContent = score+" puntos";
  }
  requestAnimationFrame(frame);
}

resize(); reset(); requestAnimationFrame(frame);
</script>
</body>
</html>
