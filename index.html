function syncBubOut(){
  const n = Math.round(BUB_OUT_DENSITY * (W/PS) * (H/PS)) || 0;
  while (bubOut.length < n) bubOut.push({ u:vrand(), v:vrand(), sz:.002+vrand()*.0055, sp:.013+vrand()*.034, ph:vrand()*TAU });
  bubOut.length = n;
}

// Un tick del fondo, al final de updateGame(). Corre también en la fase A del
// tutorial y tras morir; con `paused` no, y el fondo se congela con la partida.
// Alarma: continua, según la profundidad DEPTH de la bola más exterior (4 o
// más → 0; 1, borde ocupado → 1). Es el único aviso de muerte que hay.
function stepBg(dt){
  let dmin = 8;
  for (let i=0;i<N*N;i++) if (grid[i] && grid[i].k>=0 && DEPTH[i]<dmin) dmin = DEPTH[i];
  const alarmTarget = bgClamp((ALARM_DEPTH0 - dmin)/(ALARM_DEPTH0 - 1));
  bgT += dt;
  lavaT += dt*LAVA_SPEED*(1 + LAVA_ALARM_BOOST*alarm);
  alarm += (alarmTarget - alarm)*Math.min(1, ALARM_TWEEN*dt);
  for (const b of bubOut){ b.v -= b.sp*PS/H*dt; if (b.v < -0.02){ b.v = 1.02; b.u = vrand(); } }
  // lo que giró el tablero en este tick, leído aquí y no de anglePrev, que tras
  // morir deja de actualizarse
  const d = angle - flowPrev; flowPrev = angle;
  if (d) flowDir = Math.sign(d);
  flowW += FLOW_KICK*d + (flowDir*FLOW_SPIN - flowW)*Math.min(1, FLOW_RELAX*dt);
  flowW = Math.max(-FLOW_MAX, Math.min(FLOW_MAX, flowW));
  for (const b of bubIn) b.th += flowW*Math.pow(FLOW_RHO0/b.rho, FLOW_EXP)*dt;
}

// gama activa [arriba, abajo], ya calentada hacia BG_WARM con la alarma
function bgPalette(){
  const u = (bgT/BG_CYCLE)%1*BG_KEYS.length, i = Math.floor(u), f = bgEase(u-i);
  const A = BG_KEYS[i], B = BG_KEYS[(i+1)%BG_KEYS.length], w = Math.pow(alarm, ALARM_CURVE)*ALARM_MAX;
  return [bgMix(bgMix(A[0],B[0],f),BG_WARM[0],w), bgMix(bgMix(A[1],B[1],f),BG_WARM[1],w)];
}
// lava: el degradado y las bolas horneadas, sumadas con "lighter" (donde dos se
// tocan, la zona común sale más clara). Es función pura de lavaT.
function drawLava(){
  cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = "low";
  cx.drawImage(lavaBaseCv, 0, 0, W, H);
  cx.save(); cx.globalCompositeOperation = "lighter";
  for (const b of BLOBS){
    const r = (b.r0 + b.ra*Math.sin(lavaT*b.wr + b.ph))*PS*LAVA_EXT;
    const x = (b.x0 + b.ax*Math.sin(lavaT*b.wx*TAU + b.ph))*W;
    const y = (b.y0 + b.ay*Math.sin(lavaT*b.wy*TAU + b.ph*1.7))*H;
    cx.drawImage(lavaBallCv, x - r, y - r, 2*r, 2*r);
  }
  cx.restore();
  // todo lo que se pinta después en el frame (cuenco, sprites) hereda este estado
  cx.imageSmoothingQuality = "high";
}
function drawBg(){
  drawLava();
  // burbujas de la zona lisa: no se pintan dentro del cuenco
  const in2 = R*1.08*R*1.08;
  for (const b of bubOut){
    const x = b.u*W + Math.sin(bgT*.8+b.ph)*PS*.013, y = b.v*H, dx = x-ox, dy = y-oy;
    if (dx*dx + dy*dy < in2) continue;
    const pl = .5+.5*Math.sin(bgT*1.3+b.ph); drawBub(F_BG, x, y, b.sz*PS*(1+.3*pl), .22+.33*pl);
  }
  cx.globalAlpha = 1;
  cx.drawImage(lightsCv, 0, 0, W, H);
  cx.drawImage(bowlCv, ox-R*BOWL_EXT, oy-R*BOWL_EXT, R*BOWL_EXT*2, R*BOWL_EXT*2);
  // burbujas del cuenco: el giro con inercia de stepBg()
  for (const b of bubIn){
    const a = b.th;
    const pl = .5+.5*Math.sin(bgT*1.3+b.ph);
    drawBub(F_BG, ox + Math.cos(a)*b.rho*R, oy + Math.sin(a)*b.rho*R, b.sz*PS*(1+.3*pl), .25+.35*pl);
  }
  cx.globalAlpha = 1;
  // es la roca central (b.k<0): el montón ya no la pinta
  cx.drawImage(bumpCv, ox-bumpD/2, oy-bumpD/2, bumpD, bumpD);
  // pase de color: tiñe todo lo anterior con la gama activa
  const [top, bot] = bgPalette(), mid = bgMix(top, bot, .5);
  cx.save(); cx.globalCompositeOperation = "color";
  const g = cx.createLinearGradient(0,0,0,H); g.addColorStop(0,bgRgb(top)); g.addColorStop(.5,bgRgb(mid)); g.addColorStop(1,bgRgb(bot));
  cx.fillStyle = g; cx.fillRect(0,0,W,H); cx.restore();
}

// ─── bolas ─────────────────────────────────────────────────────────────────
// Cristal de joya sin elementos internos: borde, cuerpo, luz interior difusa y
// reflejos de una luz fija arriba a la izquierda. Todo se hornea en resize() a
// DPR y por frame solo hay drawImage. La piedra es la excepción: su textura es
// del objeto y gira con el tablero; su luz, como la del cristal, no.
const BALL_R0K = 1.15;                // radio de horneado / radio de la bola: margen para el borde
const TL_COLOR = .12, TL_WHITE = .06, TL_BONUS = .37;   // translucidez del cuerpo
const CRACKS = 4;                     // grietas del aviso de piedra, que entran de una en una
const SHADOW_A = .33, SHADOW_OFF = [.2, .38];   // alfa y desplazamiento, en radios
const LIFT_FLY = .6;                  // altura aparente de lo que vuela: sombra mayor y más lejos

// Cachés en px, rehorneadas en resize(). `d` es el lado en px CSS: se pintan a
// escala r/rad cuando la bola sale a otro radio (pop, especial).
let ballSpr = {}, stoneAlb, stoneSpr, stoneLt, crackL = [], crackC = [], shadowSpr;
function ballCanvas(d){
  const o = bgCanvas(d*DPR, d*DPR), x = o.getContext("2d");
  x.scale(o.width/d, o.height/d); x.translate(d/2, d/2); o.d = d;
  return [o, x];
}
const ballRgb = (c,a)=>`rgba(${c.map(v=>Math.round(v)).join(",")},${a===undefined ? 1 : a})`;
function ballDisc(x, px, py, r, fill){ x.beginPath(); x.arc(px, py, r, 0, TAU); x.fillStyle = fill; x.fill(); }
function ballGrad(x, x0, y0, r0, x1, y1, r1, stops){
  const g = x.createRadialGradient(x0, y0, r0, x1, y1, r1);
  for (const [o,c] of stops) g.addColorStop(o, c);
  return g;
}
function bakeGlass([L, B, Dk], R0, tl, extra){
  const [o, x] = ballCanvas(Math.ceil(2.2*R0)), a = 1 - tl, Wt = [255,255,255];
  ballDisc(x, 0, 0, R0, ballRgb(Dk));                                       // borde
  ballDisc(x, 0, 0, R0*.9, ballGrad(x, 0, R0*.28, 0, 0, 0, R0*.9,          // cuerpo
    [[0, ballRgb(L, a)], [.5, ballRgb(B, Math.min(1, a+.05))], [.85, ballRgb(bgMix(B,Dk,.35))], [1, ballRgb(bgMix(B,Dk,.6))]]));
  if (extra) extra(x, R0);
  // luz interior: cáustica abajo a la derecha y filo interior, sin arco trazado
  x.save(); x.beginPath(); x.arc(0, 0, R0*.9, 0, TAU); x.clip();
  x.save(); x.translate(R0*.22, R0*.34); x.rotate(-.5); x.scale(1, .62);
  ballDisc(x, 0, 0, R0*.58, ballGrad(x, 0, 0, 0, 0, 0, R0*.58,
    [[0, ballRgb(bgMix(L,Wt,.35), .62)], [.45, ballRgb(L, .30)], [1, ballRgb(L, 0)]]));
  x.restore();
  ballDisc(x, 0, 0, R0*.9, ballGrad(x, -R0*.06, -R0*.12, R0*.70, -R0*.06, -R0*.12, R0*1.02,
    [[0, ballRgb(B, 0)], [.55, ballRgb(bgMix(L,Wt,.2), .34)], [1, ballRgb(L, 0)]]));
  // reflejo superior
  x.beginPath(); x.ellipse(0, -R0*.4, R0*.6, R0*.34, 0, 0, TAU);
  x.fillStyle = ballGrad(x, 0, -R0*.55, 0, 0, -R0*.4, R0*.6,
    [[0, "rgba(255,255,255,.70)"], [.6, "rgba(255,255,255,.26)"], [1, "rgba(255,255,255,0)"]]);
  x.fill(); x.restore();
  // pico de luz y chispa
  x.save(); x.translate(-R0*.36, -R0*.42); x.rotate(-.7);
  x.beginPath(); x.ellipse(0, 0, R0*.2, R0*.11, 0, 0, TAU); x.fillStyle = "#fff"; x.fill(); x.restore();
  ballDisc(x, R0*.2, -R0*.6, R0*.055, "rgba(255,255,255,.95)");
  return o;
}
// perla: tornasol en lugar del trazo gris de antes
function pearlSheen(x, R0){
  ballDisc(x, 0, 0, R0*.9, ballGrad(x, R0*.3, -R0*.1, 0, R0*.3, -R0*.1, R0*.8,
    [[0, "rgba(255,190,230,.28)"], [1, "rgba(160,210,255,0)"]]));
}
// especial: el rayo dentro. shadowBlur no sigue a la matriz: va en px del lienzo
function boltGlyph(x, R0){
  x.save();
  x.shadowColor = "rgba(240,255,190,.95)"; x.shadowBlur = R0*.5*DPR;
  x.beginPath();
  for (const [u,v] of [[.12,-.62],[-.30,.05],[-.02,.05],[-.16,.62],[.32,-.10],[.03,-.10],[.20,-.62]]) x.lineTo(u*R0, v*R0);
  x.closePath(); x.fillStyle = "rgba(252,255,232,.95)"; x.fill();
  x.restore();
}
// textura de la piedra, sin luz: gira con el tablero. Semilla fija, así que
// rehornear da siempre la misma piedra.
function bakeStoneAlbedo(R0){
  const [o, x] = ballCanvas(Math.ceil(2.2*R0)), r = mulberry32(0x57013);
  x.save(); x.beginPath(); x.arc(0, 0, R0*.92, 0, TAU); x.clip();
  ballDisc(x, 0, 0, R0, "#8f8a84");
  for (let i=0;i<26;i++){                                                   // manchas
    const a = r()*TAU, d = r()*R0*.9, s = R0*(.12 + r()*.3);
    ballDisc(x, Math.cos(a)*d, Math.sin(a)*d, s, r()<.5 ? "rgba(255,250,240,.14)" : "rgba(40,38,45,.16)");
  }
  x.strokeStyle = "rgba(50,48,55,.35)"; x.lineWidth = R0*.03;              // vetas
  for (let i=0;i<3;i++){
    const a = r()*TAU;
    x.beginPath(); x.moveTo(Math.cos(a)*R0*.9, Math.sin(a)*R0*.9);
    x.quadraticCurveTo((r()-.5)*R0, (r()-.5)*R0, Math.cos(a+2+r())*R0*.9, Math.sin(a+2+r())*R0*.9);
    x.stroke();
  }
  for (let i=0;i<170;i++){                                                  // granos
    const a = r()*TAU, d = Math.sqrt(r())*R0*.92;
    x.fillStyle = r()<.55 ? "rgba(30,30,35,.38)" : "rgba(255,255,250,.32)";
    x.fillRect(Math.cos(a)*d, Math.sin(a)*d, .6 + r()*.9, .6 + r()*.9);
  }
  for (let i=0;i<7;i++){                                                    // poros
    const a = r()*TAU, d = r()*R0*.7, s = R0*(.05 + r()*.07);
    ballDisc(x, Math.cos(a)*d, Math.sin(a)*d, s, "rgba(35,33,38,.42)");
  }
  x.restore();
  return o;
}
function bakeStoneLight(R0){
  const [o, x] = ballCanvas(Math.ceil(2.2*R0));
  x.save(); x.beginPath(); x.arc(0, 0, R0*.92, 0, TAU); x.clip();
  ballDisc(x, 0, 0, R0, ballGrad(x, -R0*.3, -R0*.35, 0, 0, 0, R0,
    [[0, "rgba(255,250,240,.28)"], [.5, "rgba(0,0,0,0)"], [1, "rgba(10,10,20,.45)"]]));
  x.restore();
  x.strokeStyle = "#3a3a40"; x.lineWidth = R0*.09;
  x.beginPath(); x.arc(0, 0, R0*.955, 0, TAU); x.stroke();
  return o;
}
// Grietas del aviso, girando con el tablero como la textura. Cada una es un
// tronco en zigzag del borde hacia dentro, que se adelgaza, con una rama.
// crackL[j] lleva solo la grieta j; crackC[j], de la 0 a la j: así el aviso
// pinta las ya abiertas y la que entra con dos drawImage. Semilla fija.
function bakeCracks(R0){
  const r = mulberry32(0xC4AC), d = Math.ceil(2.2*R0);
  const trace = (x, pts, w0) => {
    for (let i=1;i<pts.length;i++){
      x.lineWidth = w0*(1 - .6*i/pts.length);
      x.beginPath(); x.moveTo(...pts[i-1]); x.lineTo(...pts[i]); x.stroke();
    }
  };
  crackL = []; crackC = [];
  for (let j=0;j<CRACKS;j++){
    const [o, x] = ballCanvas(d);
    x.beginPath(); x.arc(0, 0, R0*.92, 0, TAU); x.clip();
    x.lineCap = x.lineJoin = "round"; x.strokeStyle = "rgba(28,25,30,.85)";
    let a = j*TAU/CRACKS + (r()-.5)*.9, e = R0;           // repartidas alrededor
    const pts = [[Math.cos(a)*e, Math.sin(a)*e]], reach = R0*(.15 + .3*r());
    while (e > reach){ e -= R0*(.1 + .08*r()); a += (r()-.5)*.7; pts.push([Math.cos(a)*e, Math.sin(a)*e]); }
    trace(x, pts, R0*.06);
    const [u, v] = pts[1 + Math.floor(r()*(pts.length-2))], br = [[u, v]];
    let ab = Math.atan2(v, u) + (r()<.5 ? -1 : 1)*(.6 + .4*r()), eb = Math.hypot(u, v);
    for (let i=0;i<2;i++){ eb -= R0*(.08 + .06*r()); ab += (r()-.5)*.5; br.push([Math.cos(ab)*eb*1.08, Math.sin(ab)*eb*1.08]); }
    trace(x, br, R0*.035);
    crackL.push(o);
    const [oc, xc] = ballCanvas(d);
    if (j) xc.drawImage(crackC[j-1], -d/2, -d/2, d, d);
    xc.drawImage(o, -d/2, -d/2, d, d);
    crackC.push(oc);
  }
}
// la piedra es el último fotograma del aviso: textura con todas las grietas
function bakeStone(){
  const d = stoneAlb.d, [o, x] = ballCanvas(d);
  x.drawImage(stoneAlb, -d/2, -d/2, d, d);
  x.drawImage(crackC[CRACKS-1], -d/2, -d/2, d, d);
  return o;
}
function bakeShadow(R0){
  const [o, x] = ballCanvas(Math.ceil(3*R0));
  ballDisc(x, 0, 0, R0*1.15, ballGrad(x, 0, 0, R0*.55, 0, 0, R0*1.15, [[0, "rgba(0,0,0,.8)"], [1, "rgba(0,0,0,0)"]]));
  return o;
}
function bakeBalls(){
  const R0 = CELL*.45*BALL_R0K;
  ballSpr = {};
  JEWEL.forEach((j, k)=>{ ballSpr[k] = bakeGlass(j, R0, TL_COLOR); });
  ballSpr[WHITE] = bakeGlass(JEWEL_WHITE, R0, TL_WHITE, pearlSheen);
  ballSpr.bonus  = bakeGlass(JEWEL_BONUS, R0, TL_BONUS, boltGlyph);
  stoneAlb = bakeStoneAlbedo(R0);
  bakeCracks(R0);
  stoneSpr = bakeStone();
  stoneLt = bakeStoneLight(R0);
  shadowSpr = bakeShadow(R0);
}

// Aviso de salida: dos sprites por color, horneados aquí y dibujados con dos
// drawImage girados; por frame no hay trazos, degradados ni modos de fusión.
// - núcleo: opaco en el primer tercio de TELE_W, pegado a la frontera: con alfa
//   el fondo teñido le cambiaba el tono.
// - resplandor: la transparencia va horneada. Es lo único que late con la
//   cuenta atrás.
// Hacia fuera los dos siguen una misma curva de cola larga, 1/(1 + (d/s)²), más
// corta en el núcleo (TELE_FALL_CORE) que en el resplandor (TELE_FALL), que va
// debajo entero: sin codo ni hueco entre ellos en ningún punto del latido. Con
// smoothstep el canto caía de golpe a la altura del resplandor, o, ancho, se
// leía como una banda gorda. Los extremos se funden igual, y el resplandor
// rebasa un poco el arco. Nada pasa de TELE_HALO_W (ver HALO_R).
// Color: arranca en el tono del borde de la bola, la sombra de la joya, y vira
// hacia la base al alejarse, como el canto de la bola leído de fuera hacia
// dentro. El viraje sale rápido y acaba lento (1 − (1 − x)²): el oscuro queda
// en un filo contra la frontera y la base llega poco a poco. Con la base pura desde el borde, numéricamente era el color de la bola
// pero no el que se percibe en ella, que lo marca su contorno.
// Marco del sprite: +x apunta al centro del arco.
const TELE_FALL_CORE = .009;  // escala de la caída del núcleo, múltiplo de PS
const TELE_FALL      = .026;  // escala de la caída con el resplandor entero
const TELE_RIM       = .025;  // distancia en la que el borde vira a la base, en PS
const TELE_CORE_IN   = .1;    // fracción del aviso que tarda en aparecer el núcleo
let teleSpr = {};             // [k] = { core, glow, x, y, w, h }, en px CSS
function bakeTele(){
  const s = PS*DPR, r0 = teleRadIn*DPR, hw = TELE_HALO_W*s, d0 = TELE_W*s/3;
  const half = TELEGRAPH_ARC/2, amax = half + hw*.5/r0;
  const x0 = Math.floor(r0*Math.cos(amax)) - 1, w = Math.ceil(r0 + hw) + 1 - x0;
  const yh = Math.ceil((r0 + hw)*Math.sin(amax)) + 1, h = 2*yh;
  const core = new Float32Array(w*h), glow = new Float32Array(w*h), mix = new Float32Array(w*h);
  for (let j=0;j<h;j++){ const y = j + .5 - yh;
    for (let i=0;i<w;i++){ const x = i + .5 + x0, dr = Math.hypot(x, y) - r0;
      const edge = bgClamp(dr + .5);                     // borde interior nítido, a 1 px
      if (!edge) continue;
      const phi = Math.abs(Math.atan2(y, x)), n = j*w + i;
      const d = Math.max(0, dr - d0)/s, cut = edge*(1 - bgSst(.55, 1, dr/hw));
      const c = cut/(1 + (d/TELE_FALL_CORE)**2)*(1 - bgSst(half*.55, half, phi));
      const all = cut/(1 + (d/TELE_FALL)**2)*(1 - bgSst(half*.55, amax, phi));
      core[n] = c; glow[n] = all; mix[n] = 1 - (1 - Math.min(1, Math.max(0, dr)/s/TELE_RIM))**2;
    }
  }
  const paint = (a, [, B, Dk])=>{
    const o = bgCanvas(w, h), x = o.getContext("2d"), im = x.createImageData(w, h), d = im.data;
    for (let n=0;n<w*h;n++){ const m = mix[n];
      d[4*n] = Dk[0] + (B[0]-Dk[0])*m; d[4*n+1] = Dk[1] + (B[1]-Dk[1])*m; d[4*n+2] = Dk[2] + (B[2]-Dk[2])*m;
      d[4*n+3] = Math.round(a[n]*255); }
    x.putImageData(im, 0, 0);
    return o;
  };
  const spr = J => ({ core:paint(core, J), glow:paint(glow, J), x:x0/DPR, y:-yh/DPR, w:w/DPR, h:h/DPR });
  teleSpr = {};
  JEWEL.forEach((J, k)=>{ teleSpr[k] = spr(J); });
  teleSpr[WHITE] = spr(JEWEL_WHITE);
}
// El aviso no se apaga al salir la ficha: aguanta TELE_HOLD encendido mientras
// ella crece (BORN_T) y se funde en TELE_FADE, para que los dos convivan.
const TELE_HOLD = .2, TELE_FADE = .3;
function drawTele(k, aArc, glowA, coreA){
  const sp = teleSpr[k];
  cx.save();
  cx.translate(ox, oy); cx.rotate(aArc);
  cx.globalAlpha = glowA; cx.drawImage(sp.glow, sp.x, sp.y, sp.w, sp.h);
  cx.globalAlpha = coreA; cx.drawImage(sp.core, sp.x, sp.y, sp.w, sp.h);
  cx.restore();
}
// La ficha nace a su tamaño lógico —el vuelo y los choques no cambian—, pero se
// dibuja creciendo desde BORN_G0 con un leve rebote, para no salir de la nada.
const BORN_T = .22, BORN_G0 = .3, BORN_BACK = 1.2;
function bornScale(b, tv){
  const u = Math.max(0, Math.min(1, (tv - b.born)/BORN_T)) - 1;
  return BORN_G0 + (1 - BORN_G0)*(1 + (BORN_BACK + 1)*u*u*u + BORN_BACK*u*u);
}

// sprite centrado en (x,y) a escala s; con `rot`, girado sobre su centro
function sprite(o, x, y, s, rot){
  const d = o.d*s;
  if (rot){ cx.save(); cx.translate(x, y); cx.rotate(rot); cx.drawImage(o, -d/2, -d/2, d, d); cx.restore(); }
  else cx.drawImage(o, x - d/2, y - d/2, d, d);
}
// una bola de tipo k a radio r. La piedra lleva el giro del tablero en la
// textura; la luz, nunca.
function drawBall(k, x, y, r){
  const s = r/(CELL*.45);
  if (k === STONE){ sprite(stoneSpr, x, y, s, angleDraw); sprite(stoneLt, x, y, s); }
  else sprite(ballSpr[k], x, y, s);
}
// Aviso de piedra, sobre la bola entera: las grietas entran de una en una (todas
// abiertas a p = .8) y la piedra la cubre por igual con alfa p³, que es mezclar
// el color hacia su gris sin cambiarle el tono. Con p³ los dos colores más
// parecidos siguen a ΔE ≥ 18 a 3,5 s de petrificarse (con la costra radial de
// antes, a 1). En p = 1 es exactamente la piedra de drawBall(): no hay salto.
// Como mucho cuatro drawImage, sin máscaras ni gradientes por frame.
function drawStoneWarn(age, x, y, r){
  const p = Math.max(0, Math.min(1, (age-STONE_WARN)/(STONE_TIME-STONE_WARN)));
  const s = r/(CELL*.45), m = p*p*p, n = p*CRACKS*1.25, i = Math.min(CRACKS, Math.floor(n));
  cx.globalAlpha = m; sprite(stoneAlb, x, y, s, angleDraw);
  cx.globalAlpha = 1; if (i) sprite(crackC[i-1], x, y, s, angleDraw);
  if (i < CRACKS){ cx.globalAlpha = n - i; sprite(crackL[i], x, y, s, angleDraw); }
  cx.globalAlpha = m; sprite(stoneLt, x, y, s);
  cx.globalAlpha = 1;
}
function drawShadow(x, y, r, lift){
  const s = r/(CELL*.45)*(1 + .2*lift), o = 1 + 1.5*lift;
  sprite(shadowSpr, x + r*SHADOW_OFF[0]*o, y + r*SHADOW_OFF[1]*o, s);
}

// ─── estela de burbujas ────────────────────────────────────────────────────
// Lo que distingue el hard drop: más burbujas y más gordas, sin aro ni trazo.
// Solo decorado, en el mundo y en PS como las bolas en vuelo. Nace y avanza en
// updateGame() con su PRNG `prand` —ni Math.random ni vrand ni rrand—, así que la
// partida es la misma con o sin ella. Blancas, del atlas de bakeBubs().
// Pool fijo en anillo, sin asignar nada por frame: `trailHead` es el siguiente
// hueco y los `trailN` anteriores son los ocupados, vivos o no. Lleno, la nueva
// pisa a la más antigua emitida; con hard drop eso solo recorta burbujas de más
// de 0,8 s, ya casi transparentes.
const BUB_TRAIL_N = 1, BUB_TRAIL_HARD = 5;   // por tick y bola en vuelo
const BUB_TRAIL_MAX = 240;                   // emitidas; sobran las más viejas
const prand = mulberry32(0xb0b1e);
const trX = new Float32Array(BUB_TRAIL_MAX), trY = new Float32Array(BUB_TRAIL_MAX),
      trVx = new Float32Array(BUB_TRAIL_MAX), trVy = new Float32Array(BUB_TRAIL_MAX),
      trR = new Float32Array(BUB_TRAIL_MAX), trLife = new Float32Array(BUB_TRAIL_MAX),
      trAge = new Float32Array(BUB_TRAIL_MAX);
let trailHead = 0, trailN = 0;
// tras stepFlying(): la velocidad sale del avance del tick, así que vale igual
// para radiales, sinusoides y la espiral de la especial
function emitTrail(dt){
  const rad = CELL_PS*.45;
  for (const b of flying){
    const vx = (b.x - b.px)/dt, vy = (b.y - b.py)/dt;
    const n = b.hard ? BUB_TRAIL_HARD : BUB_TRAIL_N;
    for (let i=0;i<n;i++){
      const kv = .05 + prand()*.1, j = trailHead;
      trX[j] = b.x + (prand()-.5)*rad; trY[j] = b.y + (prand()-.5)*rad;
      trVx[j] = -vx*kv + (prand()-.5)*.05; trVy[j] = -vy*kv + (prand()-.5)*.05;
      trR[j] = b.hard ? .006 + prand()*.012 : .004 + prand()*.008;
      trLife[j] = .45 + prand()*.45; trAge[j] = 0;
      trailHead = (j + 1) % BUB_TRAIL_MAX;
      if (trailN < BUB_TRAIL_MAX) trailN++;
    }
  }
}
function stepTrail(dt){
  for (let n=0, j=(trailHead - trailN + BUB_TRAIL_MAX) % BUB_TRAIL_MAX; n<trailN; n++, j=(j+1) % BUB_TRAIL_MAX){
    if (trAge[j] >= trLife[j]) continue;
    trAge[j] += dt; trX[j] += trVx[j]*dt; trY[j] += trVy[j]*dt; trVx[j] *= .96; trVy[j] *= .96;
  }
}
// de la más antigua a la más nueva, como antes
function drawTrail(){
  for (let n=0, j=(trailHead - trailN + BUB_TRAIL_MAX) % BUB_TRAIL_MAX; n<trailN; n++, j=(j+1) % BUB_TRAIL_MAX){
    if (trAge[j] >= trLife[j]) continue;
    const k = 1 - trAge[j]/trLife[j];
    const r = Math.max(.6, trR[j]*PS*(.6 + .8*(1-k)));
    if (r > 2) drawBub(F_TRH, ox + trX[j]*PS, oy + trY[j]*PS, r, .8*k);
    else       drawBub(F_TR,  ox + trX[j]*PS, oy + trY[j]*PS, r, .75*k);
  }
  cx.globalAlpha = 1;
}

// ─── dibujo ────────────────────────────────────────────────────────────────

// Anillo de carga. Por fuera no cabía a lo ancho: R*1.25 = PS*0.575 contra un
// medio ancho de PS*0.5 en portrait, con el anclaje de las 9 fuera de pantalla.
// Va por dentro de la frontera, a unos píxeles, de forma que el aro entero es
// visible en cualquier viewport. Contrapartida asumida: con el montón crecido las
// fichas exteriores lo tapan — se dibuja debajo de ellas. La punta, los orbes y
// las chispas van encima (drawRingTop()), así que la punta puede verse sobre
// fichas que tapan el resto del rayo.
// Se pinta como un rayo lima fino, el color de la bola especial que suelta: un
// halo, una hebra principal quebrada con alma blanca, una hebra fina con una
// onda que fluye y arcos que salen de la principal y vuelven a ella. Sin pista:
// lo no cargado no tiene trazo.
// Todo en source-over: con "lighter" el verde sumaba el fondo y se lavaba a
// blanco, distinto en cada gama. Ni clip, ni sombras, ni filtros; estilos en
// cadenas fijas y la intensidad en globalAlpha; los sprites se hornean en
// resize() y los puntos van en Float32Array. Por frame no se crea nada salvo
// los degradados de la punta (2) y uno por orbe en vuelo.
// Es solo dibujo: de la partida lee gaugeV, orbs y gaugeFlashT, y tiene su reloj
// `ringT` y su PRNG `rrand` —ni Math.random ni vrand—, así que no mueve ni la
// partida ni las burbujas. Igual a 60 que a 120 Hz: la forma cambia por reloj,
// no por frame, y lo continuo (avance del arco, onda, orbes, chispas) se evalúa
// con lo que draw() interpola entre ticks (`gaugeVd`, `ringTd`, `ringAlpha`).
const RING_G = [176,255,34], RING_CORE = [250,255,228];
const RING_GS = "rgb(176,255,34)", RING_WS = "#fff";
const RING_W = 0.00325;               // grosor base del rayo, en PS
const HALO_H = 0.0325;                // semiancho del halo, en PS
const RING_REGEN = 18;                // formas nuevas por segundo, de media
const STRIKE_DECAY = 2.5, GULP_DECAY = 6;   // por segundo
const MAIN_STEP = 0.04, MAIN_MAX = 240;     // hebra principal: PS de arco por punto, tope
const FINE_STEP = 0.0175;                   // hebra fina: PS de arco por punto
const FINE_MAX = Math.ceil(TAU*GAUGE_RAD/FINE_STEP) + 1;
const ARC_MAX = 6, ARC_PTS = 9;
const SPARK_MAX = 64, SPARK_SPEED = 0.425, SPARK_CLOSE = 0.55;   // PS/s
const ORB_N = 10, TIP_N = 12;         // muestras de la estela y del abultamiento
const ORB_WHITE = 0.10;               // s en que la bola que carga se funde a blanco
const ORB_LIGHT = 0.5;                // fracción del camino en que ya es solo luz
const rrand = mulberry32(0xb017);

// Las formas son desvíos radiales d, en PS, sobre puntos repartidos en u ∈ [0,1]
// del arco cargado: al crecer el arco se estiran, y solo se rehacen al vencer su
// temporizador. `strike` sube con cada orbe que llega y engorda el rayo; `gulp`
// es el trago de la punta, función de `ringGulpT`. `ringT` no vuelve a 0 con
// reset(), como los relojes del fondo.
let ringT = 0, ringNext = 0, ringStrike = 0, ringGulpT = -1e9;
let ringAlpha = 1, ringTd = 0, gaugeVd = 0;
let mainN = 0, fineN = 0, arcN = 0;
const mainD = new Float32Array(MAIN_MAX), fineD = new Float32Array(FINE_MAX);
const arcU = new Float32Array(ARC_MAX*ARC_PTS), arcD = new Float32Array(ARC_MAX*ARC_PTS);
const orbX = new Float32Array(ORB_N), orbY = new Float32Array(ORB_N);
const tipX = new Float32Array(TIP_N), tipY = new Float32Array(TIP_N);
// chispas: pool fijo, en mundo
let spkI = 0;
const spkX = new Float32Array(SPARK_MAX), spkY = new Float32Array(SPARK_MAX);
const spkVX = new Float32Array(SPARK_MAX), spkVY = new Float32Array(SPARK_MAX);
const spkT0 = new Float64Array(SPARK_MAX), spkLife = new Float32Array(SPARK_MAX);   // t0: ringT no tiene tope
function ringClear(){ spkLife.fill(0); ringGulpT = -1e9; }

// un tick del rayo, junto al del fondo: con `paused` no corre y el rayo se congela
function stepRing(dt){
  ringT += dt;
  ringStrike = Math.max(0, ringStrike - dt*STRIKE_DECAY);
  const p = gaugeOn() ? gaugeV/GAUGE_MAX : 0;
  if (p <= .002) mainN = 0;                       // al reaparecer, forma nueva
  else if (!mainN || ringT >= ringNext) ringShape(Math.min(1, p));
}
// rehace las tres piezas a la vez —hebra principal, hebra fina y arcos— para un
// arco cargado de p vueltas
function ringShape(p){
  ringNext = ringT + (.7 + .6*rrand())/RING_REGEN;
  const L = p*TAU*GAUGE_RAD, st = ringStrike, amp = .0045 + .005*st;
  mainN = Math.max(2, Math.min(MAIN_MAX, Math.round(L/MAIN_STEP) + 1));
  for (let j=0;j<mainN;j++) mainD[j] = j && j < mainN-1 ? (2*rrand() - 1)*amp : 0;
  fineN = Math.max(2, Math.min(FINE_MAX, Math.round(L/FINE_STEP) + 1));
  for (let j=0;j<fineN;j++) fineD[j] = j && j < fineN-1 ? .45*amp*(2*rrand() - 1) : 0;
  // cada arco sale de la hebra principal y vuelve a ella: ninguno queda suelto
  arcN = Math.min(ARC_MAX, Math.round(.5*(1 + 1.5*st)*Math.min(6, L/.175)));
  for (let a=0;a<arcN;a++){
    const su = Math.min(1, (.045 + .075*rrand())/L), u0 = rrand()*(1 - su);
    const h = (rrand() < .6 ? 1 : -1)*(.010 + .0125*rrand())*(1 + .5*st);
    for (let q=0;q<ARC_PTS;q++){
      const v = q/(ARC_PTS-1), u = u0 + su*v, n = a*ARC_PTS + q;
      arcU[n] = u;
      arcD[n] = mainAt(u) + h*Math.sin(Math.PI*v) + (q && q < ARC_PTS-1 ? (2*rrand() - 1)*.0035 : 0);
    }
  }
}
// desvío de la hebra principal en u, interpolado entre sus puntos
function mainAt(u){
  const f = Math.max(0, Math.min(1, u))*(mainN - 1), j = Math.min(mainN - 2, Math.floor(f));
  return mainD[j] + (mainD[j+1] - mainD[j])*(f - j);
}

// Lo que dispara la partida: la llegada de los orbes hace tragar a la punta, y
// el cierre la rodea entera. Nada en px: resize() no migra nada.
function ringGulp(){
  ringGulpT = ringT; ringStrike = Math.min(1, ringStrike + .25);
  const [x,y] = gaugeTip(gaugeV);
  ringSparks(6, x, y, SPARK_SPEED);
}
function ringClose(){ const [x,y] = gaugeTip(gaugeV); ringSparks(18, x, y, SPARK_CLOSE); }
function ringSparks(n, x, y, sp){
  for (let k=0;k<n;k++){
    const i = spkI; spkI = (spkI + 1) % SPARK_MAX;
    const a = rrand()*TAU, v = sp*(.4 + .6*rrand());
    spkX[i] = x; spkY[i] = y; spkVX[i] = Math.cos(a)*v; spkVY[i] = Math.sin(a)*v;
    spkT0[i] = ringT; spkLife[i] = .25 + .2*rrand();
  }
}

// Cachés que dependen de PS, ox, oy y DPR. El halo es un degradado radial
// centrado en la esfera, con perfil 1 − smoothstep a cada lado del tubo; sus
// remates, medios discos del mismo perfil, funden los extremos del sector en vez
// de cortarlos. La luz blanca es la de orbes, chispas y destellos: no es un
// disco, cae enseguida y deja una cola larga.
let haloGrad, capSpr, anchorSpr, lightSpr;
function bakeRing(){
  const h = PS*HALO_H;
  haloGrad = cx.createRadialGradient(ox, oy, gaugeRad - h, ox, oy, gaugeRad + h);
  for (let i=0;i<=8;i++){
    const x = i/8, c = ballRgb(RING_G, 1 - x*x*(3 - 2*x));
    haloGrad.addColorStop(.5 - x/2, c); haloGrad.addColorStop(.5 + x/2, c);
  }
  // remate: el lado plano en x = 0, el redondo hacia +x
  const hd = Math.max(1, Math.ceil(h*DPR)), o = bgCanvas(hd, 2*hd), x = o.getContext("2d");
  const im = x.createImageData(hd, 2*hd), d = im.data;
  for (let j=0;j<2*hd;j++) for (let i=0;i<hd;i++){
    const r = Math.min(1, Math.hypot(i + .5, j + .5 - hd)/(h*DPR)), n = 4*(j*hd + i);
    d[n] = RING_G[0]; d[n+1] = RING_G[1]; d[n+2] = RING_G[2]; d[n+3] = Math.round(255*(1 - r*r*(3 - 2*r)));
  }
  x.putImageData(im, 0, 0); capSpr = o;
  anchorSpr = ringLight(2*.9*CELL*.45, RING_G, [[0,1], [.3,.6], [.65,.18], [1,0]]);
  lightSpr  = ringLight(3.6*CELL*.45, [255,255,255], [[0,1], [.14,1], [.3,.45], [.6,.12], [1,0]]);
}
function ringLight(d, c, stops){
  const [o, x] = ballCanvas(d);
  ballDisc(x, 0, 0, d/2, ballGrad(x, 0, 0, 0, 0, 0, d/2, stops.map(([s,a]) => [s, ballRgb(c, a)])));
  return o;
}

// trazado de una forma [u,d] sobre el arco cargado de La rad
function ringPt(u, d, La, move){
  const a = GAUGE_A0 + u*La, r = gaugeRad + d*PS, x = ox + Math.cos(a)*r, y = oy + Math.sin(a)*r;
  if (move) cx.moveTo(x, y); else cx.lineTo(x, y);
}
function ringLine(D, n, La){ cx.beginPath(); for (let j=0;j<n;j++) ringPt(j/(n-1), D[j], La, !j); }
// remate del halo en el ángulo a del aro, mirando hacia `dir`
function ringEnd(a, dir){
  const h = capSpr.width/DPR;
  cx.save();
  cx.translate(ox + Math.cos(a)*gaugeRad, oy + Math.sin(a)*gaugeRad); cx.rotate(dir);
  cx.drawImage(capSpr, 0, -h, h, 2*h);
  cx.restore();
}

// No pulsa: es progreso, no alarma. El brillo sube solo con lo que llega.
function drawGauge(){
  if (!gaugeOn()) return;   // sin carga disponible el anillo no existe
  const p = Math.max(0, Math.min(1, gaugeVd/GAUGE_MAX));
  if (p <= .002 || !mainN) return;
  // horario desde las 9: pasa por arriba y cierra en el punto de partida
  const La = p*TAU, a1 = GAUGE_A0 + La, K = 1 + .5*ringStrike, w = PS*RING_W, h = PS*HALO_H;
  cx.save();
  cx.lineCap = cx.lineJoin = "round";
  // halo: el sector cargado y un remate en cada extremo
  cx.globalAlpha = Math.min(1, .4*K);
  cx.fillStyle = haloGrad;
  cx.beginPath(); cx.arc(ox, oy, gaugeRad + h, GAUGE_A0, a1); cx.arc(ox, oy, gaugeRad - h, a1, GAUGE_A0, true); cx.fill();
  ringEnd(a1, a1 + Math.PI/2); ringEnd(GAUGE_A0, GAUGE_A0 - Math.PI/2);
  // hebra principal: cuerpo verde y alma blanca
  cx.globalAlpha = 1;
  ringLine(mainD, mainN, La);
  cx.strokeStyle = RING_GS; cx.lineWidth = 2*w; cx.stroke();
  cx.strokeStyle = RING_WS; cx.lineWidth = .6*w; cx.stroke();
  // hebra fina y arcos, en una sola ruta. La onda va en PS de arco: fluye con
  // el reloj y no se estira al crecer la carga
  const kw = TAU*La*GAUGE_RAD/.065, tw = 7*ringTd;
  cx.beginPath();
  for (let j=0;j<fineN;j++){
    const u = j/(fineN - 1);
    ringPt(u, fineD[j] + .0065*Math.sin(Math.PI*u)*Math.sin(kw*u - tw), La, !j);
  }
  for (let n=0;n<arcN*ARC_PTS;n++) ringPt(arcU[n], arcD[n], La, !(n % ARC_PTS));
  cx.globalAlpha = Math.min(1, .9*K); cx.strokeStyle = RING_GS; cx.lineWidth = 1.2*w; cx.stroke();
  cx.globalAlpha = .75;               cx.strokeStyle = RING_WS; cx.lineWidth = .4*w;  cx.stroke();
  // ancla: con el contador vacío no se pinta nada
  cx.globalAlpha = .9; sprite(anchorSpr, ox - gaugeRad, oy, 1);
  cx.restore();
}

// La capa de encima de las bolas, antes de los flotantes: orbes, cierre, punta
// y chispas. Todo en blanco salvo el cierre.
function drawRingTop(){
  if (!gaugeOn()) return;
  const rt = ringTd, rad = CELL*.45, p = Math.max(0, Math.min(1, gaugeVd/GAUGE_MAX));
  const a1 = GAUGE_A0 + p*TAU, tx = ox + Math.cos(a1)*gaugeRad, ty = oy + Math.sin(a1)*gaugeRad;
  cx.save();
  // cierre: la circunferencia entera con el perfil del halo y un filo blanco
  if (gaugeFlashT > 0){
    cx.globalAlpha = .9*gaugeFlashT/GAUGE_FLASH;
    cx.beginPath(); cx.arc(ox, oy, gaugeRad, 0, TAU);
    cx.strokeStyle = haloGrad; cx.lineWidth = 2*PS*HALO_H; cx.stroke();
    cx.strokeStyle = RING_WS;  cx.lineWidth = .005*PS;     cx.stroke();
  }
  for (const o of orbs)
    drawCharge(ox + o.x*PS, oy + o.y*PS, tx, ty, a1, FLASH_TIME + lerp(o.a0, o.age, ringAlpha), rad);
  if (p > .002 && mainN) drawTip(p, rt);
  for (let i=0;i<SPARK_MAX;i++){
    if (!spkLife[i]) continue;
    const e = Math.max(0, rt - spkT0[i]), u = e/spkLife[i], k = e*(1 - .5*u);
    if (u >= 1) continue;
    cx.globalAlpha = 1 - u;
    sprite(lightSpr, ox + (spkX[i] + spkVX[i]*k)*PS, oy + (spkY[i] + spkVY[i]*k)*PS, .04*PS*(1 - u)/lightSpr.d);
  }
  cx.restore();
}

// Una bola que carga, del destello a la punta, en el instante `tau`: s desde que
// empieza a destellar, con un solo reloj para el pop (ver popFx()) y el orbe.
// Hasta FLASH_TIME está quieta en su sitio; luego vuela en ORB_TRIP de (x0, y0) a
// la punta (tx, ty), que avanza: la curva se recalcula en cada frame. Tres
// fases del mismo reloj:
//  - w: se funde a blanco en ORB_WHITE, con un disco que tapa la bola entera,
//    borde incluido;
//  - e: el camino, con salida rápida y frenada al llegar (1 − (1 − u)²). Una
//    cuadrática que entra en la punta siguiendo el anillo;
//  - q: de bola blanca a luz, hecha a ORB_LIGHT del camino. El disco encoge
//    opaco y al final se funde en la luz, que entra con su estela de cometa.
function drawCharge(x0, y0, tx, ty, a1, tau, rad){
  const w = bgSst(0, ORB_WHITE, tau), u = Math.max(0, Math.min(1, (tau - FLASH_TIME)/ORB_TRIP));
  const dist = Math.hypot(tx - x0, ty - y0);
  const x1 = tx + Math.sin(a1)*.5*dist, y1 = ty - Math.cos(a1)*.5*dist;
  for (let j=0;j<ORB_N;j++){
    const v = Math.max(0, u - j*.04), e = 1 - (1 - v)*(1 - v), m = 1 - e;
    orbX[j] = m*m*x0 + 2*m*e*x1 + e*e*tx;
    orbY[j] = m*m*y0 + 2*m*e*y1 + e*e*ty;
  }
  const q = bgSst(0, ORB_LIGHT, 1 - (1 - u)*(1 - u)), od = 3*rad*(1.2 - .55*u);
  if (q < 1){
    cx.globalAlpha = w*(1 - bgSst(.75, 1, q)); cx.fillStyle = RING_WS;
    cx.beginPath(); cx.arc(orbX[0], orbY[0], (rad*BALL_R0K + .5)*(1 - .8*q), 0, TAU); cx.fill();
  }
  if (u > 0){
    const g = cx.createLinearGradient(orbX[0], orbY[0], orbX[ORB_N-1], orbY[ORB_N-1]);
    g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(1, "rgba(255,255,255,0)");
    cx.fillStyle = g;
    orbTrail(.16*od);  cx.globalAlpha = .35*q; cx.fill();
    orbTrail(.055*od); cx.globalAlpha = .95*q; cx.fill();
    cx.globalAlpha = q; sprite(lightSpr, orbX[0], orbY[0], od/lightSpr.d);
  }
  cx.globalAlpha = 1;
}
// relleno que se afila hasta cero en la cola: un lado de ida y el otro de vuelta
function orbTrail(hw){
  cx.beginPath();
  for (let j=0;j<ORB_N;j++) trailSide(orbX, orbY, ORB_N, j, hw*Math.pow(1 - j/(ORB_N-1), .9), !j);
  for (let j=ORB_N-1;j>=0;j--) trailSide(orbX, orbY, ORB_N, j, -hw*Math.pow(1 - j/(ORB_N-1), .9), false);
}
// punto j de una polilínea desplazado `off` px por su normal
function trailSide(X, Y, n, j, off, move){
  const a = Math.max(0, j-1), b = Math.min(n-1, j+1), fx = X[b] - X[a], fy = Y[b] - Y[a];
  const l = Math.hypot(fx, fy), k = l > 1e-3 ? off/l : 0, x = X[j] - fy*k, y = Y[j] + fx*k;
  if (move) cx.moveTo(x, y); else cx.lineTo(x, y);
}

// Punta: la hebra principal se abulta en su último tramo —no es una pieza
// aparte—, de verde a blanco, con un halo redondo que no parpadea. Al tragar un
// orbe crece (`gulp`) y suelta un destello.
function drawTip(p, rt){
  const La = p*TAU, Lps = La*GAUGE_RAD, w = PS*RING_W, n = TIP_N - 1;
  const gulp = Math.max(0, Math.min(1, 1 - GULP_DECAY*(rt - ringGulpT)));
  const k = 1 + .35*gulp + .15*ringStrike, us = 1 - Math.min(.095, .6*Lps)/Lps;
  for (let j=0;j<=n;j++){
    const u = us + (1 - us)*j/n, a = GAUGE_A0 + u*La, r = gaugeRad + mainAt(u)*PS;
    tipX[j] = ox + Math.cos(a)*r; tipY[j] = oy + Math.sin(a)*r;
  }
  const x = tipX[n], y = tipY[n], hr = .05*PS*k, w1 = 3.1*w*k;
  let g = cx.createRadialGradient(x, y, 0, x, y, hr);
  g.addColorStop(0, "rgba(255,255,255,1)");  g.addColorStop(.3, "rgba(255,255,255,.85)");
  g.addColorStop(.6, "rgba(255,255,255,.3)"); g.addColorStop(1, "rgba(255,255,255,0)");
  cx.globalAlpha = 1; cx.fillStyle = g;
  cx.beginPath(); cx.arc(x, y, hr, 0, TAU); cx.fill();
  // semiancho de 1w a 3,1w·k con perfil t², y remate redondo delante
  g = cx.createLinearGradient(tipX[0], tipY[0], x, y);
  g.addColorStop(0, RING_GS); g.addColorStop(.5, RING_WS); g.addColorStop(1, RING_WS);
  cx.fillStyle = g;
  cx.beginPath();
  for (let j=0;j<=n;j++){ const t = j/n; trailSide(tipX, tipY, TIP_N, j, w + (w1 - w)*t*t, !j); }
  const f = Math.atan2(y - tipY[n-1], x - tipX[n-1]);
  cx.arc(x, y, w1, f + Math.PI/2, f - Math.PI/2, true);
  for (let j=n;j>=0;j--){ const t = j/n; trailSide(tipX, tipY, TIP_N, j, -(w + (w1 - w)*t*t), false); }
  cx.fill();
  if (gulp > 0){ cx.globalAlpha = gulp; sprite(lightSpr, x, y, .065*PS*(1 + gulp)/lightSpr.d); }
}

// `alpha` es la fracción de tick transcurrida desde el último: se dibuja entre el
// estado del tick anterior y el actual (ver captureDrawPrev()). El ángulo, las
// fichas en vuelo y la cabeza de sus estelas se interpolan; lo demás avanza en
// pasos de 60 Hz. No modifica nada de la partida.
function draw(alpha){
  angleDraw = lerp(angleD0, angle, alpha);
  const tv = t - (1 - alpha)*SIM_DT;   // reloj del dibujo, entre los dos ticks
  ringAlpha = alpha; ringTd = ringT - (1 - alpha)*SIM_DT; gaugeVd = lerp(gaugeV0, gaugeV, alpha);
  // la matriz px CSS → buffer se repone en cada frame, no solo en resize(): el
  // navegador puede tirar el contexto de una pestaña que lleva rato en segundo
  // plano y devolverlo con el estado a cero, sin resize. Con la matriz identidad
  // todo salía a escala 1/DPR, encogido en la esquina superior izquierda, hasta
  // el siguiente resize. Es asignar seis números: no cuesta nada.
  cx.setTransform(DPR,0,0,DPR,0,0);
  drawBg();
  // la sacudida de la bomba mueve todo menos el fondo (ver shakeOffset())
  const sh = shakeOffset(alpha);
  if (sh) cx.setTransform(DPR,0,0,DPR,sh[0]*DPR,sh[1]*DPR);

  // la frontera no se traza: el borde del cuenco del fondo ya dibuja el límite, y
  // el peligro lo cuenta la alarma del fondo (ver stepBg()). Hubo además un aro
  // rojo que latía con el borde ocupado; sobraba y se quitó.
  drawGauge();

  // aviso de la próxima ficha: arco de 35° fuera del círculo, en su color (ver
  // bakeTele()). En la fase A del tutorial no hay cuenta: nada que anunciar todavía
  // El latido va solo en el resplandor; el núcleo, tras asomar, es opaco.
  const beat = 0.75+0.25*Math.sin(t*11);
  if (!dead && teleOut){
    const f = 1 - Math.max(0, tv - teleOut.at - TELE_HOLD)/TELE_FADE;
    if (f > 0) drawTele(teleOut.k, teleOut.aArc, f*(0.35 + 0.65*beat), Math.min(1, f));
  }
  if (!dead && nextSpawn && spawnT < TELEGRAPH && ctrlPhase !== "A"){
    const p = 1 - Math.max(0,spawnT)/TELEGRAPH;        // 0 → 1 al acercarse
    drawTele(nextSpawn.k, nextSpawn.aArc, 0.35 + 0.65*p*beat, Math.min(1, p/TELE_CORE_IN));
  }

  const rad = CELL*0.45;
  // Lo que vuela se interpola entre el tick anterior y el actual; la muestra se
  // toma una vez y la usan la sombra y la bola.
  const fly = flying.map(b => toScreen(
    b.dx0 === undefined ? b.x : lerp(b.dx0, b.x, alpha),
    b.dy0 === undefined ? b.y : lerp(b.dy0, b.y, alpha)));
  // Sombras en un pase previo, todas debajo de todas las bolas: pintadas con
  // cada bola oscurecían a sus vecinas. La del pop crece con ella.
  cx.globalAlpha = SHADOW_A;
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    const b = grid[idx(c,r)]; if (!b || b.k<0) continue;   // el bulto del fondo ya lleva la suya
    const [x,y] = cellToScreen(b.vc===undefined?c:b.vc, b.vr===undefined?r:b.vr);
    drawShadow(x, y, flashT>0 && flashSet.has(idx(c,r)) ? popShadowR(rad) : rad, 0);
  }
  if (deadBall){ const [x,y] = cellToScreen(deadBall.vc, deadBall.vr); drawShadow(x, y, rad, 0); }
  if (outBall){
    const [x,y] = cellToScreen(outBall.vc, outBall.vr);
    drawShadow(x, y, flashT>0 && flashSet.has(OUT) ? popShadowR(rad) : rad, 0);
  }
  const born = flying.map(b => bornScale(b, tv));
  flying.forEach((b, i) => drawShadow(fly[i][0], fly[i][1], (b.bonus ? rad*1.05 : rad)*born[i], LIFT_FLY));
  cx.globalAlpha = 1;

  drawTrail();

  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    const b = grid[idx(c,r)]; if (!b || b.k<0) continue;   // la roca central es el bulto del fondo
    const vc = b.vc===undefined?c:b.vc, vr = b.vr===undefined?r:b.vr;
    const [x,y] = cellToScreen(vc,vr);
    if (flashT>0 && flashSet.has(idx(c,r))){ popFx(b.k, x, y, rad); continue; }
    drawBall(b.k, x, y, rad);
    // Aviso: la bola se va volviendo piedra. Entra con una grieta y se agrisa al
    // acercarse la petrificación; tras un match de 2 se ve desandar (`rew`). El
    // nivel 1 lo esconde aunque la edad ya corra: nada se muestra antes de su
    // nivel, y el aviso es justo lo que el tip del nivel 2 nombra.
    const va = Math.max(b.age, b.rew || 0);
    if (level >= 2 && b.k!==WHITE && b.k!==STONE && va > STONE_WARN) drawStoneWarn(va, x, y, rad);
  }

  // la causante del game over, en coordenadas de grid como las del montón:
  // gira con el tablero y no se mueve más, porque con `dead` nada avanza.
  if (deadBall){
    const [x,y] = cellToScreen(deadBall.vc, deadBall.vr);
    drawBall(deadBall.k, x, y, rad);
  }
  // la que espera fuera del campo, igual: en su celda de snap, girando con el tablero
  if (outBall){
    const [x,y] = cellToScreen(outBall.vc, outBall.vr);
    if (flashT>0 && flashSet.has(OUT)) popFx(outBall.k, x, y, rad);
    else drawBall(outBall.k, x, y, rad);
  }

  // el vuelo vive en el mundo; aquí, y solo aquí, pasa a pantalla. El hard drop
  // no tiene dibujo propio: lo distingue su estela de burbujas.
  flying.forEach((b, i) => {
    const [x,y] = fly[i], g = born[i], rad = CELL*.45*g;
    if (!b.bonus){ drawBall(b.k, x, y, rad); return; }
    // la especial no late de tamaño: late su halo, debajo, y un núcleo encima
    const G = RING_G, C0 = RING_CORE;
    cx.save(); cx.globalCompositeOperation = "lighter";
    ballDisc(cx, x, y, rad*2, ballGrad(cx, x, y, 0, x, y, rad*2, [[0, ballRgb(G, .28 + .14*Math.sin(t*6))], [1, ballRgb(G, 0)]]));
    cx.restore();
    sprite(ballSpr.bonus, x, y, 1.05*g);
    cx.save(); cx.globalCompositeOperation = "lighter";
    ballDisc(cx, x, y, rad*.55, ballGrad(cx, x, y, 0, x, y, rad*.55, [[0, ballRgb(C0, .22 + .22*Math.sin(t*9))], [1, ballRgb(C0, 0)]]));
    cx.restore();
  });
  drawRingTop();
  drawFloaters();
}
// Pop: fundido rápido a blanco y ligero crecimiento antes de desaparecer. Pinta
// el halo, la bola al radio del pop y encima el blanco que la funde.
// El match que carga el anillo no estalla: se enciende y se va con su orbe. Su
// dibujo es el del orbe en su primer tramo (ver drawCharge()); aquí solo queda
// la bola debajo hasta que el blanco la tapa, y la sombra, que se va con ella.
function popE(){ const p = 1 - flashT/FLASH_TIME; return p*p*(3-2*p); }   // 0 → 1, suavizado
function popCharges(){ return !flashBonus && gaugeOn(); }
function popR(rad){ return rad*(1 + 0.30*popE()); }
function popShadowR(rad){ return popCharges() ? rad*(1 - bgSst(0, ORB_WHITE, FLASH_TIME - flashT)) : popR(rad); }
function popFx(k, x, y, rad){
  const e = popE();
  cx.save();
  cx.globalAlpha = 0.55*(1-e);
  cx.beginPath(); cx.arc(x,y,rad*(1.2+1.1*e),0,7);
  cx.fillStyle = "#ffffff"; cx.fill();
  cx.restore();
  if (popCharges()){
    const tau = Math.max(0, FLASH_TIME - flashT - (1 - ringAlpha)*SIM_DT);   // interpolado, como el orbe
    if (tau < ORB_WHITE) drawBall(k, x, y, rad);
    drawCharge(x, y, x, y, 0, tau, rad);
    return;
  }
  const rr = popR(rad);
  drawBall(k, x, y, rr);
  cx.globalAlpha = Math.min(1, e*1.35);
  cx.beginPath(); cx.arc(x, y, rr*.9, 0, TAU); cx.fillStyle = "#ffffff"; cx.fill();
  cx.globalAlpha = 1;
}

// ─── loop ──────────────────────────────────────────────────────────────────
// Paso fijo: la partida avanza en ticks de SIM_DT, sea cual sea el ritmo al que
// dibuje la pantalla, así que la misma semilla y el mismo input dan la misma
// partida a 30, 60 o 144 fps. Con `dt` variable no lo era: los seguimientos
// `min(1, k·dt)` y los umbrales que se cruzan en el frame que toque dependían del
// ritmo. 1/60 es el `dt` con el que se calibró todo el juego.
const SIM_DT = 1/60;
// Tope de tiempo por frame: 6 ticks. Hasta 10 fps el juego va a su velocidad;
// por debajo se ralentiza en vez de dar saltos de medio segundo.
const MAX_ELAPSED = 0.1;
// A 60 Hz requestAnimationFrame no llega cada 16,67 ms exactos: sin redondear, las
// pequeñas variaciones alternan frames de 0 y 2 ticks. Lo que cae a menos de
// VSYNC_SNAP de un múltiplo del tick se toma como ese múltiplo.
const VSYNC_SNAP = 0.001;
// tolerancia del acumulador: que la coma flotante no se coma un tick que vale
// casi exactamente SIM_DT, por ejemplo a 30 fps
const ACC_EPS = 1e-6;
let simTick = 0;                           // ticks de la partida: solo para las pruebas

// Toda la lógica de un tick. Lo visual que avanza con la partida —anillo,
// flotantes, asentamiento del grid— también va aquí: es determinista igual.
function updateGame(dt){
  simTick++;
  // el giro que marcaron los listeners desde el tick anterior
  const turned = ctrlTurn; ctrlTurn = false;
  if (!dead){
    if (turned && ctrlPhase === "A") setCtrlPhase("B");
    // en la fase A la partida todavía no ha empezado (ver ctrlText()): el reloj y
    // la cuenta de fichas esperan al primer giro; el giro sí corre
    const idle = ctrlPhase === "A";
    if (!idle) t += dt;
    // Progresión retenida: mientras dura el tutorial de controles `t` se satura
    // en el `at` del nivel 2 y el nivel 2 no abre. Abre en el tick siguiente al
    // consumo, y desde ahí todo corre con los intervalos de siempre, desplazado.
    // La dificultad queda congelada en la de ese instante: el tutorial no
    // endurece la partida.
    if (ctrlPhase && t > LEVELS[1].at) t = LEVELS[1].at;
    // progresión: `t` manda y `level` se deriva. El último nivel es terminal.
    // `while` y no `if`: arrancar en un nivel adelantado (?nivel=N) encadena
    // aquí todos los intermedios en orden, ejecutando cada on() —blancas activas,
    // morado en la bolsa— y dejando a la vista el tip del nivel destino.
    while (!ctrlPhase && level < LEVELS.length && t >= LEVELS[level].at){
      const entering = LEVELS[level];    // 0-indexado: la entrada del nivel que abre
      level++;
      showLevel();                       // fija tipT, o lo deja a 0 si el tip ya está visto
      if (entering.on) entering.on();    // mecánica del nivel: corre siempre
      // la puesta en escena acompaña al texto: sin tip que leer no pinta nada
      if (entering.intro && tipT > 0) entering.intro();
    }
    if (tipT > 0){
      tipT -= dt;
      // el fade-out ocurre DESPUÉS de agotar la ventana de lectura, no dentro
      if (tipT <= 0){
        tipEl.classList.remove("on");
        // Único punto de consumo del tutorial: la ventana se ha agotado entera y
        // dentro de la partida. Morir con el tip a la vista no cuenta —con `dead`
        // esto no corre— y no hay forma de sumar dos veces el mismo nivel. En el
        // nivel 1 solo la fase C tiene ventana, y agotarla cierra el guion.
        tutConsume(LEVELS[level-1].id);
        ctrlPhase = null;
      }
    }
    // teclado: DAS, rampa continua y decaimiento de la rampa al soltar
    if (keyMode === "pending"){
      keyHoldT += dt;
      if (keyHoldT >= KEY_DAS) keyMode = "continuous";
    } else if (keyMode === "idle"){
      keyIdleT += dt;
      // se retiene un instante: soltar y repulsar en mitad de un barrido no frena
      if (keyIdleT > KEY_RAMP_RETAIN)
        keyRamp = Math.max(0, keyRamp - dt/KEY_RAMP_DECAY);
    }
    if (keyMode === "continuous" && keyDir){
      keyRamp = Math.min(1, keyRamp + dt/KEY_RAMP_TIME);
      // cuadrática: arranque contenido para el control, apertura para los barridos
      const w = KEY_W_MIN + (KEY_W_MAX-KEY_W_MIN)*keyRamp*keyRamp;
      angleT += keyDir * w*DEG * dt;
    }
    // gira solo si el dedo está apoyado; con tecla pulsada manda el teclado
    if (!keyDir && ptrDown && dir){
      rotT -= dt;
      if (rotT <= 0){ rotate(dir); rotT = holdRate(); }
    } else rotT = 0;
    // el ángulo del tick anterior; rayCast() lo necesita para leer dónde estaba
    // cada bola EN EL TABLERO, no en la pantalla.
    anglePrev = angle;
    angle += (angleT-angle)*Math.min(1,ROT_TWEEN*dt);

    if (!idle) spawnT -= dt;
    if (spawnT<=0){
      if (nextSpawn.sine) spawnSine(nextSpawn); else spawnNormal(nextSpawn);
      teleOut = { aArc:nextSpawn.aArc, k:nextSpawn.k, at:t };
      nextSpawn = pickNext();
      spawnT = SPAWN_MIN + (SPAWN_START-SPAWN_MIN)*Math.exp(-t/SPAWN_RAMP*1.6);
    }
    // ciclo propio de las blancas, ajeno al de las fichas de color
    if (level >= 3){
      whiteT -= dt;
      if (whiteT <= 0){ spawnWhite(); whiteT = whiteInterval(); }
    }

    // el anillo persigue a lo que han traído los orbes (ver launchOrbs()): llegan
    // a golpes, y un salto instantáneo es un parpadeo, no una recompensa.
    stepOrbs(dt);
    gaugeV += (gaugeL - gaugeV)*Math.min(1, GAUGE_TWEEN*dt);
    if (gaugeFlashT > 0) gaugeFlashT -= dt;
    // el bonus espera a que el último orbe haya cerrado el arco, no a que el
    // contador llegue al tope: disparar con el aro a medias rompe la relación que
    // busca. Los orbes que sigan en vuelo pasan a la época anterior.
    if (gaugeOn() && gauge >= GAUGE_MAX && gaugeL >= GAUGE_MAX && gaugeV >= GAUGE_MAX-3){
      gaugeFlashT = GAUGE_FLASH;
      spawnBonus();
      ringClose();
      gauge = gaugeL = 0;        // gaugeV baja sola: el anillo se vacía barriendo
      gaugeEpoch++;
    }

    stepFlying(dt);
    emitTrail(dt);
    ageBubbles(dt);
  }
  stepFlash(dt);
  if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);
  easeVisual(dt);
  stepFloaters(dt);
  stepBg(dt);
  stepRing(dt);
  stepTrail(dt);
}

// Estado del tick anterior, para que draw() interpole entre él y el actual. Sin
// interpolar, a 120 Hz se alternan frames de 1 y 0 ticks y el giro da tirones.
// No se reutilizan anglePrev ni b.px/b.py: esos solo avanzan con la partida viva,
// y tras morir el dibujo temblaría entre dos valores. Esto se copia en todos los
// ticks, viva o no. Una ficha nacida en el tick no tiene copia y se dibuja donde está.
let angleD0 = 0, gaugeV0 = 0;
function captureDrawPrev(){
  angleD0 = angle; gaugeV0 = gaugeV;
  for (const b of flying){ b.dx0 = b.x; b.dy0 = b.y; }
  for (const o of orbs) o.a0 = o.age;
}

// ─── medidor de fps (temporal, fase de optimización) ───
// Siempre a la vista, sin tecla ni opción: tiene que salir en el móvil tal cual.
// Fuera de STR a propósito: es herramienta de desarrollo, no texto del juego.
// Mide con el `now` de requestAnimationFrame, la marca del vsync, y no toca nada
// de la partida. La cifra grande son los fps medios del último FPS_BUCKET; avg,
// la media de las últimas FPS_WINDOW lecturas (5 s); min y max, el frame más
// lento y el más rápido de esa misma ventana, pasados a fps: el min es el que
// delata los tirones que la media se traga.
const FPS_BUCKET = 500, FPS_WINDOW = 10;   // ms por lectura; lecturas en la ventana
const fpsEl = document.getElementById("fps");
let fpsPrev = null, fpsN = 0, fpsSum = 0, fpsLong = 0, fpsShort = Infinity;
const fpsHist = [];                        // {n, sum, long, short} por lectura, la última al final
function fpsMeter(now){
  const d = fpsPrev === null ? 0 : now - fpsPrev; fpsPrev = now;
  if (d <= 0) return;
  fpsN++; fpsSum += d;
  if (d > fpsLong) fpsLong = d;
  if (d < fpsShort) fpsShort = d;
  if (fpsSum < FPS_BUCKET) return;
  fpsHist.push({ n: fpsN, sum: fpsSum, long: fpsLong, short: fpsShort });
  if (fpsHist.length > FPS_WINDOW) fpsHist.shift();
  let n = 0, sum = 0, long = 0, short = Infinity;
  for (const h of fpsHist){
    n += h.n; sum += h.sum;
    if (h.long > long) long = h.long;
    if (h.short < short) short = h.short;
  }
  fpsEl.textContent = Math.round(1000*fpsN/fpsSum) + " fps · avg " + Math.round(1000*n/sum)
                    + " · min " + Math.round(1000/long)
                    + " · max " + Math.round(1000/short);
  fpsN = 0; fpsSum = 0; fpsLong = 0; fpsShort = Infinity;
}

let last = performance.now(), acc = 0;
const scoreEl = document.getElementById("score"), overEl = document.getElementById("over");
let shownScore = 0;
function frame(now){
  fpsMeter(now);
  let e = paused ? 0 : Math.max(0, Math.min(MAX_ELAPSED, (now-last)/1000)); last = now;
  const k = Math.round(e/SIM_DT);          // nunca a 0: a más de 1000 fps se congelaría
  if (k >= 1 && Math.abs(e - k*SIM_DT) < VSYNC_SNAP) e = k*SIM_DT;
  acc += e;
  while (acc >= SIM_DT - ACC_EPS){ captureDrawPrev(); updateGame(SIM_DT); acc -= SIM_DT; }
  if (rebake){ rebake = false; bake(); }   // contexto devuelto por la GPU: ver resize()
  draw(Math.max(0, acc)/SIM_DT);

  // el marcador salta al sumar, teñido con el tono del último flotante
  if (score !== shownScore){
    if (score > shownScore){
      scoreEl.style.setProperty("--tint", lastTone || "");
      scoreEl.classList.remove("bump"); void scoreEl.offsetWidth; scoreEl.classList.add("bump");
    }
    shownScore = score;
    scoreEl.textContent = score;
  }
  // el récord se mueve durante la partida, en espejo con el marcador de arriba:
  // superarlo es un momento de juego, no un dato de menú.
  if (score > bestScore){ bestScore = score; save.best = bestScore; saveDirty = true; }
  bestEl.textContent = bestScore;
  if (dead){
    if (!bestSaved){ bestSaved = true; flushIfDirty(); syncTutAgain(); showScrim(overEl); }
    overEl.style.display="flex";
    setPts(document.getElementById("fin"));
    pzEl.style.visibility = "hidden";
  }
  requestAnimationFrame(frame);
}
// El tiempo pasado en otra pestaña no se simula: se descarta al volver. La marca
// del primer frame puede ser anterior a este instante, y ahí `e` se satura a 0.
document.addEventListener("visibilitychange", ()=>{
  // la ausencia tampoco cuenta como un frame de varios segundos en el medidor
  if (!document.hidden){ last = performance.now(); acc = 0; fpsPrev = null; }
});

resize(); reset(); requestAnimationFrame(frame);
// wideStage() mide las placas del HUD: con la fuente real puede cambiar el
// reparto. El canvas no espera: el primer +N llega después de cargarla.
document.fonts.load('800 1em "Whirlpop Baloo"').then(resize, ()=>{});
</script>
</body>
