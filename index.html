<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Whirlpop</title>
<meta name="description" content="Whirlpop — arcade game of pieces falling onto a spinning board.">
<meta name="theme-color" content="#06060c">
<!-- nombre con el que se guarda en la pantalla de inicio en iOS -->
<meta name="apple-mobile-web-app-title" content="Whirlpop">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- previsualización al compartir la URL. Las metas no pasan por la tabla de
     textos: buscadores y vistas previas no ejecutan JS, así que van en inglés,
     el idioma de respaldo. -->
<meta property="og:title" content="Whirlpop">
<meta property="og:description" content="Arcade game of pieces falling onto a spinning board.">
<meta property="og:type" content="website">
<!-- la única fuente, servida con el juego: cero peticiones a otros orígenes -->
<link rel="preload" href="fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Baloo 2 (SIL OFL 1.1, fonts/OFL.txt), subset latino con el eje wght 400–800.
     Familia con nombre propio para no casar con una Baloo instalada en el sistema. */
  @font-face { font-family:"Whirlpop Baloo"; src:url("fonts/baloo2-latin.woff2") format("woff2");
               font-weight:400 800; font-display:block; }
  /* La columna vertical de la que cuelga todo el layout. El JS la reescribe en
     cada resize; este valor es el fallback hasta que arranca. --u = 1% de la
     columna: toda medida de UI se expresa en múltiplos suyos, con suelo en px. */
  :root { --stage: min(100vw, 64.5vh);
          --u: calc(var(--stage) / 100);
          /* --u del HUD, con techo: el de la columna del móvil más ancho en vertical
             (430 px). Los marcadores son para leerse de reojo, no crecen con la
             pantalla: en tablet, a escala de la columna, tapaban el tablero y en
             landscape se comían la franja que la esfera podía usar. */
          --uh: min(var(--u), 4.3px);
          --ink:#231a4c;      /* contorno de todo: abajo de lavanda [62,44,133] × .56 */
          --pearl:#f4f6fc;    /* relleno de texto */
          --label:#c4bdea;    /* etiquetas del HUD: perla apagado hacia lavanda */
          /* PAUSA / FIN DE PARTIDA. Solo en el telón: dentro de la partida
             competiría con la alarma y con el ámbar */
          --title:#ff9f45;
          --lime-l:#eeffbe; --lime:#a0e812; --lime-m:#6fb406; --lime-d:#346400;  /* JEWEL_BONUS */ }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#06060c;
              overscroll-behavior:none;   /* sin "página anterior" al girar con trackpad */
              user-select:none; -webkit-user-select:none;
              font-family:"Whirlpop Baloo", system-ui, sans-serif; }
  #c { display:block; width:100%; height:100%; touch-action:none; }
  #c.nocur { cursor:none; }       /* ver "cursor" en el input */
  /* Todo el texto de la interfaz sale de esta regla: perla con un solo filo de
     tinta, sin capas ni text-shadow. Cada uso solo cambia font-size, --sw (el
     grosor del filo) y, si toca, color. Baloo tiene la caja vertical alta (1,6
     em): dentro de una pieza .wp el texto baja .06em (.08em los números grandes)
     para quedar centrado a la vista. */
  .ol { color:var(--pearl); -webkit-text-stroke:var(--sw,.16em) var(--ink); paint-order:stroke fill;
        font-weight:800; letter-spacing:.02em; line-height:1; }
  /* .wp: la única pieza de controles y placas —botones, chrome y HUD—. Píldora,
     filo de tinta, labio inferior y brillo superior. El brillo se mide sobre la
     altura --h, no sobre el ancho: la misma mancha de luz en un icono redondo y
     en un botón ancho. Color: --lime (la acción principal del telón) o --glass
     (todo lo demás). Forma: botón (por defecto), --icon (chrome) o --plate (HUD,
     no pulsable). Solo las pulsables llevan .tap, que al apretar baja el labio. */
  .wp { --h:max(50px, calc(var(--u)*14)); --lip:max(4px, calc(var(--u)*1.2)); --edge:2px;
        position:relative; height:var(--h); border-radius:999px; display:inline-flex;
        align-items:center; justify-content:center; user-select:none;
        min-width:max(200px, calc(var(--u)*56)); padding:0 calc(var(--u)*6);
        box-shadow:0 0 0 var(--edge) var(--ink), inset 0 calc(var(--lip)*-1) 0 var(--shade),
                   0 var(--lip) 0 0 var(--ink); }
  .wp::after { content:""; position:absolute; pointer-events:none; border-radius:999px;
               top:calc(var(--h)*.11); height:calc(var(--h)*.24);
               left:calc(var(--h)*.3); right:calc(var(--h)*.3);
               background:linear-gradient(rgba(255,255,255,var(--gloss)), rgba(255,255,255,0)); }
  .wp--lime  { --shade:var(--lime-d); --gloss:.65;
               background:linear-gradient(var(--lime-l) -30%, var(--lime) 55%, var(--lime-m)); }
  .wp--glass { --shade:rgba(20,14,50,.45); --gloss:.4;
               background:linear-gradient(rgba(255,255,255,.22), rgba(255,255,255,.04)), rgba(35,26,76,.5);
               box-shadow:0 0 0 var(--edge) var(--ink), inset 0 0 0 1.5px rgba(244,246,252,.3),
                          inset 0 calc(var(--lip)*-1) 0 var(--shade), 0 var(--lip) 0 0 var(--ink); }
  .wp.tap { cursor:pointer; }
  /* hundido: .press la pone tapBtn() mientras el dedo está encima, no :active,
     que en un div de iOS es poco fiable */
  .wp.tap.press { transform:translateY(var(--lip));
                  box-shadow:0 0 0 var(--edge) var(--ink), inset 0 calc(var(--lip)*-.35) 0 var(--shade),
                             0 0 0 0 var(--ink); }
  .wp .ol { position:relative; top:.06em; font-size:max(22px, calc(var(--u)*6.2)); --sw:.17em; }
  .wp.ghost { visibility:hidden; }
  .wp--icon { --h:max(40px, calc(var(--u)*11)); --lip:calc(var(--u)*.9);
              width:var(--h); min-width:0; padding:0; }
  .wp--icon svg { width:52%; height:52%; overflow:visible; }
  .ico { fill:var(--pearl); stroke:var(--ink); stroke-width:2.6; paint-order:stroke fill;
         stroke-linejoin:round; }
  /* HUD: pertenece a la columna, se reparte sobre --stage y escala con --uh (--u
     con techo, ver :root).
     Los dos marcadores viven abajo, en fila: dos placas idénticas, de ancho fijo,
     con la etiqueta encajada en el filo de arriba y el número dentro, dejando
     toda la mitad superior libre. En landscape, si caben, se abren a los lados
     (.wide, abajo). .hblock es el contenedor de layout; la placa va dentro.
     pointer-events:none es crítico: el HUD cae justo donde el pulgar empieza el
     arrastre y si captura el gesto, el giro se pierde. */
  #hud { position:fixed; left:50%; transform:translateX(-50%); width:var(--stage);
         bottom:max(calc(var(--uh)*6), env(safe-area-inset-bottom));
         display:flex; justify-content:center; align-items:flex-start; gap:calc(var(--uh)*5);
         pointer-events:none; }
  .hblock { display:flex; flex-direction:column; align-items:center; }
  .wp--plate { --h:max(54px, calc(var(--uh)*15)); --lip:max(4px, calc(var(--uh)*1.2)); --gloss:.22;
               width:max(137px, calc(var(--uh)*38));
               min-width:0; padding:0; flex-direction:column; }
  /* .wide (la pone resize() cuando caben): cada marcador sale a la franja libre
     de su lado —entre el margen seguro y el halo, medida a su altura— y se
     centra en ella, a la misma altura. --chord lo escribe wideStage(). */
  .wide #hud { left:0; width:100%; transform:none; justify-content:space-between; gap:0;
               padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  .wide .hblock { width:calc(50vw - var(--chord) - env(safe-area-inset-left)); }
  .wide .hblock + .hblock { width:calc(50vw - var(--chord) - env(safe-area-inset-right)); }
  .wp .hlabel { position:absolute; top:0; left:50%; transform:translate(-50%,-55%);
            font-size:max(12px, calc(var(--uh)*3.4)); --sw:.24em; letter-spacing:.06em;
            color:var(--label); white-space:nowrap; }
  /* Baloo trae las cifras tabulares pero desactivadas: sin tabular-nums el número
     cambia de ancho al sumar */
  .wp .hval { position:relative; top:.08em; font-size:max(34px, calc(var(--uh)*9.5)); --sw:.14em;
              font-variant-numeric:tabular-nums; transform-origin:50% 60%; }
  /* salto del marcador al sumar, teñido con el tono del último flotante (--tint,
     lo pone frame()). El récord no salta nunca. */
  .hval.bump { animation:bump .32s ease-out; }
  @keyframes bump { 30% { transform:scale(1.22); color:var(--tint, var(--pearl)); } }
  @media (prefers-reduced-motion: reduce){ .hval.bump { animation:none; } }
  /* Micro-tutorial: mismo esqueleto que el HUD, en la franja de arriba. No
     reserva altura: la esfera se coloca como si no estuviera y el tip se
     superpone sobre la franja alta del área de juego. Es absolute respecto al
     bloque, así que la esfera tampoco salta al aparecer ni al irse el texto. */
  #lvl { position:fixed; left:50%; transform:translateX(-50%); width:var(--stage);
         top:max(calc(var(--u)*2.4), env(safe-area-inset-top));
         text-align:center; pointer-events:none; }
  /* El tip es la única prosa del juego: se lee una vez, corriendo y a contrarreloj.
     Mismo texto con filo que el resto, pero a peso 600 y con el filo más fino: en
     prosa minúscula, más peso o más trazo cierran los ojos de la e, la a y la o.
     Arranca justo por debajo de los botones de las esquinas —su alto, su labio y
     1,6u de aire, medidos desde el top de #lvl, que va .8u más bajo que ellos—.
     El fade es asimétrico: entra rápido para no hacerse esperar, sale despacio
     para no cortar al que todavía está leyendo; la clase .on conmuta las dos
     duraciones.
     Los suelos en px mandan en el móvil en vertical, donde la columna es el ancho
     de la pantalla. 18 px es cuerpo de lectura de móvil, y el ancho mínimo de 360 px
     (sin pasar del borde) evita que el texto más largo apile cuatro líneas sobre
     la esfera. */
  .lvl-tip { position:absolute; top:calc(max(40px, var(--u)*11) + var(--u)*1.7); left:50%;
             transform:translateX(-50%);
             width:max(84%, min(100% - 24px, 360px));
             font-size:max(18px, calc(var(--u)*5.6)); --sw:.13em; font-weight:600; line-height:1.25;
             opacity:0; transition:opacity .6s ease; }
  .lvl-tip.on { opacity:1; transition:opacity .3s ease; }
  /* Contenido del tip. El tutorial de controles cambia de fase con el tip ya a la
     vista: el contenido nuevo no pasa por el fade de .on, entra con el suyo. */
  .tip-in { display:block; animation:tipIn .25s ease; }
  @keyframes tipIn { from { opacity:0; } }
  /* Glifos del tutorial de controles (símbolos en #glyphs, instanciados con <use>
     por glyph()). Nada reserva altura en el layout: la fila cuelga del tip, que
     ya se superpone. Perla con filo de tinta, como el texto: el contorno lo pone
     el CSS, los paths no se tocan. */
  .glyphs { display:flex; justify-content:center; align-items:center; gap:calc(var(--u)*3);
            margin-top:calc(var(--u)*1.6); overflow:visible; }
  .gl { position:relative; }
  .gl use { color:var(--pearl); stroke:var(--ink); stroke-width:2.4; paint-order:stroke fill;
            stroke-linejoin:round; }
  .gl svg { display:block; height:max(44px, calc(var(--u)*12)); width:auto; overflow:visible; }
  /* el vaivén reserva su recorrido: la fila no salta al moverse la mano */
  .gl.sway { padding:0 calc(var(--u)*5); }
  .sway svg { animation:sway 1.6s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform:translateX(calc(var(--u)*-5)); }
                    50%     { transform:translateX(calc(var(--u)*5)); } }
  /* las flechas siguen al ratón: → mientras va a la derecha, ← mientras vuelve */
  .k-r { animation:keyR 1.6s steps(1,end) infinite; }
  .k-l { animation:keyL 1.6s steps(1,end) infinite; }
  @keyframes keyR { 0% { opacity:1; } 50%,100% { opacity:0; } }
  @keyframes keyL { 0% { opacity:0; } 50%,100% { opacity:1; } }
  /* pulsación: el glifo se hunde sobre su punto de contacto (--o, lo pone
     glyph()) y el anillo sale de ahí, por detrás. El anillo es lo que enseña
     el hard drop y va en lima con filo de tinta (dos círculos iguales, el de
     tinta debajo y más ancho), grueso y sin apagarse hasta pasada la mitad de
     su crecida: en el perla del glifo un anillo claro apenas se vería, y en el
     ratón nace tapado por el botón relleno. */
  .press .fig { transform-origin:var(--o); animation:press 1.2s ease-in-out infinite; }
  @keyframes press { 0%,24%,100% { transform:none; }
                     12% { transform:translateY(calc(var(--u)*.6)) scale(.95); } }
  .press .ring { position:absolute; left:0; top:0; }
  .ring circle { fill:none; stroke:var(--lime); stroke-width:2.4;
                 transform-box:fill-box; transform-origin:center;
                 animation:ring 1.2s ease-out infinite; }
  .ring circle.edge { stroke:var(--ink); stroke-width:4; }
  @keyframes ring { 0%,7.99% { transform:scale(.3); opacity:0; }
                    8%       { transform:scale(.3); opacity:1; }
                    36%      { opacity:.9; }
                    60%,100% { transform:scale(1.8); opacity:0; } }
  @media (prefers-reduced-motion: reduce){
    .sway svg, .press .fig, .k-r, .k-l, .ring circle { animation:none; }
    .k-l { opacity:0; }
    .ring circle { transform:scale(1.05); opacity:.8; }
  }
  /* chrome, no HUD: se ancla a la esquina física de la pantalla, no a la
     columna. Anclado a la columna, en landscape --stage se estrecha y el botón
     acaba flotando en mitad del viewport. Pausa a la derecha, fullscreen a la
     izquierda; los dos con la misma pieza. La esquina izquierda es la que Safari
     ocupa con su X en la pantalla completa del iPad, y no deja moverla: ahí va
     el botón que en pantalla completa desaparece (ver syncFS). La pieza es
     .wp--icon; los iconos, SVG inline (un glifo de texto sale como emoji en iOS
     y Android). */
  #fs, #pz { position:fixed; top:max(calc(var(--u)*1.6), env(safe-area-inset-top)); z-index:5; }
  #fs { left:max(calc(var(--u)*2), env(safe-area-inset-left)); }
  #pz { right:max(calc(var(--u)*2), env(safe-area-inset-right)); }
  /* medidor de fps (temporal, ver fpsMeter()): arriba al centro, entre los dos
     botones y a su altura, en el hueco que dejó el rótulo de nivel */
  #fps { position:fixed; left:50%; transform:translateX(-50%);
         top:max(calc(var(--u)*1.6), env(safe-area-inset-top));
         height:max(40px, calc(var(--u)*11)); display:flex; align-items:center;
         font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
         font-size:max(11px, calc(var(--u)*2.6)); white-space:nowrap;
         font-variant-numeric:tabular-nums; color:#5c6090; pointer-events:none; z-index:5; }
  /* sonda: JS no lee env(); resize() mide su alto para no meter la esfera
     bajo la muesca */
  #safe-top { position:fixed; top:0; left:0; width:0; height:env(safe-area-inset-top);
              visibility:hidden; pointer-events:none; }
  /* game over y pausa: el mismo telón, con la misma composición. Solo responden
     los botones: un toque perdido no reanuda ni reinicia. El game over guarda el
     hueco de CONTINUAR (.ghost) para que REINICIAR caiga en el mismo sitio.
     El fondo es la gama activa oscurecida (--scrim, lo escribe showScrim() al
     abrirlo), no un negro: el juego sigue viéndose detrás, sin backdrop-filter
     porque draw() sigue pintando en pausa. */
  .ovl { position:fixed; inset:0; display:none; flex-direction:column; gap:calc(var(--u)*3.4);
         align-items:center; justify-content:center; background:rgba(20,15,46,.58);
         background:color-mix(in srgb, var(--scrim, #140f2e) 58%, transparent); }
  .ovl b { font-size:max(40px, calc(var(--u)*12)); --sw:.13em; color:var(--title); }
  .ovl .pts { font-size:max(20px, calc(var(--u)*5.6)); --sw:.18em; font-variant-numeric:tabular-nums;
              margin-bottom:calc(var(--u)*3); }
  .ovl .pts small { font-size:.75em; font-weight:700; }
  /* la pausa no enseña los puntos, pero #pfin sigue ocupando lo mismo que #fin:
     así todo el telón cae donde en el game over */
  #pfin { visibility:hidden; }
  /* wordmark, encima del título. Tres topes: el 86 % del telón, 640 px (iPad,
     para que no se estire) y el 22 % del alto (móvil en horizontal, donde manda
     el alto; 3,426 es la proporción del WebP). Sin loading="lazy": el telón
     está en display:none y la imagen tiene que llegar antes de la primera pausa.
     La sombra es estática: el telón no se anima. */
  .ovl .wordmark { width:min(86%, 640px, calc(22vh * 3.426)); height:auto;
                   margin-bottom:calc(var(--u)*4); pointer-events:none; user-select:none;
                   filter:drop-shadow(0 calc(var(--u)*1) calc(var(--u)*1.5) rgba(20,14,50,.35)); }
  /* volver a ver los tutoriales: fuera de la composición centrada del telón,
     anclado abajo y con aspecto de enlace, para no competir con los botones.
     En columna va justo encima del HUD —su bottom más el alto de la placa y lo
     que la etiqueta asoma por encima (55 %), suelos incluidos— para no pisar los
     marcadores, que se transparentan bajo el telón; en .wide están a los lados y
     baja hasta el borde. */
  .tut-again { position:absolute; left:50%; transform:translateX(-50%);
               bottom:calc(max(calc(var(--uh)*6), env(safe-area-inset-bottom))
                           + max(54px, calc(var(--uh)*15)) + max(12px, calc(var(--uh)*3.4))*.55
                           + var(--u)*2);
               padding:calc(var(--u)*2) calc(var(--u)*4); white-space:nowrap;
               font-size:max(16px, calc(var(--u)*4.6)); --sw:.2em; font-weight:700;
               text-decoration:underline; text-decoration-thickness:.1em; text-underline-offset:.25em;
               cursor:pointer; }
  .wide .tut-again { bottom:max(calc(var(--u)*3), env(safe-area-inset-bottom)); }
  .tut-again.press { color:var(--label); }
</style>
</head>

<script>
"use strict";

// ─── textos ────────────────────────────────────────────────────────────────
// Tabla única de todo lo que se lee. El original es el castellano de España; el
// resto son traducciones suyas, tuteando. Cada entrada lleva las lenguas juntas,
// así que una traducción que falte se ve al leer la tabla, y en ejecución cae al
// inglés. "match" y "combo" se quedan sin traducir: son la jerga del género.
// Las etiquetas del HUD no pasan de 9 caracteres, lo que ocupa "MI RÉCORD": en
// landscape manda lo más ancho entre etiqueta y número (ver wideStage()), y una
// etiqueta más larga encoge la esfera. Por lo mismo, los botones caben en su
// ancho mínimo: si uno lo estirase, saldría más ancho que el de al lado.
// Los tips de nivel van por el `id` de LEVELS; los del tutorial de controles,
// por fase y, si cambian con el dispositivo, también por modo de input.
const LANGS = ["es", "en", "fr", "it", "de"];
const STR = {
  score:    { es:"PUNTOS",         en:"SCORE",        fr:"SCORE",          it:"PUNTI",        de:"PUNKTE" },
  best:     { es:"MI RÉCORD",      en:"MY BEST",      fr:"RECORD",         it:"RECORD",       de:"REKORD" },
  over:     { es:"FIN DE PARTIDA", en:"GAME OVER",    fr:"FIN DE PARTIE",  it:"FINE PARTITA", de:"SPIELENDE" },
  pause:    { es:"PAUSA",          en:"PAUSE",        fr:"PAUSE",          it:"PAUSA",        de:"PAUSE" },
  resume:   { es:"CONTINUAR",      en:"CONTINUE",     fr:"CONTINUER",      it:"CONTINUA",     de:"WEITER" },
  restart:  { es:"REINICIAR",      en:"RESTART",      fr:"REJOUER",        it:"RIAVVIA",      de:"NEUSTART" },
  points:   { es:"puntos",         en:"points",       fr:"points",         it:"punti",        de:"Punkte" },
  tutAgain: { es:"Jugar de nuevo al tutorial", en:"Replay the tutorial", fr:"Rejouer le tutoriel",
              it:"Rigioca il tutorial", de:"Tutorial wiederholen" },

  ctrlA_touch: {
    es:"Arrastra para girar el montón.",
    en:"Drag to spin the pile.",
    fr:"Fais glisser pour faire tourner le tas.",
    it:"Trascina per ruotare il mucchio.",
    de:"Zieh, um den Haufen zu drehen." },
  ctrlA_desktop: {
    es:"Mantén el botón izquierdo y arrastra el ratón, o usa las flechas para girar.",
    en:"Hold the left button and drag the mouse, or use the arrow keys to spin.",
    fr:"Maintiens le clic gauche et bouge la souris, ou tourne avec les flèches.",
    it:"Tieni premuto il tasto sinistro e trascina il mouse, oppure usa le frecce per ruotare.",
    de:"Halte die linke Maustaste gedrückt und zieh, oder dreh mit den Pfeiltasten." },
  ctrlB: {
    es:"Junta 3 bolas del mismo color para hacer match y eliminarlas.",
    en:"Group 3 balls of the same color to make a match and clear them.",
    fr:"Réunis 3 boules de la même couleur pour faire un match et les éliminer.",
    it:"Unisci 3 palline dello stesso colore per fare match ed eliminarle.",
    de:"Bring 3 Kugeln derselben Farbe zusammen, um ein Match zu machen und sie loszuwerden." },
  ctrlC_touch: {
    es:"Toca para que las bolas caigan de golpe.",
    en:"Tap to drop the balls at once.",
    fr:"Touche l'écran pour faire tomber les boules d'un coup.",
    it:"Tocca per far cadere subito le palline.",
    de:"Tippe, damit die Kugeln sofort fallen." },
  ctrlC_desktop: {
    es:"Haz clic o pulsa abajo para que las bolas caigan de golpe.",
    en:"Click or press down to drop the balls at once.",
    fr:"Clique ou appuie sur bas pour faire tomber les boules d'un coup.",
    it:"Fai clic o premi giù per far cadere subito le palline.",
    de:"Klick oder drück nach unten, damit die Kugeln sofort fallen." },

  tip_stone: {
    es:"Si tardas mucho, las bolas se vuelven piedra y ya no estallan.",
    en:"Take too long and the balls turn to stone and won't pop anymore.",
    fr:"Si tu traînes, les boules se changent en pierre et n'éclatent plus.",
    it:"Se ci metti troppo, le palline diventano pietra e non scoppiano più.",
    de:"Wenn du zu lange brauchst, werden die Kugeln zu Stein und platzen nicht mehr." },
  tip_white: {
    es:"Las bolas blancas estallan con cualquier match que las toque.",
    en:"White balls pop with any match that touches them.",
    fr:"Les boules blanches éclatent dès qu'un match les touche.",
    it:"Le palline bianche scoppiano con qualsiasi match che le tocchi.",
    de:"Weiße Kugeln platzen bei jedem Match, das sie berührt." },
  tip_gauge: {
    es:"Cierra el anillo con matches y combos: saldrá una bomba que revienta todo lo que tenga alrededor.",
    en:"Close the ring with matches and combos: you'll get a bomb that blasts everything around it.",
    fr:"Ferme l'anneau avec des matchs et des combos pour obtenir une bombe qui fait tout sauter autour d'elle.",
    it:"Chiudi l'anello con match e combo: arriverà una bomba che fa esplodere tutto ciò che ha intorno.",
    de:"Schließ den Ring mit Matches und Combos: Dann kommt eine Bombe, die alles um sich herum sprengt." },
  tip_purple: {
    es:"Nuevo color: púrpura.",
    en:"New color: purple.",
    fr:"Nouvelle couleur : violet.",
    it:"Nuovo colore: viola.",
    de:"Neue Farbe: Lila." },
  tip_sine: {
    es:"Hay bolas que no caen. Cruzan el tablero de lado a lado.",
    en:"Some balls don't fall. They cross the board from side to side.",
    fr:"Certaines boules ne tombent pas. Elles traversent le plateau d'un côté à l'autre.",
    it:"Alcune palline non cadono. Attraversano il tabellone da un lato all'altro.",
    de:"Manche Kugeln fallen nicht. Sie ziehen von einer Seite zur anderen übers Feld." },
  tip_sineH: {
    es:"Y también de arriba abajo.",
    en:"And from top to bottom, too.",
    fr:"Et aussi de haut en bas.",
    it:"E anche dall'alto in basso.",
    de:"Und auch von oben nach unten." },
};
// El primero de la lista de preferencias del navegador que tengamos, por
// lengua y sin variante (es-MX juega en castellano de España). Se recorre la
// lista entera: con [ca, es] sale castellano, no el respaldo. Se decide una vez,
// al cargar, y no se guarda: sin selector, siempre manda el navegador.
const LANG = (() => {
  const prefs = navigator.languages && navigator.languages.length ? navigator.languages
                                                                  : [navigator.language];
  for (const l of prefs){
    const k = String(l || "").split("-")[0].toLowerCase();
    if (LANGS.includes(k)) return k;
  }
  return "en";
})();
function tr(key){ const e = STR[key]; return e[LANG] ?? e.en; }
document.documentElement.lang = LANG;
for (const el of document.querySelectorAll("[data-t]")) el.textContent = tr(el.dataset.t);

// ─── config ────────────────────────────────────────────────────────────────
const N = 15, C = (N-1)/2;
const R_FACTOR = 0.46;
// mobile first: el layout es una columna vertical. STAGE es su ancho, y de él
// sale todo el tamaño del juego. Único número para abrir o cerrar la columna en
// todas las pantallas a la vez. En landscape los marcadores pueden salir a los
// lados y la columna se ensancha: ver wideStage().
const STAGE_ASPECT = 0.645;
const ROT_STEP = 7.5 * Math.PI/180;
const ROT_TWEEN = 26;      // seguimiento de angle hacia angleT; a 340°/s un valor bajo va elástico
const CHAIN_MIN = 3;
const SPAWN_START = 1.8, SPAWN_MIN = 0.95, SPAWN_RAMP = 380;
const BUBBLE_SPEED = 0.185;                 // velocidad inicial
const FALL_ACCEL   = 0.065;                 // aceleración durante la caída
const HARD_SPEED   = 0.95;                  // velocidad mínima tras hard drop
const HARD_ACCEL   = 0.55;                  // y sigue acelerando más fuerte
const SPIRAL_TANGENT = 2.1, SPIRAL_INWARD = 0.085;
// La espiral se cierra a velocidad tangencial constante, así que el barrido
// angular se dispara al acercarse al centro (ω = v/r). Y ahí es donde cae el
// bonus siempre: en 48 impactos medidos el radio va de 0.054 a 0.214, nunca más
// afuera, o sea que el tramo que decide el premio se recorría a entre 130 y 380
// grados por segundo. Con el tablero girando debajo eso no se apunta: se suelta
// y se mira.
// A partir de SPIRAL_BRAKE_R el ritmo baja proporcional al radio, que es
// exactamente lo que deja ω plano —frenar proporcional al radio es poner techo
// al barrido, aquí 77°/s—, y la bola entra en el núcleo girando como giraba al
// cruzar el borde, frenando a la vista. El suelo está porque ese frenado es
// exponencial: sin él la bola nunca llega.
// Los dos pasos, ángulo y radio, se escalan con el MISMO factor: el camino es el
// de antes punto por punto y solo cambia el ritmo con el que se recorre, igual
// que SINE_EASE reparte la onda sin tocar su forma. Frenar solo el giro
// enderezaría la entrada, que es otra cosa: la espiral dejaría de serlo al final.
const SPIRAL_BRAKE_R = 0.25;   // radio donde empieza a frenar, en mundo
const SPIRAL_BRAKE   = 0.45;   // suelo del ritmo, fracción del de fuera
// La bomba: lo que entrega cada cierre del anillo. Revienta un disco alrededor de
// la celda del MONTÓN contra la que choca —no de la celda libre en la que se
// pararía: la bomba no ocupa celda—. La distancia es euclídea y no Chebyshev —la
// métrica de los anillos— para que el cráter salga redondo, y se compara al
// cuadrado para no sacar raíz. Con BOMB_R = 3.2 el disco alcanza las celdas a
// (1,3) y (3,1), que con 3.0 exactas se quedarían fuera. Al núcleo lo excluye
// fireBonus(), no el disco.
const BOMB_R = 3.2, BOMB_R2 = BOMB_R*BOMB_R;
const BOMB_COL  = "#f26b3a";   // su texto; la bola es lima, como el rayo que la carga
const BOMB_SHADE = "#a83600";  // el filo de color de su texto: la sombra del ámbar
function bombHits(c,r){ return (q,s) => (q-c)*(q-c) + (s-r)*(s-r) <= BOMB_R2; }
// Las blancas tienen su propio reloj, pero caen como las de color. Su reloj SUMA
// al de las de color, no lo ocupa, así que el suelo de 3 s contra el de 0,95 s
// deja una blanca por cada 3,2 de color: una cuota del 24%. El objetivo es ese
// ratio, no el suelo, y por eso la rampa es más corta que la de color —200 contra
// 380—: la de color todavía está bajando, así que con rampas iguales el ratio se
// pasaba la partida entera de camino y solo llegaba a 1/3 hacia los 15 min.
// Con 200 llega hacia t=265, 45 s después de abrir el último nivel (1/3,2), y
// sin rebasarlo: el máximo de blancas se da en t=455 y es 1/2,97, un 1% de nada.
// Más corta sí lo rebasa —con 98 el ratio baja a 1/2,56 a mitad de partida y
// luego vuelve a subir—, y eso es un pico de blancas que nadie ha pedido.
const WHITE_INT_START = 8, WHITE_INT_MIN = 3.0, WHITE_INT_RAMP = 200;
const WHITE_SPREAD = 50 * Math.PI/180;   // dispersión alrededor del punto opuesto
const STONE_WARN = 14, STONE_TIME = 34;   // 20 s de margen para reaccionar
const STONE_REWIND = .4;                  // s que tarda en deshacerse un aviso entero tras un match de 2
const TELEGRAPH = 1.25;                     // aviso previo a la salida de cada ficha
const TELEGRAPH_ARC = 35 * Math.PI/180;     // amplitud del aviso
// Sinusoide: no es un tipo de ficha, es otra forma de llegar. Entra por un eje
// cardinal y cruza el círculo serpenteando hasta el centro: la de vaivén vertical
// por las 3 o las 9 (nivel 6), la de vaivén horizontal por las 12 o las 6 (nivel 7).
// Las dos comparten amplitud, y SINE_AMP vive en una ventana estrecha:
//  - por debajo, la esquina de celda jugable más lejana (0.4674): mantiene TODOS
//    los giros de la onda fuera del campo, donde su curvatura cerradísima podría
//    esquivar celdas. Aun así, cerca del borde la cuerda de un frame se separa
//    de la curva, y rayCast() la trocea siguiéndola (ver allí).
//  - por encima, medio ancho de columna menos el radio de bola (0.4734): en
//    móvil vertical el ancho es exactamente PS, y la cresta horizontal debe
//    verse entera. Con 0.55 la bola desaparecía del todo justo donde más frena.
// SINE_SPEED es velocidad sobre la trayectoria, no sobre el eje: mismo ritmo
// aparente en los tramos de vaivén.
const SINE_AMP = 0.47, SINE_SPEED = 0.67;
const SINE_MAX_STEP = 0.02;   // avance máximo por subpaso de integración, múltiplo de PS
// Cómo se reparte la velocidad a lo largo de la onda:
//   1 = constante sobre la TRAYECTORIA. Ritmo plano; no frena en las crestas.
//   0 = constante sobre el EJE. La bola frena en las crestas y se lanza en los
//       cruces, como un péndulo.
// Elegido a 0 probándolo: con el ritmo plano la bola pasaba las crestas de
// carrerilla y el giro se leía como un latigazo. Frenando en la curva la onda se
// entiende de un vistazo. Es ortogonal a SINE_SPEED —spawnSine() recalibra cada
// bola contra su propio arco—, así que mover esto NO cambia la duración: reparte
// la misma travesía, y el ritmo se toca solo con SINE_SPEED.
const SINE_EASE = 0;
const SINE_P_START = 0.12, SINE_P_MAX = 0.30, SINE_RAMP = 220;

// elevación de la esfera fuera de .wide: sube hasta dejar este aire mínimo
// sobre la zona de juego, múltiplo de PS
const TOP_KEEP = 0.09;

// Los tres anillos concéntricos —gauge, frontera y aviso de salida— forman una
// sola familia: cada uno hacia fuera es 1.5x el anterior, y el aire entre trazos
// contiguos es el mismo en los dos saltos. Los radios del gauge y del aviso se
// derivan de ese aire en resize(), no se escriben a mano, para que la relación
// aguante al calibrar cualquiera de los tres grosores.
const RING_GAP    = 0.0085;      // aire entre trazos contiguos, múltiplo de PS
const GAUGE_W     = 0.008;       // trazo del gauge de antes: ya solo sitúa el radio del rayo
const BORDER_W    = 0.012;       // frontera = GAUGE_W * 1.5; no se traza, solo sitúa los otros dos
const GAUGE_RAD   = R_FACTOR - BORDER_W/2 - RING_GAP - GAUGE_W/2;   // radio del rayo, en PS
const TELE_W      = 0.018;       // aviso    = BORDER_W * 1.5: núcleo opaco
const TELE_HALO_W = 0.10;        // resplandor del aviso: fuera de la progresión
// borde exterior del halo: lo más lejano que se dibuja del juego (las fichas
// nacen a 0.52 y no llegan). En landscape la esfera se escala contra él.
const HALO_R      = R_FACTOR + BORDER_W/2 + RING_GAP + TELE_HALO_W;
const WIDE_AIR    = 0.03;        // landscape: aire del halo al borde de pantalla
const SIDE_AIR    = 0.04;        // landscape: aire a cada lado de un marcador
const GAUGE_A0    = Math.PI;     // ancla: 9 en punto
const GAUGE_TWEEN = 11;          // seguimiento del valor visual hacia el lógico
const GAUGE_FLASH = 0.35;        // destello del anillo cerrado, en segundos
// El anillo se llena con los mismos puntos que suma el marcador: lo que el jugador
// ve flotar es lo que avanza el aro, combo incluido. Capacidad: 24 tríos.
const GAUGE_MAX   = 360;
// carga de salida al abrir el nivel 4: el anillo nace casi cerrado para que el
// premio quede a un match de distancia y se vea para qué sirve. Un cuarteto (40)
// lo cierra de una; a base de tríos (15) hacen falta tres.
const GAUGE_INTRO = 324;
// 4 colores base + morado, que entra con el nivel 5. Cada joya tiene tres tonos:
// luz (vira a cálido), base saturada y sombra (vira a frío); COL es la base, y
// con ella casan el aviso de lanzamiento y los flotantes. La esmeralda tira a
// turquesa para no confundirse con la lima del rayo.
const JEWEL = [                            // [luz, base, sombra]
  [[255,150,160],[222, 28, 72],[ 96,  0, 52]],   // rubí
  [[255,236,140],[255,168, 12],[168, 54,  0]],   // ámbar
  [[140,205,255],[ 34, 98,240],[ 18, 20,120]],   // zafiro
  [[150,245,215],[  0,178,140],[  0, 70, 84]],   // esmeralda
  [[235,175,255],[164, 56,226],[ 64,  6,120]],   // amatista
];
const JEWEL_WHITE = [[255,255,255],[232,236,248],[110,118,160]];   // perla
const JEWEL_BONUS = [[238,255,190],[160,232, 18],[ 52,100,  0]];   // lima, la del rayo
const hexRGB = c => "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
const COL = JEWEL.map(([,b])=>hexRGB(b));
// sombra de cada joya: el filo de color de los flotantes, entre la tinta y el tono
const SHADE = JEWEL.map(([,,s])=>hexRGB(s)), SHADE_WHITE = hexRGB(JEWEL_WHITE[2]);
const WHITE = 8, STONE = 9;                // fuera del rango de índices de color
function numColors(){ return level >= 5 ? 5 : 4; }
// El sistema de carga es la única mecánica que puede adelantarse al calendario:
// con su tutorial ya leído está disponible desde el frame cero. El
// resto de elementos conserva su reloj y solo pierde el tip. `gaugeEarly` se
// congela en reset(), así que el desbloqueo nunca entra a mitad de partida.
function gaugeOn(){ return level >= 4 || gaugeEarly; }

// ─── niveles ───────────────────────────────────────────────────────────────
// Un único array declarativo manda sobre tiempos, textos y gates: `t` es la
// fuente de verdad y `level` es derivado. Ninguna mecánica conserva ya su propia
// constante de tiempo —todas preguntan por el nivel—, así que mover un `at`
// reordena la partida entera desde aquí. El último nivel es terminal.
// `id` es la identidad estable de cada mecánica y no depende de la posición: el
// almacén guarda los contadores de tutorial por `id`, así que reordenar niveles
// moviendo un `at` no reasigna progresos a la mecánica equivocada.
const LEVELS = [
  { n:1, id:"ctrl",   at:0 },   // guion propio en tres fases: ver ctrlText()
  // INVARIANTE: at < STONE_TIME. Antes del nivel 2 la edad de una bola no pasa de
  // `t` —la guarda está en ageBubbles(), porque el tutorial de controles retiene
  // `t` y la edad sigue corriendo—, así que mientras se cumpla es imposible que
  // aparezca una piedra antes de explicarla.
  // Puesta en escena, como la blanca en camino del nivel 3: al abrir, lo más viejo
  // del montón tiene 19 s y la primera piedra llegaría 15 s después, con el tip ya
  // olvidado. stoneDemo() adelanta unas pocas para que se petrifiquen mientras se
  // lee. Solo con tip: quien ya se lo sabe juega la partida de siempre.
  { n:2, id:"stone",  at:19,  intro(){ stoneDemo(); } },
  // el tutorial de las blancas llega con una blanca ya en camino: se lee el texto
  // mirando la cosa de la que habla, no esperando 8 s a que aparezca sola.
  { n:3, id:"white",  at:50,  on(){ spawnWhite(); whiteT = whiteInterval(); } },
  // Puesta en escena, no mecánica: el anillo aparece de golpe y barriendo hasta
  // GAUGE_INTRO, y el tip habla de cerrarlo mientras se ve cerrarse casi entero.
  // Va en `intro` y no en `on` porque quien ya se sabe el anillo lo tiene desde
  // el frame cero (ver gaugeOn()): ese salto sería un bonus regalado a mitad de
  // partida y sin texto que lo justifique.
  { n:4, id:"gauge",  at:90,  intro(){ gauge = gaugeL = GAUGE_INTRO; } },
  // El púrpura no puede esperar al azar: con 5 colores en la bolsa podría tardar
  // varias fichas en salir y el tip se leería sin nada que mirar. `forceK` reserva
  // el color de la próxima ficha, y si el aviso de la pendiente todavía no ha
  // empezado a pintarse se la vuelve a tirar a ella —recolorear un arco a medio
  // aparecer sería un parpadeo— para que el púrpura salga ya.
  { n:5, id:"purple", at:130, on(){ forceK = 4; if (spawnT >= TELEGRAPH) nextSpawn = pickNext(); } },
  // Misma reserva que el morado, y por la misma razón: la primera sinusoide no
  // puede depender de un 0.12. `forceSine` se salta el filtro de `prevSine`
  // —el tutorial manda— y el re-pick solo entra si el aviso todavía no se pinta.
  { n:6, id:"sine",   at:175, on(){ forceSine = "v"; if (spawnT >= TELEGRAPH) nextSpawn = pickNext(); } },
  // Otro eje, no otra cantidad: el nivel 7 reparte las mismas sinusoides entre
  // los dos vaivenes (ver pickNext()), y reserva la primera horizontal.
  { n:7, id:"sineH",  at:220, on(){ forceSine = "h"; if (spawnT >= TELEGRAPH) nextSpawn = pickNext(); } },
];
// Intervalo entre blancas: se acorta con la partida, pero la rampa cuenta desde
// que abrió el nivel 3, no desde t=0. En el propio instante de abrir vale
// WHITE_INT_START, así que la blanca del tutorial deja el ciclo recién arrancado.
// De 8 s a 4,3 s mientras abren los niveles 4 a 7: las blancas casi doblan su
// ritmo justo en el tramo en el que el jugador ya las conoce y llega todo lo demás.
function whiteInterval(){
  return WHITE_INT_MIN + (WHITE_INT_START-WHITE_INT_MIN)*
         Math.exp(-(t-LEVELS[2].at)/WHITE_INT_RAMP*1.6);
}
// Proporción de fichas que llegan serpenteando en vez de cayendo, sumando los dos
// vaivenes: el nivel 7 no la sube, la reparte. Misma forma y
// misma razón que whiteInterval(): la rampa cuenta desde que abrió el nivel 6,
// así que en el instante de abrir vale exactamente SINE_P_START. El tope de 0.30
// es el punto del diseño —la bajada radial es el core y sigue siendo mayoría
// clara—, y como el veto de dos seguidas obliga a que cada sinusoide vaya
// precedida de una radial, el efectivo a largo plazo es p/(1+p) = ~0.23.
function sineChance(){
  return SINE_P_MAX + (SINE_P_START-SINE_P_MAX)*
         Math.exp(-(t-LEVELS[5].at)/SINE_RAMP*1.6);
}

// el tip se lee, no se parpadea: la ventana sale del número de palabras.
const READ_MIN = 3.5, READ_MAX = 9.0, READ_PER_WORD = 0.38, READ_BASE = 1.4;
// Solo texto: los glifos del tutorial de controles no cuentan como palabras.
function readTime(tip){
  const words = tip.trim().split(/\s+/).length;
  return Math.max(READ_MIN, Math.min(READ_MAX, READ_BASE + READ_PER_WORD*words));
}

// ─── tutorial de controles ─────────────────────────────────────────────────
// El tip del nivel 1 es un guion de tres fases en orden estricto, y es el único
// que se compone al vuelo:
//  A. girar: no avanza hasta que el jugador gira el montón de verdad, y hasta
//     entonces la partida no arranca: ni corre `t` ni cae ninguna ficha. Se lee y
//     se prueba el giro sin nada encima; la cuenta de la primera ficha empieza
//     en el tick siguiente al giro.
//  B. juntar: sin reloj, hasta el primer match que se resuelva ya en B.
//  C. soltar rápido: con su ventana de lectura normal. Agotarla es el único punto
//     de consumo; completar A o B no consume.
// Mientras dura, `t` no pasa del `at` del nivel 2 (ver updateGame()): el tutorial
// no endurece la partida ni deja que el nivel 2 lo interrumpa.
// Los listeners solo marcan `ctrlTurn`; la fase la cambia el tick siguiente.
// El modo arranca por matchMedia y lo fija el primer gesto real: los primeros
// segundos son justo cuando el jugador revela qué dispositivo usa. Si cambia con
// el tip a la vista se reescribe en vivo, sin cambiar de fase ni reiniciar la
// ventana de C.
let inputMode = matchMedia("(pointer: fine)").matches ? "desktop" : "touch";
let inputModeFixed = false;
let ctrlPhase = null, ctrlTurn = false;
// El texto de la fase sale de STR: con variante por modo si la tiene, y si no,
// el mismo para los dos.
function ctrlText(){
  const k = "ctrl" + ctrlPhase;
  return tr(STR[k+"_"+inputMode] ? k+"_"+inputMode : k);
}
// Caja de cada símbolo de #glyphs en el lienzo original 64×64, el punto de
// contacto —yema, botón izquierdo, tecla ↓— del que sale la pulsación y el radio
// base del anillo. Mano y ratón reservan en su caja el anillo a escala 1.8. El
// del ratón es mayor porque nace detrás del botón relleno: con el de la yema
// solo asomaba ya casi transparente.
const GLYPH = {
  touch: { id:"g-touch", vb:[17,   15,   37.5, 40.5], at:[30, 28], ring:6 },
  mouse: { id:"g-mouse", vb:[ 4.5,  2.5, 46,   52  ], at:[23, 21], ring:9 },
  keys:  {               vb:[ 8.5, 16.5, 47,   31  ], at:[32, 40] },
};
// El <svg> exterior mide lo mismo que la caja del símbolo pero con origen en 0:
// el <use> ocupa el 100% y el anillo se sitúa restando la esquina. El anillo son
// dos círculos iguales con la misma animación: el filo de tinta debajo, la lima
// encima.
function glyph(g, cls, uses, ring){
  const [x,y,w,h] = g.vb, px = g.at[0]-x, py = g.at[1]-y;
  const box = `viewBox="0 0 ${w} ${h}"`;
  const body = uses.map(([id,c]) => `<use href="#${id}"${c ? ` class="${c}"` : ""}/>`).join("");
  const circ = c => `<circle${c} cx="${px}" cy="${py}" r="${g.ring}"/>`;
  return `<span class="gl ${cls}">` +
    (ring ? `<svg class="ring" ${box}>${circ(' class="edge"')}${circ("")}</svg>` : "") +
    `<svg class="fig" ${box} style="--o:${(px/w*100).toFixed(1)}% ${(py/h*100).toFixed(1)}%">${body}</svg></span>`;
}
function ctrlGlyphs(){
  const desk = inputMode === "desktop", dev = desk ? GLYPH.mouse : GLYPH.touch;
  if (ctrlPhase === "A")
    return glyph(dev, "sway", [[dev.id]]) +
           (desk ? glyph(GLYPH.keys, "", [["g-right","k-r"], ["g-left","k-l"]]) : "");
  if (ctrlPhase === "C")
    return glyph(dev, "press", [[dev.id]], true) +
           (desk ? glyph(GLYPH.keys, "press", [["g-down"]]) : "");
  return "";
}
function renderCtrl(){
  const g = ctrlGlyphs();
  tipEl.innerHTML = `<div class="tip-in">${ctrlText()}` +
    (g ? `<div class="glyphs" aria-hidden="true">${g}</div>` : "") + `</div>`;
}
// El cambio de fase no pasa por el fade de .on: el tip sigue a la vista y el
// contenido nuevo entra con el suyo (.tip-in).
function setCtrlPhase(p){
  ctrlPhase = p;
  renderCtrl();
  if (p === "C") tipT = readTime(ctrlText());
}
// Sin tutorial de controles la partida es la de siempre: ni guion, ni montón
// precargado, ni `t` retenido.
function ctrlPending(){ return startLevel === 1 && !tutSeen("ctrl"); }
function setInputMode(m){
  if (inputModeFixed) return;
  inputModeFixed = true;
  if (m === inputMode) return;
  inputMode = m;
  if (ctrlPhase) renderCtrl();
}
const tipEl  = document.querySelector(".lvl-tip");
// Único punto donde se decide si hay tip: tras una lectura completa el nivel
// abre sin él. Con tipT a 0 y sin fase el bloque de fade de updateGame() no
// tiene nada que hacer y setInputMode() tampoco reescribe nada.
function showLevel(){
  tipT = 0; ctrlPhase = null;
  if (level === 1 ? !ctrlPending() : tutSeen(LEVELS[level-1].id)){
    tipEl.classList.remove("on"); return;
  }
  if (level === 1) setCtrlPhase("A");
  else {
    const tip = tr("tip_" + LEVELS[level-1].id);
    tipT = readTime(tip);
    tipEl.innerHTML = `<div class="tip-in">${tip}</div>`;
  }
  tipEl.classList.add("on");
}

// ─── estado ────────────────────────────────────────────────────────────────
const cv = document.getElementById("c"), cx = cv.getContext("2d");
let W,H,DPR,STAGE,PS,R,CELL,ox,oy,gaugeRad,teleRadIn;
let grid, angle, angleT, anglePrev, flying, score, gauge, gaugeL, gaugeV, gaugeEpoch, gaugeFlashT, t, spawnT, dead, deadBall, outBall, nextSpawn, whiteT, lastColorAngle;
let level, tipT, gaugeEarly, forceK, prevSine, forceSine;
// el aviso de la ficha que acaba de salir: solo lo lee el dibujo (ver drawTele())
let teleOut;
let dir, rotT, dragAcc, ptrDown, ptrId, ptrX, energy, lastMoveT, ptrT, ptrMoved, wheelAcc;
let heldKeys, keyDir, keyMode, keyHoldT, keyRamp, keyIdleT;
let bestSaved;

// ─── almacén local ─────────────────────────────────────────────────────────
// Una sola clave versionada con el récord y los contadores de tutorial. El objeto
// en memoria es la fuente de verdad durante la sesión y localStorage solo el
// respaldo: lanza en Safari privado y puede estar bloqueado dentro del iframe de
// un portal, así que las dos caras van envueltas y el fallo se traga en silencio.
// Sin aviso al jugador: no puede hacer nada al respecto y la partida se juega
// igual, sin persistencia, hasta que se recarga.
// El almacén es por origen, navegador y dispositivo, y no se sincroniza: móvil y
// escritorio son dos progresos independientes que nunca se ven. Aceptado, no
// defecto —quien prueba la demo en los dos ve los tutoriales en los dos.
const SAVE_KEY = "whirlpop.save";
const BEST_KEY = "whirlpop.best";      // clave heredada: solo guardaba el récord
// Cada tip sale una sola vez: una lectura completa lo da por visto. Para verlos
// otra vez está "jugar de nuevo al tutorial" (ver replayTutorial()).
const SAVE_V = 1, TUT_MAX = 1;
const TUT_IDS = LEVELS.map(l => l.id);

function lsGet(k){ try { return localStorage.getItem(k); } catch(_){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(_){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(_){} }

// nada de lo que salga del almacén puede romper el arranque: un valor editado a
// mano en devtools se satura o cae a 0, y un id desconocido no llega a entrar.
function clampInt(x, max){ return Math.max(0, Math.min(max, Math.floor(Number(x) || 0))); }
function blankSave(){
  const s = { v:SAVE_V, best:0, tut:{} };
  for (const id of TUT_IDS) s.tut[id] = 0;
  return s;
}
let save = blankSave(), saveDirty = false;

function loadSave(){
  save = blankSave();
  let raw = null;
  try { raw = JSON.parse(lsGet(SAVE_KEY)); } catch(_){}
  if (raw && raw.v === SAVE_V){
    save.best = clampInt(raw.best, Infinity);
    const tut = raw.tut || {};
    for (const id of TUT_IDS) save.tut[id] = clampInt(tut[id], TUT_MAX);
    return;
  }
  // sin clave, con otra versión o con el JSON roto: partida limpia. Se rescata el
  // récord de la clave heredada y se borra, para no dejar dos fuentes de verdad.
  save.best = clampInt(lsGet(BEST_KEY), Infinity);
  flushSave();
  lsDel(BEST_KEY);
}
// se escribe siempre la clave entera: el blob son decenas de bytes y no compensa
// nada más fino. Nunca dentro del bucle de frame.
function flushSave(){ saveDirty = false; lsSet(SAVE_KEY, JSON.stringify(save)); }
function flushIfDirty(){ if (saveDirty) flushSave(); }

function tutCount(id){ return save.tut[id] || 0; }
function tutSeen(id){ return tutCount(id) >= TUT_MAX; }
function tutConsume(id){
  if (!(id in save.tut) || save.tut[id] >= TUT_MAX) return;
  save.tut[id]++;
  flushSave();          // el instante importa: no depende de llegar al game over
}

// El récord se perdía al cerrar la pestaña en pleno récord, que en móvil —que es
// donde se juega— pasa constantemente. Los dos eventos porque ninguno dispara de
// forma fiable en todos los navegadores; entre los dos cubren cerrar la pestaña,
// cambiar de app en iOS y el bfcache. pause() no escribe: ya corre en blur y
// mezclar responsabilidades ahí complica el rastreo.
addEventListener("pagehide", flushIfDirty);
document.addEventListener("visibilitychange", ()=>{ if (document.hidden) flushIfDirty(); });

// Arranque del almacén con los dos atajos de prueba encima: ?reset=1 borra y
// empieza limpio, ?tut=1 da todos los tutoriales por vistos —sin tips y con la
// carga desbloqueada; un número mayor se satura—. Se quitan de la URL para que un F5 no los repita: jugar
// seis minutos, o borrar la clave a mano en el móvil —donde eso exige depuración
// remota—, no es forma de probar esto. ?nivel=N adelanta el reloj de partida al
// `at` de ese nivel: ninguna lógica de juego se entera, porque toda la dificultad
// se deriva de `t`. ?nivel=6&tut=1 da nivel 6 limpio y con el anillo desbloqueado.
let startLevel = 1;
(function bootSave(){
  const q = new URLSearchParams(location.search);
  const wipe = q.has("reset"), tut = q.get("tut"), lvl = q.get("nivel");
  if (wipe){ lsDel(SAVE_KEY); lsDel(BEST_KEY); }
  loadSave();
  if (tut !== null){
    for (const id of TUT_IDS) save.tut[id] = clampInt(tut, TUT_MAX);
    flushSave();
  }
  if (lvl !== null) startLevel = Math.max(1, clampInt(lvl, LEVELS.length));
  if (!wipe && tut === null && lvl === null) return;
  q.delete("reset"); q.delete("tut"); q.delete("nivel");
  const qs = q.toString();
  try { history.replaceState(null, "", location.pathname + (qs ? "?"+qs : "") + location.hash); } catch(_){}
})();

let bestScore = save.best;
const bestEl = document.getElementById("bestv");

function idx(c,r){ return r*N+c; }
function inb(c,r){ return c>=0&&c<N&&r>=0&&r<N; }
const NB = [[0,-1],[0,1],[-1,0],[1,0]];   // adyacencia 4, sin diagonales

// ─── la forma del campo ────────────────────────────────────────────────────
// El jugador lee el campo en radial, así que la silueta se declara, no se
// calcula: ningún umbral aproximado decide qué es borde ni qué cabe. `V` es
// celda jugable, `X` es muro, indistinguible del exterior en todo el algoritmo.
// Se lee de un vistazo y se retoca a mano —los picos, celdas que sobresalen con
// un solo 4-vecino jugable, se tachan aquí— sin recalibrar ningún decimal.
// 177 celdas jugables, entre 6.71 y 7.28 celdas de radio: es un disco
// digitalizado, y esa variación es lo que se ve al girar. La máscara fija N:
// cambiar N obliga a redibujarla, que es lo que se querría hacer de todos modos.
//
// Por qué ESTAS 177 y no otras. La frontera se dibuja a MASK_R+0.5, o sea la
// pone la celda MÁS lejana; pero en las direcciones donde la silueta se queda
// corta la última bola posible deja un hueco visible contra ese trazo, y ahí un
// game over se lee como injusto: "si aún cabía". Lo que hay que minimizar es la
// DISPERSIÓN radial de la silueta, no su tamaño. Barridas las 86 máscaras que
// caben en N=15 sin picos, conexas y sin huecos, esta es la de menor hueco
// máximo: 0.62 celdas, contra 0.80 de la anterior —y el hueco medio pasa de
// 0.38 a 0.24—. No baja de ahí: rejilla cuadrada contra círculo, a esta
// resolución no da más.
const MASK = [
  "XXXXXVVVVVXXXXX",
  "XXXVVVVVVVVVXXX",
  "XXVVVVVVVVVVVXX",
  "XVVVVVVVVVVVVVX",
  "XVVVVVVVVVVVVVX",
  "VVVVVVVVVVVVVVV",
  "VVVVVVVVVVVVVVV",
  "VVVVVVVVVVVVVVV",
  "VVVVVVVVVVVVVVV",
  "VVVVVVVVVVVVVVV",
  "XVVVVVVVVVVVVVX",
  "XVVVVVVVVVVVVVX",
  "XXVVVVVVVVVVVXX",
  "XXXVVVVVVVVVXXX",
  "XXXXXVVVVVXXXXX",
];
const PLAY = new Uint8Array(N*N);          // 1 = jugable
let MASK_R = 0;                            // radio, en celdas, de la más lejana
for (let r=0;r<N;r++) for (let c=0;c<N;c++){
  if (MASK[r][c] !== "V") continue;
  PLAY[idx(c,r)] = 1;
  MASK_R = Math.max(MASK_R, Math.hypot(c-C, r-C));
}
// lado de celda en unidades de PS. Es la escala entre el mundo y el grid, y no
// depende de la ventana: ver "conversiones".
const CELL_PS = R_FACTOR/(MASK_R + 0.5);
// sustituye a inb() en todo lo que decida ocupación de celdas —aterrizaje y
// gravedad—; inb() se conserva donde solo se recorre el array.
function playable(c,r){ return inb(c,r) && PLAY[idx(c,r)]===1; }

// profundidad: 0 = muro; 1 = borde, celda jugable con algún 4-vecino que no lo
// es; 2, 3... hacia dentro. Ni radios ni redondeos: es la medida con la que se
// anuncia el peligro, y la que hace innecesario cualquier umbral.
const DEPTH = new Int8Array(N*N);
(function buildDepth(){
  const q = [];
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    if (!playable(c,r)) continue;
    for (const [dc,dr] of NB) if (!playable(c+dc,r+dr)){ DEPTH[idx(c,r)]=1; q.push([c,r]); break; }
  }
  for (let h=0; h<q.length; h++){          // BFS en 4-adyacencia, de fuera hacia dentro
    const [c,r] = q[h];
    for (const [dc,dr] of NB){
      const p=c+dc, s=r+dr;
      if (!playable(p,s) || DEPTH[idx(p,s)]) continue;
      DEPTH[idx(p,s)] = DEPTH[idx(c,r)]+1; q.push([p,s]);
    }
  }
})();

// Montón con el que arranca la partida mientras el tutorial de controles está
// pendiente: girar un tablero vacío no enseña nada, y la fase B necesita material
// para un primer match. `.` vacía, `0`–`3` color, `*` la piedra central.
// Es un literal y no se genera en ejecución: no gasta Math.random, así que la
// partida sembrada lleva la misma secuencia que sin él. Salió al azar de un
// script aparte, filtrado hasta cumplir: 22 bolas a ≤ 3 celdas del centro, lejos
// del borde; asentado (gravityPass() no mueve nada); sin grupos de CHAIN_MIN; los
// cuatro colores base y sin morado; sin simetría de giro, ni de forma ni de color,
// para que el giro se vea; y siete parejas con hueco al lado donde una bola se
// quedaría, para que el primer match esté a la vista.
const CTRL_PILE = [
  "...............",
  "...............",
  "...............",
  "...............",
  ".......2.......",
  ".....3023......",
  "......3300.....",
  "....301*221....",
  ".....021.......",
  ".....331.......",
  ".......2.......",
  "...............",
  "...............",
  "...............",
  "...............",
];

function reset(){
  grid = new Array(N*N).fill(null);
  floaters = []; cascadeF = null;
  flashT = 0; flashSet = new Set(); flashBonus = false;
  pendingBonus = null; shakeT = 0;
  alarm = 0; flowPrev = 0;                   // angle vuelve a 0 más abajo: sin empujón
  grid[idx(C,C)] = { k:-1, age:0 };          // piedra central fija
  // ya asentadas, con la forma de place(): ni caen ni puntúan al aparecer
  if (ctrlPending())
    for (let r=0;r<N;r++) for (let c=0;c<N;c++){
      const k = "0123".indexOf(CTRL_PILE[r][c]);
      if (k >= 0) grid[idx(c,r)] = { k, age:0, vc:c, vr:r, fresh:false };
    }
  ctrlTurn = false;
  angle = angleT = anglePrev = angleD0 = 0; flying = []; score = 0;
  gauge = gaugeL = gaugeV = gaugeV0 = gaugeFlashT = 0; gaugeEpoch = 0; orbs = []; ringClear();
  simTick = 0;
  spawnT = 0.9; teleOut = null; whiteT = WHITE_INT_START; dead = false; deadBall = outBall = null; lastColorAngle = null;
  forceK = null; prevSine = false; forceSine = null;
  // arranque en un nivel concreto (?nivel=N): toda la dificultad se deriva de
  // `t`, así que basta con adelantar el reloj. La progresión se encadena sola en
  // el primer frame, ejecutando cada on() intermedio en orden.
  t = LEVELS[startLevel-1].at;
  // el desbloqueo del anillo se congela aquí: si el tutorial de la carga se
  // consume por tercera vez en esta partida, el adelanto entra en la siguiente.
  // Cambiar las reglas en caliente, a mitad de partida, sería peor.
  gaugeEarly = tutSeen("gauge");
  // el nivel 1 y su tip se pintan desde el frame cero
  level = 1; showLevel();
  { const aArc = Math.random()*Math.PI*2;
    nextSpawn = { aArc, a: aArc + (Math.random()-0.5)*TELEGRAPH_ARC*0.82,
                  k: Math.floor(Math.random()*4) }; }  // arranque: sin morado
  dir = 0; rotT = 0; dragAcc = 0; wheelAcc = 0;
  ptrDown = false; ptrId = null; ptrX = 0; energy = 0; lastMoveT = 0; ptrT = 0; ptrMoved = false;
  heldKeys = []; keyDir = 0; keyMode = "idle"; keyHoldT = 0; keyRamp = 0; keyIdleT = 0;
  bestSaved = false;
  paused = false;
  document.getElementById("over").style.display = "none";
  syncPause();
}

const safeTopEl = document.getElementById("safe-top");
const hudBlocks = document.querySelectorAll("#hud .hblock");
const hudPlates = document.querySelectorAll("#hud .wp--plate");

// En landscape sobra pantalla a los lados de la columna. Si en esas franjas caben
// los marcadores, salen de debajo de la esfera y la columna ya solo tiene que
// abarcar el halo, con WIDE_AIR hasta el borde arriba y abajo: la esfera crece.
// El tip no reserva sitio; se superpone. Devuelve el STAGE de ese
// reparto y la semicuerda del halo a la altura de los marcadores (lo que el halo
// quita a su franja), o null si no supera al de la columna (col).
// Solo con ventana más ancha que alta, por decisión: en portrait los marcadores
// también cabrían en las esquinas de abajo de un tablet, pero su layout se queda
// como está. Al cruzar el cuadrado la esfera salta de tamaño.
function wideStage(col){
  if (W <= H) return null;
  const hMax = H / (2*(HALO_R + WIDE_AIR));
  // cota sin marcadores
  if (Math.min(hMax, W/(2*HALO_R)) <= col) return null;
  const root = document.documentElement;
  root.style.setProperty("--stage", hMax+"px");
  root.style.setProperty("--chord", "0px");
  root.classList.add("wide");
  // las placas tienen suelo y techo en px: se miden, no se calculan. Todo se mide a
  // hMax, que es el peor caso: con un STAGE menor el HUD encoge y baja.
  // Las placas son de ancho fijo y el texto va dentro: manda su ancho.
  let lab = 0;
  for (const e of hudPlates) lab = Math.max(lab, e.getBoundingClientRect().width);
  // los marcadores van abajo, donde el círculo es más estrecho: la franja libre
  // se mide a la altura de su borde superior, no en el ecuador
  const dy = hudBlocks[0].getBoundingClientRect().top - H/2;
  // el margen seguro no se lee desde JS: con --chord a 0, es lo que le falta a
  // la franja más estrecha para medir media pantalla
  const inset = W/2 - Math.min(hudBlocks[0].getBoundingClientRect().width,
                               hudBlocks[1].getBoundingClientRect().width);
  const chord = s => { const z = HALO_R*s; return z > dy ? Math.sqrt(z*z - dy*dy) : 0; };
  const fits  = s => W/2 - inset - chord(s) >= lab + 2*SIDE_AIR*s;
  // fits es monótona: bisección entre la columna y el tope de altura
  let s = hMax;
  if (!fits(s)){
    let lo = col, hi = hMax;
    for (let i = 0; i < 40; i++){ const m = (lo+hi)/2; if (fits(m)) lo = m; else hi = m; }
    s = lo;
  }
  return s > col ? { s, chord: chord(s) } : null;
}

function resize(){
  W = innerWidth; H = innerHeight;
  const col = Math.min(W, H*STAGE_ASPECT);
  const wide = wideStage(col);
  const root = document.documentElement;
  root.classList.toggle("wide", !!wide);
  STAGE = wide ? wide.s : col;
  root.style.setProperty("--stage", STAGE+"px");
  if (wide) root.style.setProperty("--chord", wide.chord+"px");

  // buffer a resolución de dispositivo, dibujo en px CSS. La matriz que lo
  // traduce no se fija aquí sino en cada draw(): ver allí.
  DPR = Math.min(3, devicePixelRatio || 1);
  cv.width  = Math.round(W*DPR);
  cv.height = Math.round(H*DPR);
  cv.style.width = W+"px"; cv.style.height = H+"px";

  // el canvas ocupa la ventana entera — solo el fondo se expande a lo ancho —,
  // pero el juego mide la columna, no el viewport.
  // manda la celda jugable más lejana, no el tamaño del array: el círculo
  // dibujado queda a media celda por fuera de la bola más exterior posible, en
  // todas las direcciones. Con 2R/N la rejilla se quedaba corta en los ejes y se
  // pasaba en las diagonales, y el mismo montón moría o no según el giro.
  PS = STAGE; R = PS*R_FACTOR; CELL = PS*CELL_PS;
  // la frontera manda: los otros dos anillos se sitúan a RING_GAP de su trazo.
  // Del aviso se guarda el borde INTERIOR: núcleo y resplandor crecen solo hacia
  // fuera desde él, y el aire contra la frontera no depende de su latido.
  gaugeRad  = PS*GAUGE_RAD;
  teleRadIn = R + PS*(BORDER_W/2 + RING_GAP);

  // En vertical los pulgares van debajo de la esfera, como los mandos de una
  // Game Boy: pantalla arriba, mandos abajo. La esfera sube siempre hasta la
  // guarda, también donde la columna está limitada por la altura (tablets), y
  // todo el aire que sobra queda debajo, para los pulgares. Sin tope propio: con
  // uno, a partir de cierta esbeltez la esfera volvía a bajar al estrechar la
  // pantalla. Guarda: la zona de spawn y el aviso suben con ella y no deben
  // salirse por arriba ni meterse en el margen seguro (la muesca, en pantalla
  // completa). El tip no reserva sitio: se superpone.
  // En .wide no sube: la esfera ya llena la altura y va centrada.
  let lift = 0;
  if (!wide){
    const guard = H/2 - PS*0.60 - PS*TOP_KEEP - safeTopEl.getBoundingClientRect().height;
    lift = Math.max(0, guard);
  }

  ox = W/2; oy = H/2 - lift;
  syncBubOut(); bake();
}
function bake(){ bakeBg(); bakeBalls(); bakeTele(); bakeRing(); }
// Si la GPU se reinicia (reposo del equipo, driver; se reproduce con
// chrome://gpucrash), Chrome devuelve todos los canvas con el contexto vacío. Los
// trazos se repintan en cada frame, pero lo horneado no: la arena, las bolas, el
// aviso y el anillo desaparecían hasta el siguiente resize. Avisan el
// principal y cada caché (bgCanvas()), y frame() rehornea una vez antes de pintar.
let rebake = false;
const askRebake = ()=>{ rebake = true; };
cv.addEventListener("contextrestored", askRebake);
addEventListener("resize", resize);
// en móvil el alto real llega tarde al girar el dispositivo
addEventListener("orientationchange", ()=>setTimeout(resize,120));

// ─── conversiones ──────────────────────────────────────────────────────────
// Tres espacios, cada uno con su dueño:
//  - celda:    el grid. Gira con el tablero.
//  - mundo:    todo lo que vuela. Unidades de PS, origen en el centro de la
//              esfera, sin girar. Es donde vive la lógica.
//  - pantalla: px CSS. Solo el dibujo y el input.
// Ningún estado que dure más de un frame se guarda en pantalla. resize() mueve
// el centro y cambia PS, y lo que estuviera en px se quedaba midiendo la esfera
// vieja: al pasar a fullscreen las bolas en vuelo seguían apuntando al centro
// antiguo. Con el vuelo en el mundo resize() no migra nada y la partida es la
// misma en cualquier ventana, también a mitad de un vuelo. Las constantes de
// arrastre del input se quedan en px a propósito: miden dedo, no tablero.
function toScreen(x,y){ return [ox + x*PS, oy + y*PS]; }
// solo la usa el dibujo, y por eso gira con el ángulo interpolado: ver draw()
let angleDraw = 0;
function cellToScreen(fc,fr){
  const lx=(fc-C)*CELL, ly=(fr-C)*CELL, s=Math.sin(angleDraw), co=Math.cos(angleDraw);
  return [ox + lx*co - ly*s, oy + lx*s + ly*co];
}
// El tablero GIRA, así que una posición del mundo no significa lo mismo en dos
// frames distintos: para llevarla a celdas hay que usar el ángulo que estaba en
// vigor cuando se tomó: por eso el ángulo se pasa siempre explícito.
function worldToCellA(x,y,ang){
  const s=Math.sin(-ang), co=Math.cos(-ang);
  return [(x*co - y*s)/CELL_PS + C, (x*s + y*co)/CELL_PS + C];
}
function cellToWorldA(fc,fr,ang){
  const lx=(fc-C)*CELL_PS, ly=(fr-C)*CELL_PS, s=Math.sin(ang), co=Math.cos(ang);
  return [lx*co - ly*s, lx*s + ly*co];
}
// ─── spawn y vuelo ─────────────────────────────────────────────────────────
// se decide con antelación para poder telegrafiarlo.
// El arco marca la ZONA; el ángulo real cae en algún punto dentro de ella.
// Las blancas NO pasan por aquí: tienen su propio ciclo y no se avisan.
function pickNext(){
  // un nivel puede reservar el color de la siguiente ficha (ver LEVELS): es un
  // disparo único y el azar recupera el mando en la ficha de después.
  const k = forceK !== null ? forceK : Math.floor(Math.random()*numColors());
  forceK = null;
  // La sinusoide SUSTITUYE a la radial, no se suma: mismo ritmo de fichas, otra
  // trayectoria para algunas. Nunca dos seguidas —el veto quita las rachas y deja
  // el 0.30 nominal en ~0.23 efectivo—, salvo que la pida el tutorial. `sway` es
  // el vaivén: "v" entra por los lados, "h" por arriba o por abajo. Desde el
  // nivel 7 va a medias, y ese azar solo se tira entonces: por debajo, la
  // secuencia de Math.random() es la de antes de existir la horizontal.
  let sway = forceSine;
  if (!sway && !prevSine && level >= 6 && Math.random() < sineChance())
    sway = level >= 7 && Math.random() < 0.5 ? "h" : "v";
  forceSine = null;
  prevSine = !!sway;
  if (sway){
    // Entrada exactamente sobre un eje cardinal, sin dispersión dentro del arco:
    // la onda se define respecto al centro y hacen falta ciclos enteros entre
    // entrada y centro para que la bola nazca sobre el eje. Cualquier desvío
    // rompe una de las dos cosas. Los ejes cardinales tampoco son estéticos: en
    // diagonal la cresta más lejana se saldría de la pantalla por el lado.
    const a = sway === "v" ? (Math.random()<0.5 ? 0 : Math.PI)
                           : (Math.random()<0.5 ? -Math.PI/2 : Math.PI/2);
    return { aArc:a, a, k, sine:true,
             cyc: 2 + Math.floor(Math.random()*2),
             sig: Math.random()<0.5 ? 1 : -1 };
  }
  const aArc = Math.random()*Math.PI*2;
  const a = aArc + (Math.random()-0.5)*TELEGRAPH_ARC*0.82;   // dentro del arco
  return { aArc, a, k };
}
// Las fichas nacen justo fuera del círculo, en la zona que acaba de marcar el
// arco de aviso, y ya con su velocidad normal.
function spawnNormal(n){
  const a = n.a, d = 0.52;
  const x = Math.cos(a)*d, y = Math.sin(a)*d;
  lastColorAngle = a;
  flying.push({ born:t, bonus:false, k:n.k, hard:false,
                x, y, px:x, py:y,
                ux:-Math.cos(a), uy:-Math.sin(a), sp:BUBBLE_SPEED,
                acc:FALL_ACCEL });
}
// Misma bolsa, mismo sitio de salida, otro camino: entra por el lateral y cruza
// serpenteando hasta el centro. `s` es la distancia sobre el eje al centro,
// positiva hacia la entrada, y λ sale de los ciclos —no se escribe a mano—, así
// que entrada y centro son nodos de la onda por construcción, para cualquier
// `cyc`. Que s=0 sea nodo es la propiedad de la que cuelga todo lo demás: la
// bola pasa por el centro exacto, donde la roca la espera desde reset(), así que
// no puede perderse ni rebasar el otro lado y no hace falta ninguna guarda.
// Factor que deja la duración de la travesía intacta al mover SINE_EASE: es el
// cociente entre las dos integrales del elemento de arco, la de la parametrización
// elegida y la de arco puro. El `ds` se cancela en el cociente, así que basta con
// los pesos. Con SINE_EASE=1 vale 1 y no hace nada. Se paga una vez por bola.
function sineCal(A, w, d){
  if (SINE_EASE === 1) return 1;
  let ie = 0, i1 = 0, M = 128;
  for (let i=0; i<=M; i++){
    const wt = (i===0 || i===M) ? 0.5 : 1;
    const h = Math.hypot(1, A*w*Math.cos(w*d*i/M));
    ie += wt*Math.pow(h, SINE_EASE); i1 += wt*h;
  }
  return ie/i1;
}
// El eje `ex,ey` es cardinal y se redondea: con cos(π) = −1 pero sin(π) = 1e-16,
// sin redondeo el vaivén vertical arrastraría un residuo en y. El vaivén va en la
// perpendicular, sin signo —de eso se encarga `sig`—, así que la bola es `eje·s +
// perp·A·sin(w·s)` para los dos vaivenes, y todo lo demás (integración en `s`,
// calibrado, hard drop, nodo en el centro) no sabe cuál es.
function sineAt(q, s){
  const o = q.sig*q.A*Math.sin(q.w*s);
  return [q.ex*s + Math.abs(q.ey)*o, q.ey*s + Math.abs(q.ex)*o];
}
function spawnSine(n){
  const a = n.a, d = 0.52;
  const ex = Math.round(Math.cos(a)), ey = Math.round(Math.sin(a));
  const x = ex*d, y = ey*d;
  const A = SINE_AMP, w = Math.PI*n.cyc/d;
  lastColorAngle = a;                      // las blancas siguen saliendo enfrente
  flying.push({ born:t, bonus:false, k:n.k, hard:false,
                x, y, px:x, py:y,
                sp:SINE_SPEED, acc:0,      // la sinusoide no cae: cruza
                sine:{ s:d, s0:d, ex, ey, sig:n.sig,
                       A, w, cal:sineCal(A, w, d) } });
}
// blanca: sin aviso, inmune al hard drop.
// Sale en el lado opuesto a la última ficha de color, para partir la atención.
function spawnWhite(){
  const base = (lastColorAngle===null ? Math.random()*Math.PI*2 : lastColorAngle) + Math.PI;
  const a = base + (Math.random()-0.5)*WHITE_SPREAD;
  const d = 0.52;
  const x = Math.cos(a)*d, y = Math.sin(a)*d;
  flying.push({ born:t, bonus:false, k:WHITE, hard:false,
                x, y, px:x, py:y,
                ux:-Math.cos(a), uy:-Math.sin(a), sp:BUBBLE_SPEED,
                acc:FALL_ACCEL });
}
// sale por el punto de anclaje del anillo, donde el arco acaba de cerrarse:
// el medidor y su premio comparten sitio, no solo momento.
function spawnBonus(){
  const a = GAUGE_A0;
  const x = Math.cos(a)*0.50, y = Math.sin(a)*0.50;
  flying.push({ born:t, bonus:true, th:a, r:0.50,
                dir: Math.random()<0.5?1:-1,
                x, y, px:x, py:y });
}

function stepFlying(dt){
  for (let i=flying.length-1; i>=0; i--){
    const b = flying[i];
    b.px = b.x; b.py = b.y;                           // origen del rayo del frame
    if (b.bonus){                                     // espiral hacia dentro
      // frenada de aproximación (ver SPIRAL_BRAKE_R): mismo factor en los dos
      // pasos, así que la espiral no se mueve, solo se recorre más despacio.
      const pace = Math.min(1, Math.max(SPIRAL_BRAKE, b.r/SPIRAL_BRAKE_R));
      b.th += SPIRAL_TANGENT*b.dir*dt*pace*(0.16/Math.max(b.r,0.05));
      b.r  -= SPIRAL_INWARD*dt*pace;
      b.x = Math.cos(b.th)*b.r; b.y = Math.sin(b.th)*b.r;
    } else {
      b.sp += (b.hard?HARD_ACCEL:b.acc)*dt;          // acelera al caer
      if (b.sine){
        // `sp` es velocidad sobre la trayectoria, no sobre el eje: mismo ritmo
        // aparente, y lo que se frena en las subidas es el avance en x. Ocupa el
        // mismo campo que la velocidad de una radial a propósito, y por eso el
        // hard drop funciona aquí sin tocarlo: acelera conservando la onda,
        // porque la longitud de onda es espacial y la forma no depende del ritmo.
        // La integración es de punto medio y subdividida, y ninguna de las dos
        // cosas sobra. En la cresta el radio de giro es de 0.19 celdas: un paso
        // de Euler ahí se salta el giro por fuera y la bola CORRE justo en la
        // curva —+54% a 60 fps, +400% con hard drop a 20—, que es lo único que
        // rompía la velocidad uniforme que se pide arriba. El punto medio quita
        // ese error a paso normal; subdividir cubre los pasos largos del hard
        // drop. Con las dos, 0% de desviación; a velocidad normal el bucle da
        // una vuelta.
        // `cal` mantiene la duración; el exponente reparte la velocidad. Los
        // subpasos se cuentan sobre el DESPLAZAMIENTO real, no sobre el avance
        // en el eje: con SINE_EASE bajo la bola vuela en los cruces y ahí es
        // donde hay que muestrear fino.
        const q = b.sine, rate = b.sp*q.cal;
        q.s0 = q.s;                                   // origen del rayo, en la onda
        const h0 = Math.hypot(1, q.A*q.w*Math.cos(q.w*q.s));
        const disp = rate*dt*Math.pow(h0, 1-SINE_EASE);
        const n = Math.max(1, Math.ceil(disp/SINE_MAX_STEP));
        for (let j=0; j<n; j++){
          const h = rate*dt/n;
          let sl = q.A*q.w*Math.cos(q.w*q.s);         // dy/ds al principio
          const sm = q.s - 0.5*h/Math.pow(Math.hypot(1, sl), SINE_EASE);
          sl = q.A*q.w*Math.cos(q.w*sm);              // y reevaluada en el medio
          q.s -= h/Math.pow(Math.hypot(1, sl), SINE_EASE);
        }
        // Aquí NO va ninguna guarda para el centro, y la tentación existe: con
        // SINE_EASE bajo la bola va más rápida justo en el nodo central, que es
        // donde vive la garantía de que una sinusoide no se pierde nunca. Pero
        // la curvatura cerrada está en las CRESTAS, no en los nodos: junto al
        // centro el trazado es localmente recto, así que la cuerda de rayCast()
        // pasa por el núcleo aunque el frame lo cruce. El peor avance ahí es de
        // 0.39 celdas (hard drop a 20 fps), y un barrido de 60 combinaciones de
        // variante, framerate, hard drop y desfase no rebasa el centro ni una vez.
        [b.x, b.y] = sineAt(q, q.s);
      } else {
        b.x += b.ux*b.sp*dt; b.y += b.uy*b.sp*dt;
      }
    }
    const shot = rayCast(b);
    if (shot){ flying.splice(i,1); land(b, shot); }
    else if (Math.hypot(b.x,b.y) > 0.75) flying.splice(i,1);
  }
}

// ─── aterrizaje por trazado de rayo ────────────────────────────────────────
// Una sola regla, y es la que hay que poder decir en voz alta: la bola se
// detiene en la última celda libre que atravesó. La colocación es función de la
// trayectoria y de nada más — no hay conjunto de candidatos, ni desempate por
// distancia, ni fallback: si el algoritmo necesitara uno es que la regla está
// mal formulada. Se traza el segmento recorrido en el frame, no la posición
// final, y eso es además lo que impide que un hard drop a 20 fps atraviese el
// montón entre dos frames.
//
// El recorrido es exacto, no muestreado, y la diferencia no es cosmética. Con
// muestreo, un segmento que pasa rozando la esquina entre dos celdas puede no
// caer NUNCA dentro de una de ellas: pertenece a esa celda durante menos de lo
// que mide un paso. Cuando la celda saltada era la libre del borde, `free` se
// quedaba a null y la bola moría contra la de detrás —una celda entera hacia
// dentro, con hueco libre delante—: era la muerte que no se entendía. Y de paso
// se va la dependencia del framerate.
//
// Los bordes de celda están en los semienteros, así que recorrerlas en orden es
// ir saltando al siguiente cruce —en c o en r, el que caiga antes—: `tc` y `tr`
// son la fracción del segmento a la que toca cada uno.

// Cuánto se prolonga el segmento hacia atrás, en celdas. 1.5 ya garantiza cruzar
// un borde de celda venga la bola por donde venga; 2 deja margen para que la
// celda de detrás también esté pillada sin que eso mate a nadie.
const RAY_BACK = 2;

// Cuánto puede separarse el trazado del camino real de la bola sobre el tablero,
// en celdas. Ver rayCast().
const RAY_SAG = 0.02;

// Recorre el vuelo del frame en coordenadas de grid. Devuelve el impacto —la
// primera celda jugable y ocupada— junto con la última libre atravesada, o null
// si el vuelo sigue. La ausencia de celda libre en el impacto es la condición de
// muerte. El recorrido se rehace entero cada frame: lo único que sobrevive de un
// frame al siguiente es `b.free`, y solo como red de seguridad revalidada —ver
// stale()—, nunca como respuesta directa.
//
// Lo que se recorre es el camino de la bola RELATIVO AL TABLERO, que es donde
// viven las celdas. Con el tablero girando ese camino es un arco, no una recta,
// y el error de trazarlo como cuerda crece con el cuadrado del giro del frame:
// su flecha es r·(1−cos(φ/2)). El giro por tick no tiene tope —un arrastre
// rápido pasa de 50°—, y con 20° en el borde la cuerda ya se mete 0.12 celdas: la bola
// moría contra el borde del montón estando todavía fuera del campo, o aterrizaba
// en una celda por la que nunca pasó. Así que el camino se trocea, y el número
// de trozos no es un umbral de velocidad sino lo que exige que ninguna cuerda
// se separe del arco más de RAY_SAG. Con 0.02 el teclado a 60 fps no llega a
// partir en ningún radio de vuelo: en juego normal es un solo trozo.
// La sinusoide curva el camino también en el mundo, y por la misma regla se
// trocea: con la cresta justo fuera del campo (ver SINE_AMP), un hard drop a 20
// fps separaba la cuerda de la onda 0.07 celdas junto al borde. Los trozos salen
// de la onda, no de la cuerda, con el mismo tope de separación. La cota es la de
// la cresta —la peor fase—, así que en los cruces sobra; a 60 fps sigue siendo
// un solo trozo, también con hard drop.
function rayCast(b){
  const dA = angle - anglePrev;
  const rc = Math.max(Math.hypot(b.px,b.py), Math.hypot(b.x,b.y))/CELL_PS;
  const phiMax = 2*Math.acos(Math.max(-1, 1 - RAY_SAG/rc));
  let n = Math.max(1, Math.ceil(Math.abs(dA)/phiMax));
  const q = b.sine;
  if (q){
    const wMax = 2*Math.acos(Math.max(-1, 1 - RAY_SAG*CELL_PS/q.A));
    n = Math.max(n, Math.ceil(q.w*Math.abs(q.s - q.s0)/wMax));
  }
  // los extremos del frame, exactos: un solo trozo es el trazado de siempre
  const at = u => u===0 ? [b.px, b.py, anglePrev]
                : u===1 ? [b.x, b.y, angle]
                : q ? [...sineAt(q, q.s0 + (q.s-q.s0)*u), anglePrev+dA*u]
                : [b.px+(b.x-b.px)*u, b.py+(b.y-b.py)*u, anglePrev+dA*u];
  for (let i=0; i<n; i++){
    const s = raySeg(b, ...at(i/n), ...at(i===n-1 ? 1 : (i+1)/n));
    if (s) return s;
  }
  return null;
}

// Un trozo: [x0,y0] en mundo con el tablero a `a0` → [x1,y1] con el tablero a `a1`.
function raySeg(b, x0, y0, a0, x1, y1, a1){
  // El origen se convierte con el ángulo del INICIO del trozo, que es el que el
  // tablero tenía cuando la bola estaba ahí. Con los dos extremos convertidos con
  // el mismo ángulo el barrido tangencial del giro se cancelaba solo y el rayo no
  // lo veía: a 340°/s en el borde son 0.72 celdas por frame contra las 0.052 que
  // avanza la bola por sí misma —14 veces más—, así que el montón le pasaba por
  // delante sin tocarla y encallaba a media celda de donde se la veía chocar.
  const [ac0,ar0] = worldToCellA(x0, y0, a0);
  const [bc,br]   = worldToCellA(x1, y1, a1);
  // ...y se prolonga hacia atrás sobre la misma recta. La bola viene de ahí en
  // línea recta, o sea que son celdas que recorrió de verdad, y volver a trazarlas
  // cada frame es lo que permite calcular `free` ENTERO contra el grid vivo. Antes
  // se arrastraba de un frame al siguiente, y dos bolas que compartieran celda en
  // vuelo —una blanca alcanzada por una de color en hard drop, cosa fácil con el tablero
  // vacío— anotaban las dos la misma celda libre: la segunda en aterrizar escribía
  // encima de la primera y una de las dos desaparecía. Ahora la segunda ve la
  // celda ocupada y se queda en la de detrás, que es justo donde está.
  // Prolongar NO mueve la recta: `fc,fr`, `rayDist()` y la dirección de la muerte
  // salen idénticos. Lo único que cambia es cuántas celdas se recorren —y que el
  // tramo de atrás NO puede frenar a la bola: ahí ya no está. `t0` es la fracción
  // en la que empieza el segmento de verdad, y una celda ocupada antes de `t0`
  // solo corta el rastro de libres (lo de más atrás es inalcanzable), nunca mata.
  const vc = bc-ac0, vr = br-ar0, L = Math.hypot(vc,vr);
  const back = L ? RAY_BACK/L : 0;
  const t0 = back/(1+back);
  const ac = ac0 - vc*back, ar = ar0 - vr*back;
  const dc = bc-ac, dr = br-ar;
  const ec = Math.round(bc), er = Math.round(br);
  const sc = dc>0?1:-1, sr = dr>0?1:-1;
  const ddc = dc ? Math.abs(1/dc) : Infinity, ddr = dr ? Math.abs(1/dr) : Infinity;
  let c = Math.round(ac), r = Math.round(ar);
  let tc = dc ? ((c+0.5*sc)-ac)/dc : Infinity;
  let tr = dr ? ((r+0.5*sr)-ar)/dr : Infinity;
  let tin = 0;                                 // fracción a la que se entró en (c,r)
  let free = null;                             // última libre atravesada, este frame
  // La misma celda, sin el filtro del campo: la última VACÍA que atravesó, sea del
  // campo o no. Es donde la bola se detendría si el tablero siguiera más allá, y es
  // lo que se dibuja cuando la partida acaba. Ver land().
  let slot = null;
  // tope de seguridad: ni el segmento de un frame ni la prolongación llegan a 3
  // celdas ni con hard drop a 20 fps, así que 64 celdas es holgura contra un NaN.
  for (let n=0; n<64; n++){
    if (playable(c,r)){
      if (grid[idx(c,r)]){
        // se sale de la celda después de `t0`: la bola está aquí o llega aquí
        if (Math.min(tc,tr) > t0){
          // Sin `slot` la bola ya está DENTRO de una celda ocupada: otra aterrizó
