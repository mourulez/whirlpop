          // en la celda por la que volaba —el grid no ve las bolas en vuelo— y su
          // rastro de atrás no la saca, porque con el tablero girando corre de lado
          // y cruza el montón. Hace snap en la celda no ocupada más cercana a
          // donde está: si es una libre del campo aterriza ahí; si no, es la de
          // fuera desde la que se la juzga. Así toda bola sin hueco tiene snap.
          if (!slot){
            slot = nearestOpen(ac+dc*t0, ar+dr*t0);
            if (playable(slot[0],slot[1])) free = slot;
          }
          // punto de ENTRADA en la celda: es donde la bola la toca, y de ahí sale
          // la posición visual desde la que la ficha se asienta hacia el centro.
          return { hit:[c,r], free:free||stale(b), slot, fc:ac+dc*tin, fr:ar+dr*tin,
                   ac, ar, bc, br };
        }
        free = slot = null;                    // tramo de atrás cortado
      } else free = slot = [c,r];
    } else slot = [c,r];                       // muro o exterior: no frena, pero sí cuenta
    if (c===ec && r===er) break;
    if (tc<tr){ tin = tc; c += sc; tc += ddc; }
    else      { tin = tr; r += sr; tr += ddr; }
    if (tin > 1) break;                        // pasado el final del segmento
  }
  if (free) b.free = free;                     // última libre conocida del vuelo
  return null;
}

// Red de seguridad, y solo eso: la última libre que la bola vio en frames
// anteriores, devuelta ÚNICAMENTE si sigue libre ahora. El recorrido de este
// frame ya cubre el caso normal; esto cubre el raro en que ni él ni la
// prolongación encuentran hueco, y evita que eso se lea como "no cabe". Sin la
// comprobación contra el grid vivo esta memoria es justo lo que hacía que una
// bola escribiera encima de otra.
function stale(b){
  const f = b.free;
  return f && playable(f[0],f[1]) && !grid[idx(f[0],f[1])] ? f : null;
}

// Celda no ocupada —libre del campo, o muro o exterior— más cercana a un punto
// en celdas. El anillo de fuera del array cuenta: el borde del disco está ahí.
function nearestOpen(pc, pr){
  let best = null, bd = Infinity;
  for (let r=-1; r<=N; r++) for (let c=-1; c<=N; c++){
    if (playable(c,r) && grid[idx(c,r)]) continue;
    const d = (c-pc)*(c-pc) + (r-pr)*(r-pr);
    if (d < bd){ bd = d; best = [c,r]; }
  }
  return best;
}

// distancia de un centro de celda a la recta del rayo, en celdas
function rayDist(c, r, s){
  const vx = s.bc-s.ac, vy = s.br-s.ar, L = Math.hypot(vx,vy);
  if (!L) return Math.hypot(c-s.ac, r-s.ar);
  return Math.abs((c-s.ac)*vy - (r-s.ar)*vx)/L;
}

// La celda de reposo es la última libre, salvo que esta y la del impacto sean
// diagonales entre sí: entonces manda una de las dos ortogonales intermedias, la
// más cercana al rayo. Si ninguna está libre la última libre es correcta y la
// bola queda encajada en la esquina, tocando dos bolas.
function restCell(s){
  if (!s.free) return null;
  const [c,r] = s.free, [hc,hr] = s.hit;
  if (Math.abs(c-hc)!==1 || Math.abs(r-hr)!==1) return s.free;
  const opts = [[c,hr],[hc,r]].filter(([p,q]) => playable(p,q) && !grid[idx(p,q)]);
  if (opts.length < 2) return opts[0] || s.free;
  return rayDist(opts[0][0],opts[0][1],s) <= rayDist(opts[1][0],opts[1][1],s)
       ? opts[0] : opts[1];
}

function land(b, s){
  // el bonus no ocupa celda: actúa sobre la celda del montón contra la que choca
  if (b.bonus){ applyBonus(s.hit); return; }

  const cell = restCell(s);
  // impactó sin haber tenido nunca una celda libre dentro del campo: no cabe.
  // Es la única muerte del juego, y es la misma en todas las direcciones.
  if (!cell){
    // La bola que no cabe NO desaparece: sale de `flying` como cualquier otra —el
    // vuelo ha terminado— pero se queda dibujada. Sin esto el último fotograma
    // enseña un game over sin causa a la vista.
    //
    // Y se dibuja HACIENDO SNAP, con la regla de siempre aplicada a `slot`: la
    // última celda vacía que atravesó, contando las de fuera del campo. No es un
    // apaño para colocarla "por fuera": es que morir ES eso. La bola se detiene
    // donde se detendría cualquier otra, solo que esa celda no pertenece al campo,
    // y esa es exactamente la definición de "no cabe". Por eso no hace falta
    // comprobar nada: si `slot` fuese del campo y estuviese libre, `free` no sería
    // null y no habría muerte. Cae fuera por construcción, en todas las
    // direcciones y gire el tablero lo que gire. raySeg() garantiza que existe.
    //
    // El cálculo anterior —una celda hacia atrás sobre el vector del rayo— dejaba
    // la bola fuera de la rejilla y dependía de una dirección que, desde que el
    // rayo ve el giro, es la relativa y no la suya: girando la ponía AL LADO del
    // montón en vez de por fuera, a veces encima de una casilla libre, que se lee
    // "pero si cabía".
    const o = { k:b.k, vc:s.slot[0], vr:s.slot[1], hit:s.hit };
    // Antes de morir se la juzga: puede cerrar un match desde fuera. Ver settleOut().
    // Solo espera una a la vez; la que llega mientras otra espera muere sin juicio.
    // La espera dura lo que un destello, y en ese rato no llega otra bola sin hueco.
    if (outBall) gameOver(o);
    else { outBall = o; settleOut(); }
    return;
  }
  place(b.k, cell, s.fc, s.fr);
}

// Ocupa `cell` con una ficha de color `k` que se ve en `vc,vr`, desde donde se
// asienta hacia el centro de la celda.
function place(k, cell, vc, vr){
  // `fresh`: aterrizó con un destello ya en curso, así que su match —si lo hace—
  // no lo ha provocado esa resolución. La marca viaja con la ficha, gravedad
  // incluida, y commitFlash() la lee para no cobrarlo como combo. Ver ahí.
  const nb = { k, age:0, vc, vr, fresh: flashT > 0 };
  grid[idx(cell[0],cell[1])] = nb;

  // El montón se asienta AQUÍ, en el aterrizaje, no solo al estallar.
  //
  // Antes la gravedad únicamente corría dentro de commitFlash(), así que una
  // bola que paraba contra un saliente —con hueco radialmente por dentro— se
  // quedaba colgada indefinidamente. El siguiente match, en cualquier punto del
  // tablero, disparaba el barrido global y esas bolas caían TODAS de golpe y en
  // la punta contraria: deuda vieja de otros disparos, no algo que ese match
  // hubiera soltado.
  //
  // Asentando al caer el montón está siempre estable, y entonces un match solo
  // puede mover lo que él mismo ha soltado: la cadena sigue ocurriendo, pero
  // ocurre donde el jugador está mirando. Casi ningún disparo desliza —la bola
  // sigue parando donde toca—, y el que lo hace desliza una celda, deslizamiento
  // que además se ve, porque `vc`/`vr` salen del punto de impacto.
  //
  // Con un destello en curso NO se asienta: flashSet guarda índices, y mover
  // fichas por debajo dejaría esos índices apuntando a celdas equivocadas.
  // No hace falta, además: el commitFlash() que viene lo asienta 0,19 s después.
  let ac = cell[0], ar = cell[1];
  if (flashT <= 0 && gravityPass()){
    for (let i=0;i<N*N;i++) if (grid[i] === nb){ ac = i%N; ar = (i/N)|0; break; }
  }
  refreshGroup(ac, ar);
  resolve();
}

// ─── la bola que no cabe ───────────────────────────────────────────────────
// La bola que no cabe hace snap fuera del campo, y ahí se la ve tocando a las
// suyas. Si con ellas suma un match y aun así se muere, el último fotograma
// enseña a la vez un trío y un game over. Así que antes de morir se resuelve
// como cualquier otra ficha: si hace match, estalla con su grupo y la partida
// sigue.
//
// No entra en el grid —su celda no es del campo, y en los lados rectos del
// disco ni siquiera existe en el array—. Vive en `outBall` y el match la ve como
// una celda más con el índice virtual OUT. Espera fuera mientras dure la
// resolución en curso, igual que una ficha `fresh`, y cuenta en cada búsqueda
// de match de esa resolución.
//
// Si mientras espera la gravedad vacía la celda contra la que chocó, aterriza
// ahí como una normal: morir al lado de un hueco se lee "pero si cabía".
//
// Solo espera una bola a la vez. Si muere otra mientras tanto, es game over.
const OUT = -1;
function outAdj(c,r){
  return !!outBall && Math.abs(c-outBall.vc) + Math.abs(r-outBall.vr) === 1;
}
function cellOf(i){ return i===OUT ? [outBall.vc, outBall.vr] : [i%N, (i/N)|0]; }

// Se llama al hacer snap y al final de cada destello mientras la bola espera.
function settleOut(){
  const o = outBall;
  if (!o || flashSet.has(OUT)) return;          // ya está estallando
  if (!grid[idx(o.hit[0], o.hit[1])]){
    outBall = null;
    place(o.k, o.hit, o.vc, o.vr);
    return;
  }
  if (flashT > 0) return;                       // espera a que acabe el destello
  comboDepth = 0;
  if (tryMatch()) return;
  outBall = null;
  gameOver(o);
}

// La única muerte del juego. `o` es la bola que no cabe, ya con su snap.
function gameOver(o){
  dead = true;
  deadBall = { k:o.k, vc:o.vc, vr:o.vr };
}

// ─── cadenas, colateral, gravedad ──────────────────────────────────────────
// Un match de 2 no estalla, pero reinicia el reloj de petrificación de las dos
// fichas: da una vía para gestionar una piedra incipiente sin necesidad de
// cerrar un match de 3. Se evalúa sobre el grupo de una ficha que acaba de
// cambiar de celda —la recién aterrizada o cualquiera que haya deslizado en el
// asentamiento—, que es la única forma de estrenar pareja: un grupo de 2 del
// mismo color no puede perder miembros, porque a 3 ya estalla. Un grupo de 3 o
// más no lo necesita, por lo mismo.
function refreshGroup(c,r){
  const g = grid[idx(c,r)];
  if (!g || g.k<0 || g.k===WHITE || g.k===STONE) return;
  const seen = new Uint8Array(N*N), st=[[c,r]], grp=[];
  seen[idx(c,r)]=1;
  while (st.length){
    const [a,b] = st.pop(); grp.push(idx(a,b));
    for (const [dc,dr] of NB){
      const p=a+dc, q=b+dr;
      if (!inb(p,q) || seen[idx(p,q)]) continue;
      const h = grid[idx(p,q)];
      if (h && h.k===g.k){ seen[idx(p,q)]=1; st.push([p,q]); }
    }
  }
  if (grp.length < 2 || grp.length >= CHAIN_MIN) return;
  // `rew` es solo dibujo: la edad que aún se ve mientras el aviso se deshace (easeVisual)
  grp.forEach(i=>{ const h = grid[i]; h.rew = Math.max(h.rew || 0, h.age); h.age = 0; });
}

// La bola de fuera (OUT) entra en los grupos por adyacencia con su celda de
// snap, pero nunca los empieza: sola no suma match.
function findPops(){
  const seen = new Uint8Array(N*N), out = new Set();
  let outSeen = false;
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    const g = grid[idx(c,r)];
    if (!g || seen[idx(c,r)] || g.k<0 || g.k===WHITE || g.k===STONE) continue;
    const st=[idx(c,r)], grp=[]; seen[idx(c,r)]=1;
    while (st.length){
      const i = st.pop(), [a,b] = cellOf(i); grp.push(i);
      for (const [dc,dr] of NB){
        const p=a+dc, q=b+dr;
        if (!inb(p,q) || seen[idx(p,q)]) continue;
        const h = grid[idx(p,q)];
        if (h && h.k===g.k){ seen[idx(p,q)]=1; st.push(idx(p,q)); }
      }
      if (!outSeen && i!==OUT && outAdj(a,b) && outBall.k===g.k){
        outSeen = true; st.push(OUT);
      }
    }
    if (grp.length >= CHAIN_MIN) grp.forEach(i=>out.add(i));
  }
  if (!out.size) return out;

  // colateral: blancas adyacentes, propagando entre blancas
  const q = [...out], wseen = new Set();
  while (q.length){
    const i = q.pop(), [c,r] = cellOf(i);
    for (const [dc,dr] of NB){
      const p=c+dc, s=r+dr;
      if (!inb(p,s)) continue;
      const h = grid[idx(p,s)];
      if (h && h.k===WHITE && !wseen.has(idx(p,s))){
        wseen.add(idx(p,s)); out.add(idx(p,s)); q.push(idx(p,s));
      }
    }
    if (i!==OUT && outAdj(c,r) && outBall.k===WHITE && !out.has(OUT)){
      out.add(OUT); q.push(OUT);
    }
  }
  return out;
}

// gravedad: UNA resolución por estallido, pero completa —
// cada ficha desliza hasta quedar bloqueada, sin dejar fichas flotando a medias.
// No es recursiva: no vuelve a lanzarse sola, la llama quien provoca el estallido.
function gravityPass(){
  let anyMoved = false;
  const movedBalls = new Set();
  for (let sweep=0; sweep<N*2; sweep++){
    const cells = [];
    for (let r=0;r<N;r++) for (let c=0;c<N;c++){
      const g = grid[idx(c,r)];
      if (g && g.k>=0) cells.push([c,r,Math.hypot(c-C,r-C)]);
    }
    // el orden decide qué bola reclama un hueco cuando dos podrían caer en él,
    // así que se ordena con la misma métrica con la que se mueve: euclídea.
    cells.sort((a,b)=>a[2]-b[2]);                     // de dentro hacia fuera
    let any = false;
    for (const [c0,r0] of cells){
      let c=c0, r=r0;
      if (!grid[idx(c,r)]) continue;
      for (let step=0; step<N*2; step++){             // agota el recorrido
        const dx = C-c, dy = C-r;
        if (!dx && !dy) break;
        // solo el vecino que más reduce el radio —el eje mayor, empate a X—. Si
        // está ocupado o no es jugable la bola NO se mueve, aunque tenga hueco
        // al lado: el rodeo lateral es lo que permitía a un match tirar de bolas
        // que no estaban radialmente por fuera de él. Contrapartida aceptada:
        // quedan bolas paradas junto a un hueco lateral, que es legible —no cayó
        // porque no estaba encima— y preferible a un rodeo que nadie anticipa.
        const mx = Math.abs(dx) >= Math.abs(dy);
        const p = mx ? c+Math.sign(dx) : c;
        const q = mx ? r : r+Math.sign(dy);
        if (!playable(p,q) || grid[idx(p,q)]) break;
        grid[idx(p,q)] = grid[idx(c,r)]; grid[idx(c,r)] = null;
        movedBalls.add(grid[idx(p,q)]);
        c=p; r=q; any = anyMoved = true;
      }
    }
    if (!any) break;                                  // ya está estable
  }
  // Lo que la gravedad deja emparejado estrena match de 2 igual que lo que
  // aterriza, así que cada ficha deslizada pasa por refreshGroup. Sin esto la
  // regla dependía de cómo se hubiera formado la pareja —al aterrizar sí, al
  // reconfigurarse el montón no—, y una piedra incipiente que quedaba pegada a
  // una igual por la caída del montón seguía corriendo hacia STONE_TIME.
  // Se hace al final, con el montón ya estable: una ficha puede deslizar en
  // varios barridos y solo cuenta el grupo de donde acaba.
  if (movedBalls.size)
    for (let i=0;i<N*N;i++) if (movedBalls.has(grid[i])) refreshGroup(i%N, (i/N)|0);
  return anyMoved;
}

// separa el conjunto estallado en grupos conexos, para un texto por match
function splitComponents(set){
  const rest = new Set(set), out = [];
  while (rest.size){
    const start = rest.values().next().value;
    const st=[start], comp=[]; rest.delete(start);
    while (st.length){
      const i = st.pop(); comp.push(i);
      const [c,r] = cellOf(i);
      for (const [dc,dr] of NB){
        const p=c+dc, s=r+dr;
        if (!inb(p,s)) continue;
        const j = idx(p,s);
        if (rest.has(j)){ rest.delete(j); st.push(j); }
      }
      // la de fuera puede unir dos trozos del campo que solo se tocan a través de ella
      if (i!==OUT && rest.has(OUT) && outAdj(c,r)){ rest.delete(OUT); st.push(OUT); }
    }
    out.push(comp);
  }
  return out;
}

// SINGLE_PASS: una sola pasada de gravedad por estallido.
// El match tiene prioridad: se comprueba antes de la gravedad y otra vez después de ella.
// ─── resolución en dos fases ───────────────────────────────────────────────
// 1. se detecta el match y las fichas destellan a blanco (sin desaparecer aún)
// 2. al acabar el destello se vacían, cae el montón y se busca el siguiente match
const FLASH_TIME = 0.19;
// flashBonus: el destello lo provocó la bomba, no un match
let flashT = 0, flashSet = new Set(), flashBonus = false, comboDepth = 0;
// un bonus que impacta con un destello en curso espera su turno en vez de pisarlo
let pendingBonus = null;


function tryMatch(){
  const pops = findPops();
  if (!pops.size) return false;
  flashSet = pops;
  flashBonus = false;
  flashT = FLASH_TIME;
  return true;
}

// llamada tras un aterrizaje: arranca una resolución nueva, combo a cero
function resolve(){ if (flashT > 0) return; comboDepth = 0; tryMatch(); }

// Multiplicador de puntuación por tamaño del grupo: uno más por cada bola sobre
// el mínimo (trío ×1, cuarteto ×2, quinteto ×3...). Entero, como el de combo:
// con base 5 toda puntuación acaba en 0 o 5 y no hay nada que redondear.
function scoreMultForSize(n){ return Math.max(1, n - (CHAIN_MIN-1)); }
// Multiplicador de combo: 1ª, 2ª, 3ª... cadena de la misma resolución
const COMBO_MULT = [1, 2, 3, 5, 7, 9];
function comboMult(){ return COMBO_MULT[Math.min(comboDepth, COMBO_MULT.length-1)]; }

function commitFlash(){
  const cm = comboMult();
  const chained = comboDepth > 0 && cascadeF;
  let first = null;                  // texto del primer eslabón, por si hay cadena

  if (flashBonus){
    const pts = flashSet.size*5;
    const f = addFloater([...flashSet], pts, BOMB_COL, BOMB_SHADE);
    flashSet.forEach(i=>{ if (grid[i]) grid[i]=null; });
    // barrido limpio: si no queda una sola bola, el premio se multiplica. El
    // texto lo cuenta como una cadena —dobla y engorda por pasos, con el ritmo
    // y los parámetros del combo— hasta el total, que es lo que sube el marcador.
    const clean = boardClean();
    if (clean) startClearX2(f);
    score += clean ? pts*CLEAR_MULT : pts;
  } else {
    // puntuación y carga se calculan POR GRUPO, no sobre el total. En cascada
    // los puntos no sacan texto propio: engordan el de la cadena (ver cascadeF)
    for (const comp of splitComponents(flashSet)){
      let tone = "#ffffff", shade = SHADE_WHITE;
      for (const i of comp){
        const g = i===OUT ? outBall : grid[i];
        if (g && g.k>=0 && g.k!==WHITE && g.k!==STONE){ tone = COL[g.k]; shade = SHADE[g.k]; break; }
      }
      const n = comp.length;
      const pts = n * 5 * scoreMultForSize(n) * cm;
      if (chained) cascadeF.pts += pts;
      else { const f = addFloater(comp, pts, tone, shade); if (!first) first = f; }
      score += pts;
      // sin carga disponible los matches puntúan igual pero no cargan nada: el
      // anillo aparece a cero cuando abre, sin arrastre de lo anterior.
      if (gaugeOn()){ gauge = Math.min(GAUGE_MAX, gauge + pts); launchOrbs(comp, pts); }
    }
    flashSet.forEach(i=>{ if (grid[i]) grid[i]=null; });
    if (flashSet.has(OUT)) outBall = null;
    if (chained){ cascadeF.links++; cascadeF.bump = 1; }
    // el primer match resuelto en la fase B del tutorial de controles la cierra
    if (ctrlPhase === "B") setCtrlPhase("C");
  }

  const wasBonus = flashBonus;
  flashSet = new Set(); flashBonus = false; flashT = 0;
  gravityPass();

  // encadena: si la caída formó match, sube el combo y vuelve a destellar.
  // Salvo que lo cierre una ficha aterrizada durante el destello: eso no es un
  // eslabón de esta cadena, es una jugada del jugador, y empieza su propio combo
  // desde cero. Antes se cobraba como combo del match anterior, que era regalo.
  const more = tryMatch();
  let byFresh = false;
  // la de fuera cuenta como `fresh`: su match también es jugada del jugador
  if (more) for (const i of flashSet) if (i===OUT || (grid[i] && grid[i].fresh)){ byFresh = true; break; }
  if (!more || byFresh) comboDepth = 0;
  else if (!wasBonus) comboDepth++;
  // el texto se retiene en el mismo commit que lo crea, antes de dibujarse: la
  // cadena ya se sabe aquí, así que un "+15" que va a crecer nunca se desvanece
  if (more && !byFresh && !wasBonus){ if (!cascadeF){ cascadeF = first; cascadeF.held = true; } }
  else if (cascadeF){ cascadeF.held = false; cascadeF = null; }
  // las marcas se consumen aquí: su destello ya se ha resuelto
  for (const g of grid) if (g && g.fresh) g.fresh = false;

  // el bonus esperó a que la resolución terminara entera, encadenados incluidos
  if (flashT <= 0 && pendingBonus !== null){
    const cell = pendingBonus; pendingBonus = null;
    fireBonus(cell);
  }
  // y la bola de fuera, a todo lo anterior, bonus incluido
  if (!dead) settleOut();
}

function stepFlash(dt){
  if (flashT <= 0) return;
  flashT -= dt;
  if (flashT <= 0) commitFlash();
}

// ─── bonus ─────────────────────────────────────────────────────────────────
// La forma del cráter la pone bombHits(); aquí está el cobro.
function applyBonus(cell){
  // La celda se fija en el IMPACTO, que es lo que el jugador vio, pero el
  // barrido puede tener que esperar: asignar flashSet con un destello en curso
  // borraba el match que estaba parpadeando —ni estallaba ni puntuaba—. La espera
  // no le quita nada al premio, porque lo que se guarda es de dónde salió el
  // cráter, no las celdas: el montón que se mueva mientras tanto también cae.
  if (flashT > 0){ pendingBonus = cell; return; }
  fireBonus(cell);
}
function fireBonus(cell){
  const hits = bombHits(cell[0], cell[1]);
  const kill = new Set();
  for (let q=0;q<N;q++) for (let s=0;s<N;s++){
    if (!hits(q,s)) continue;
    const g = grid[idx(q,s)];
    if (g && g.k>=0) kill.add(idx(q,s));   // la piedra central (k<0) no se toca
  }
  if (kill.size){
    flashSet = kill;
    flashBonus = true;
    flashT = FLASH_TIME;
    // la sacudida va con el destello visible del cráter, no con el impacto: el
    // bonus aplazado (pendingBonus) tiembla cuando estalla. Otra encima la
    // reinicia, sin sumar. Con movimiento reducido no hay sacudida.
    if (!reduceMotion.matches) shakeT = SHAKE_TIME;
  }
}

// ─── sacudida de la bomba ──────────────────────────────────────────────────
// Solo visual: `shakeT` corre en updateGame() pero nada de la partida lo lee. El
// ruido son dos senos desfasados, sin PRNG. Amplitud en CELL: escala con el tablero.
const SHAKE_AMP = 0.15, SHAKE_TIME = 0.30, SHAKE_HZ = 22;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
let shakeT = 0;
// desplazamiento de todo lo que no es fondo, en px CSS; null sin sacudida
function shakeOffset(alpha){
  if (shakeT <= 0) return null;
  const s = Math.min(SHAKE_TIME, shakeT + (1 - alpha)*SIM_DT);   // interpolado, como el pop
  const u = 1 - s/SHAKE_TIME, e = (1-u)*(1-u), a = SHAKE_AMP*CELL*e, w = u*SHAKE_TIME*TAU*SHAKE_HZ;
  return [a*Math.sin(w), a*Math.sin(w*0.83 + 1.3)];
}

// Barrido limpio: el bonus que no deja una sola bola en el tablero vale ×4. Se
// dobla en dos pasos para que el texto pueda contarlo (ver `x2` en los flotantes).
const CLEAR_X2 = 2, CLEAR_MULT = 1 << CLEAR_X2;
function boardClean(){
  if (outBall) return false;                            // la que espera fuera también cuenta
  for (const g of grid) if (g && g.k>=0) return false;   // la piedra central (k<0) no
  return true;
}

// ─── orbes de carga ────────────────────────────────────────────────────────
// La carga de un match no llega al anillo de golpe: cada bola suelta un orbe que
// vuela a la punta, y el arco crece con lo que llega. `gauge` suma en el
// commitFlash(), como siempre; `gaugeL` es lo ya llegado, y es lo que persigue
// el arco y lo que dispara la bomba (ver updateGame()). Son estado de partida:
// salen en el commit y llegan ORB_TRIP después, sin PRNG, así que la partida
// sigue siendo determinista. Las bolas de un grupo salen y llegan juntas, y el
// crédito del grupo va entero en la primera. Cada disparo abre una época: lo
// que estaba en vuelo de la anterior llega sin abonar, porque esa carga ya se
// cobró. El origen queda en el mundo: el tablero sigue girando y el orbe no.
// Todo lo que se ve, del destello a la punta, lo pinta drawCharge().
const ORB_TRIP = 0.5;                 // s del commit a la punta
let orbs = [];
// punta del arco para un valor de carga, en mundo
function gaugeTip(v){
  const a = GAUGE_A0 + Math.max(0, Math.min(1, v/GAUGE_MAX))*TAU;
  return [Math.cos(a)*GAUGE_RAD, Math.sin(a)*GAUGE_RAD];
}
// un orbe por bola del grupo, la de fuera incluida, desde su posición visual
function launchOrbs(comp, pts){
  comp.forEach((i, n) => {
    const b = i===OUT ? outBall : grid[i], [c,r] = cellOf(i);
    const [x,y] = cellToWorldA(b && b.vc!==undefined ? b.vc : c, b && b.vr!==undefined ? b.vr : r, angle);
    orbs.push({ x, y, age:0, a0:0, cr: n ? 0 : pts, ep:gaugeEpoch });
  });
}
function stepOrbs(dt){
  let arrived = false;
  for (let i=orbs.length-1;i>=0;i--){
    const o = orbs[i];
    if ((o.age += dt) < ORB_TRIP - 1e-9) continue;
    orbs.splice(i, 1); arrived = true;
    if (o.ep === gaugeEpoch) gaugeL = Math.min(gauge, gaugeL + o.cr);
  }
  if (arrived) ringGulp();            // un trago por llegada, no por orbe
}

// ─── textos flotantes de puntuación ────────────────────────────────────────
// Un texto por grupo, salvo en cascada: el del primer eslabón se queda quieto
// (`held`) y va sumando los siguientes, más grande en cada uno. Así los textos
// suman siempre lo que sube el marcador —un "+45" nunca se añade a un "+15"— y
// lo que crece se distingue de lo que se desvanece a la primera.
let floaters = [], cascadeF = null;
const FLOAT_LIFE = 1.15;
const FLOAT_HOLD = FLOAT_LIFE*0.16;   // fin de la entrada: ahí espera el retenido
const FLOAT_GROW = 0.25, FLOAT_GROW_MAX = 6;   // escala por eslabón, y hasta cuál
const FLOAT_BUMP = 0.18;              // golpe de escala al sumar un eslabón, en s

// centroide de un conjunto de celdas, en posición visual
function popCentroid(cells){
  let sc=0, sr=0;
  for (const i of cells){ const [c,r] = cellOf(i); sc += c; sr += r; }
  return [sc/cells.length, sr/cells.length];
}
// `lastTone` es solo presentación: tiñe el salto del marcador (ver frame())
let lastTone = null;
function addFloater(cells, pts, tone, shade){
  const [fc,fr] = popCentroid(cells);
  const f = { fc, fr, pts, tone, shade, life:0, rise:0, held:false, links:1, bump:0, x2:0, x2T:0 };
  floaters.push(f);
  lastTone = tone;
  return f;
}
// arranca el doblado del barrido limpio: se retiene quieto mientras dobla
function startClearX2(f){ f.held = true; f.x2 = CLEAR_X2; f.x2T = FLASH_TIME; }
function stepFloaters(dt){
  for (let i=floaters.length-1;i>=0;i--){
    const f = floaters[i];
    // cada paso duplica el número y lo engorda, como un eslabón de cascada; al
    // gastar el último se suelta y se desvanece ya con el total puesto
    if (f.x2 > 0 && (f.x2T -= dt) <= 0){
      f.pts *= 2; f.links++; f.bump = 1; f.x2T = FLASH_TIME;
      if (--f.x2 === 0) f.held = false;
    }
    f.life = f.held ? Math.min(f.life+dt, FLOAT_HOLD) : f.life+dt;
    f.rise += dt*1.05;                             // `rise` en celdas: ver "conversiones"
    f.bump = Math.max(0, f.bump - dt/FLOAT_BUMP);
    if (f.life > FLOAT_LIFE) floaters.splice(i,1);
  }
}
function drawFloaters(){
  for (const f of floaters){
    const p = f.life/FLOAT_LIFE;
    const [x,y] = cellToScreen(f.fc, f.fr);
    const grow = 1 + FLOAT_GROW*(Math.min(f.links, FLOAT_GROW_MAX)-1) + 0.3*f.bump;
    const scale = (p<0.16 ? 0.55 + 0.45*(p/0.16)*1.35 : 1.12 - 0.12*p) * grow;
    cx.save();
    cx.globalAlpha = p<0.72 ? 1 : 1-(p-0.72)/0.28;
    cx.translate(x, y - f.rise*CELL);
    cx.scale(scale, scale);
    // Baloo tiene la mayúscula baja (0,60 em) y la caja alta: más cuerpo que una
    // mono y centrado a mano sobre la línea base, porque "middle" la descentra.
    // Tres pasadas: filo de tinta, filo de la sombra de la joya y relleno.
    const fpx = Math.round(CELL*1.12), txt = "+"+f.pts, ty = 0.30*fpx;
    cx.font = `800 ${fpx}px "Whirlpop Baloo", sans-serif`;
    cx.textAlign = "center"; cx.textBaseline = "alphabetic"; cx.lineJoin = "round";
    cx.lineWidth = Math.max(5, CELL*0.3);
    cx.strokeStyle = "#231a4c";
    cx.strokeText(txt, 0, ty);
    cx.lineWidth = Math.max(3, CELL*0.17);
    cx.strokeStyle = f.shade;
    cx.strokeText(txt, 0, ty);
    cx.fillStyle = f.tone;
    cx.fillText(txt, 0, ty);
    cx.restore();
  }
}

// ─── animación de posiciones dentro del grid ───────────────────────────────
const FALL_EASE = 15;
function easeVisual(dt){
  const k = Math.min(1, FALL_EASE*dt);
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    const b = grid[idx(c,r)]; if (!b) continue;
    if (b.vc === undefined){ b.vc = c; b.vr = r; }
    b.vc += (c - b.vc)*k;
    b.vr += (r - b.vr)*k;
    // el aviso desanda su camino a ritmo fijo: entero en STONE_REWIND s
    if (b.rew) b.rew = b.rew > STONE_WARN ? b.rew - dt*(STONE_TIME-STONE_WARN)/STONE_REWIND : 0;
  }
}

// ─── petrificación ─────────────────────────────────────────────────────────
// El reloj de cada bola corre desde el primer segundo de partida, así el tutorial
// del nivel 2 no llega a un tablero recién puesto a cero: al abrirse, las bolas
// que el jugador no ha sabido limpiar ya están envejecidas, los avisos aparecen
// de golpe sobre ellas y la primera piedra cae poco después. Se explica una
// amenaza en curso, no una que empieza a contar en ese instante.
// Guarda: antes del nivel 2 la edad no pasa de `t`. Sin tutorial de controles no
// hace nada —una bola nace con `t` ya corriendo y suma los mismos `dt`—, pero el
// tutorial retiene `t` en 19 y el jugador puede quedarse en él más de 34 s. Con la
// invariante anotada en LEVELS ninguna edad alcanza STONE_TIME antes de que abra
// el nivel 2, y al abrir el tablero llega envejecido hasta 19 s como mucho: los
// avisos aparecen de golpe y la primera piedra cae poco después. El anillo de
// aviso sí se esconde en el nivel 1, porque ese llega mucho antes que la piedra.
// Tutorial del nivel 2: las bolas de color más viejas de la superficie —con un
// hueco jugable al lado, donde se ven y donde el jugador aún podría salvarlas— se
// ponen a STONE_DEMO s de petrificarse, una tras otra dentro de la ventana de
// lectura (6,3 s). Su aviso sale ya agrietado y avanza deprisa, y las piedras caen de
// una en una con el texto a la vista. Ninguna se rejuvenece, y lo que está
// destellando no cuenta: va a estallar. Sin azar: se desempata por índice.
const STONE_DEMO = [2, 3.5, 5];
function stoneDemo(){
  const cand = [];
  for (let i=0;i<N*N;i++){
    const g = grid[i];
    if (!g || g.k<0 || g.k===WHITE || g.k===STONE || flashSet.has(i)) continue;
    const c = i%N, r = (i/N)|0;
    if (NB.some(([dc,dr]) => playable(c+dc,r+dr) && !grid[idx(c+dc,r+dr)])) cand.push(g);
  }
  cand.sort((a,b) => b.age - a.age);          // estable: a igual edad, por índice
  STONE_DEMO.forEach((s,j) => {
    if (cand[j]) cand[j].age = Math.max(cand[j].age, STONE_TIME - s);
  });
}
function ageBubbles(dt){
  for (let i=0;i<N*N;i++){
    const g = grid[i];
    // la piedra central, las piedras y las blancas no envejecen
    if (!g || g.k<0 || g.k===STONE || g.k===WHITE) continue;
    g.age += dt;
    if (level < 2 && g.age > t) g.age = t;
    if (g.age > STONE_TIME) g.k = STONE;
  }
}
// ─── input ─────────────────────────────────────────────────────────────────
// La velocidad angular sale de la "energía" del gesto: un arrastre corto y lento
// gira despacio; uno amplio y rápido gira deprisa.
//
// Dos perfiles de constantes, no dos modos: NO hay detección de dispositivo.
// Cada pointerdown elige perfil por su propio e.pointerType, así que un portátil
// táctil alterna dedo y ratón en la misma sesión sin recargar. "pen" va con táctil.
const PROFILE = {
  touch: {
    DRAG_PX_SLOW: 18,      // px por paso con gesto suave
    DRAG_PX_FAST: 7,       // px por paso con gesto enérgico
    SPEED_REF:    1400,    // px/s considerados gesto enérgico
    SPEED_EMA:    0.30,    // suavizado de la medida de velocidad
    HOLD_SLOW:    0.125,   // periodo del giro mantenido, gesto suave
    HOLD_FAST:    0.028,   // periodo del giro mantenido, gesto enérgico
    TAP_MS:       200      // toque rápido sin arrastre = hard drop
  },
  mouse: {
    DRAG_PX_SLOW: 26,
    DRAG_PX_FAST: 10,
    SPEED_REF:    2600,    // con 1400 el ratón satura y energy se queda en 1
    SPEED_EMA:    0.30,
    // ── los dos números a tocar para calibrar el mantenido con ratón ──
    HOLD_SLOW:    0.125,   // iguales al táctil a propósito; pendiente de probar en pantalla
    HOLD_FAST:    0.028,
    TAP_MS:       300      // un clic con intención de disparo pasa de 200 ms a menudo
  }
};
let prof = PROFILE.touch;

// teclado: toque corto = un paso discreto; mantenido = velocidad angular creciente
const KEY_DAS         = 0.16;   // s antes de pasar de paso discreto a continuo
const KEY_W_MIN       = 70;     // °/s al arrancar el continuo (un toque cada DAS ≈ 47°/s)
const KEY_W_MAX       = 340;    // °/s al final de la rampa
const KEY_RAMP_TIME   = 0.75;   // s hasta velocidad máxima
const KEY_RAMP_RETAIN = 0.20;   // s que la rampa se conserva tras soltar todo
const KEY_RAMP_DECAY  = 0.35;   // s de decaimiento a cero tras la retención
const DEG = Math.PI/180;

function rotate(d){ angleT += d*ROT_STEP; }
const lerp = (a,b,p)=>a+(b-a)*p;
function dragPx(){ return lerp(prof.DRAG_PX_SLOW, prof.DRAG_PX_FAST, energy); }
function holdRate(){ return lerp(prof.HOLD_SLOW, prof.HOLD_FAST, energy); }

const UI = "#fs, #pz, .ovl";

// Modelo: el dedo manda.
//  - dedo levantado      -> no gira
//  - arrastrando         -> gira en la dirección del arrastre, a su ritmo
//  - pulsado y quieto    -> sigue en la dirección y al ritmo del último arrastre
//  - sin arrastre previo -> no gira
// El ratón entra por este mismo camino, solo con otro perfil de constantes.

// acelera la ficha normal más avanzada hacia el montón
function hardDrop(){
  if (dead) return;
  let best=null, bd=Infinity;
  for (const b of flying){
    if (b.bonus || b.hard || b.k===WHITE) continue;
    const d = Math.hypot(b.x, b.y);
    if (d < bd){ bd = d; best = b; }
  }
  if (!best) return;
  best.hard = true;
  best.sp = Math.max(best.sp, HARD_SPEED);
}

// Los listeners cuelgan del canvas, no de window, para poder capturar el puntero:
// sin captura, sacar el ratón de la ventana con el botón apretado se come el
// pointerup y el tablero se queda girando solo.
cv.addEventListener("pointerdown", e=>{
  if (e.button !== 0) return;                        // solo botón izquierdo
  if (ptrDown) return;                               // un solo puntero por gesto
  if (e.target.closest && e.target.closest(UI)) return;
  e.preventDefault();                                // sin arrastre fantasma del navegador
  prof = e.pointerType === "mouse" ? PROFILE.mouse : PROFILE.touch;
  setInputMode(e.pointerType === "mouse" ? "desktop" : "touch");
  ptrId = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  hideCursor();
  ptrDown = true; dragAcc = 0; dir = 0; rotT = 0; energy = 0;
  ptrX = e.clientX; lastMoveT = performance.now();
  ptrT = performance.now(); ptrMoved = false;
}, {passive:false});

cv.addEventListener("pointermove", e=>{
  if (!ptrDown || e.pointerId !== ptrId) return;
  const now = performance.now();
  const dt = Math.max(8, now - lastMoveT) / 1000;
  lastMoveT = now;

  const dx = e.clientX - ptrX;
  ptrX = e.clientX;

  // energía del gesto: velocidad instantánea suavizada, normalizada a 0..1
  const inst = Math.min(1, Math.abs(dx)/dt / prof.SPEED_REF);
  energy += (inst - energy) * prof.SPEED_EMA;

  dragAcc += dx;
  const px = dragPx();
  if (Math.abs(dragAcc) >= px){
    const d = Math.sign(dragAcc);
    while (Math.abs(dragAcc) >= px){ rotate(d); dragAcc -= d*px; }
    dir = d;
    ptrMoved = true;
    ctrlTurn = true;                     // giro efectivo: avanza la fase A del tutorial
    rotT = holdRate();
  }
}, {passive:true});

// drop=false cierra el gesto sin disparar: cancelación, pérdida de captura o de foco.
function ptrEnd(drop){
  if (!ptrDown) return;
  const quick = (performance.now() - ptrT) < prof.TAP_MS;
  ptrDown = false; ptrId = null; dir = 0; energy = 0;
  if (drop && !ptrMoved && quick) hardDrop();      // toque limpio y rápido
}
cv.addEventListener("pointerup", e=>{ if (e.pointerId === ptrId) ptrEnd(true); });
cv.addEventListener("pointercancel", e=>{ if (e.pointerId === ptrId) ptrEnd(false); });
cv.addEventListener("lostpointercapture", e=>{ if (e.pointerId === ptrId) ptrEnd(false); });
cv.addEventListener("contextmenu", e=> e.preventDefault());

// ── cursor ────────────────────────────────────────────────────────────────
// Jugando sobra: el arrastre mide cuánto se mueve el ratón, no dónde está, y con
// teclado solo tapa el tablero. Se oculta al pulsar sobre el lienzo —la captura
// lo mantiene oculto aunque el arrastre salga de él— y tras CURSOR_IDLE_MS
// quieto. Vuelve al moverlo sin botón, para llegar a pausa o a pantalla completa.
// En pausa y game over no se oculta, y de todos modos el telón tapa el lienzo con
// su propio cursor. Es interfaz, no partida: va a reloj real, fuera del tick.
const CURSOR_IDLE_MS = 2000;
let cursorT = 0;
function hideCursor(){ clearTimeout(cursorT); cv.classList.add("nocur"); }
function wakeCursor(){
  cv.classList.remove("nocur");
  clearTimeout(cursorT);
  cursorT = setTimeout(function idle(){
    if (paused || dead) cursorT = setTimeout(idle, CURSOR_IDLE_MS);
    else cv.classList.add("nocur");
  }, CURSOR_IDLE_MS);
}
cv.addEventListener("pointermove", ()=>{ if (!ptrDown) wakeCursor(); }, {passive:true});
wakeCursor();

// ── trackpad ──────────────────────────────────────────────────────────────
// Dos dedos en horizontal giran como un arrastre: llega como `wheel` y no pasa
// por el puntero, así que tiene su propio acumulador y convive con arrastre y
// teclado sin tocar su estado. Solo el eje X: el vertical giraría el tablero con
// cualquier scroll sin querer. Con ctrlKey es el pellizco de zoom: no es nuestro.
// preventDefault (y overscroll-behavior en el CSS) evita que el deslizamiento
// horizontal de macOS sea "página anterior" y te saque del juego. La inercia de
// macOS sigue mandando eventos un rato tras levantar los dedos y la web no la
// distingue de los reales: el tablero sigue girando un poco, como un impulso.
// También lo usan los touchpads de Windows y las ruedas que se inclinan.
const WHEEL_PX   = 20;   // px de desplazamiento por paso; pendiente de calibrar en Mac y Windows
const WHEEL_SIGN = -1;   // desplazamiento natural (Mac): dedos a la derecha dan deltaX < 0
addEventListener("wheel", e=>{
  if (e.ctrlKey) return;
  e.preventDefault();
  if (paused || dead || !e.deltaX) return;
  const px = e.deltaX * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerWidth : 1);
  wheelAcc += WHEEL_SIGN * px;
  if (Math.abs(wheelAcc) < WHEEL_PX) return;
  const d = Math.sign(wheelAcc);
  while (Math.abs(wheelAcc) >= WHEEL_PX){ rotate(d); wheelAcc -= d*WHEEL_PX; }
  setInputMode("desktop");
  ctrlTurn = true;                       // giro efectivo: avanza la fase A del tutorial
}, {passive:false});

// ── teclado ───────────────────────────────────────────────────────────────
// Toque corto = un paso discreto exacto. Mantenido = velocidad angular creciente.
// Por e.code, no por e.key: con Shift o Bloq Mayús llega "A"/"D" y el keyup no
// matchearía, dejando la rotación enganchada. Y heldKeys es una pila, no un
// escalar: soltar ← teniendo → pulsada tiene que seguir girando a la derecha.
const KEY_DIRS = { ArrowLeft:-1, KeyA:-1, ArrowRight:1, KeyD:1 };
function recalcKeyDir(){
  keyDir = heldKeys.length ? KEY_DIRS[heldKeys[heldKeys.length-1]] : 0;
}

addEventListener("keydown", e=>{
  if (dead && (e.key===" "||e.key==="Enter")){ reset(); return; }
  // en pausa el teclado solo reanuda: nada se acumula para el tick de vuelta
  if (paused){
    if (e.key==="Escape"||e.code==="KeyP"||e.key===" "||e.key==="Enter"){ e.preventDefault(); resume(); }
    return;
  }
  if (e.key==="Escape"||e.code==="KeyP"){ e.preventDefault(); pause(); return; }
  if (KEY_DIRS[e.code] !== undefined){
    e.preventDefault();
    setInputMode("desktop");
    ctrlTurn = true;
    if (e.repeat) return;                  // la repetición la conduce el juego, no el SO
    if (heldKeys.indexOf(e.code) < 0) heldKeys.push(e.code);
    recalcKeyDir();

// ─── pausa ─────────────────────────────────────────────────────────────────
// Con `paused` frame() no simula: el tiempo no corre y la partida queda idéntica
// a como estaba; draw() sigue pintando por si cambia la ventana. Se entra por el
// botón, por teclado (P, Esc) o al perder el foco. Perder el foco es cualquiera
// de los tres: blur (Alt-Tab, clic fuera, barra de direcciones), pestaña oculta
// y pagehide —iOS no siempre avisa de lo segundo al cambiar de app, y así el
// bfcache devuelve la página ya en pausa—. Con la partida muerta no hay nada que
// parar: manda el game over. Se sale solo a mano: volver no reanuda.
// El selector de apps de iOS (arrastrar hacia arriba) no dispara ninguno de los
// tres: la app queda inactiva, no oculta, y la miniatura sigue jugando. Lo único
// que llega es el toque que el sistema le quita a la página: pointercancel. Con
// touch-action:none el navegador no cancela nunca un toque por su cuenta, así

// centro de control, notificaciones, el gesto de atrás de Android. Si el gesto
// empieza fuera de la página —la barra inferior de Safari—, no llega nada.
// Tampoco en Brave para iPad: su interfaz se queda el toque antes de que llegue
// a la página (medido con un registro de eventos: ni pointerdown). Safari y
// Chrome en iPad, también WebKit, sí pausan. No es cosa del motor ni tiene
// arreglo desde aquí: ningún navegador avisa al entrar en el selector
// (w3c/page-visibility#59, WebKit 205942).

// si cambian: el game over lo pide en cada frame.

  el.innerHTML = score + " <small>" + tr("points") + "</small>";

// Fondo del telón: la gama activa de abajo, mezclada al 45 % con negro. Se fija
// al abrirlo, no en cada frame.

// Botones del chrome y del telón: se hunden al apretar y actúan al soltar, como
// un botón nativo. Actuar en pointerdown cerraba el telón antes de pintar el
// botón hundido. La captura hace llegar el move y el up aunque el dedo salga:
// fuera del botón se levanta y soltar ahí no hace nada; volver a entrar lo
// recupera. Un solo puntero por botón. El rectángulo se mide al apretar, antes
// de hundirlo: medido hundido, el borde de arriba se movería con el labio y un
// dedo justo ahí parpadearía. Si el botón desaparece mientras tanto (Esc, Espacio)
// mide cero y soltar no hace nada.
function tapBtn(el, fn){
  let id = null, box = null;
  const inside = e => el.getClientRects().length > 0 &&
    e.clientX >= box.left && e.clientX <= box.right &&
    e.clientY >= box.top  && e.clientY <= box.bottom;
  const end = () => { id = null; el.classList.remove("press"); };
  el.addEventListener("pointerdown", e=>{
    if (e.button !== 0) return;                      // botón principal o cualquier toque
    e.preventDefault(); e.stopPropagation();
    if (id !== null) return;
    id = e.pointerId; box = el.getBoundingClientRect();
    try { el.setPointerCapture(id); } catch(_){}
    el.classList.add("press");
  });
  el.addEventListener("pointermove", e=>{
    if (e.pointerId === id) el.classList.toggle("press", inside(e));
  });
  el.addEventListener("pointerup", e=>{
    if (e.pointerId !== id) return;
    const hit = inside(e);
    end();
    if (hit) fn();
  });
  el.addEventListener("pointercancel", e=>{ if (e.pointerId === id) end(); });
  el.addEventListener("lostpointercapture", e=>{ if (e.pointerId === id) end(); });

const BUB_ILOG = 1/Math.log(BUB_STEP);
